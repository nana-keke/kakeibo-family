<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>may's shop 売上表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF9;
    --rule:#E2E6E0;
    --rule-strong:#C6CCC4;
    --ink:#2B2F36;
    --ink-soft:#79808A;
    --ink-faint:#A8AEB6;
    --seal:#9A3B34;
    --pen:#3D5C7E;
    --minus:#9A3B34;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}

  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 96px}

  header.masthead{display:flex;align-items:baseline;gap:14px;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
  .title{font-family:"Shippori Mincho",serif;font-weight:700;font-size:30px;letter-spacing:.16em}
  .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.14em;margin-left:auto}
  .modeline{font-size:11px;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:26px}

  nav.tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--rule-strong)}
  nav.tabs button{background:none;border:0;cursor:pointer;font-family:inherit;
    font-size:13px;letter-spacing:.1em;color:var(--ink-soft);
    padding:9px 18px;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button[data-on="1"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
  nav.tabs button:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
  nav.tabs .count{font-size:10px;color:var(--seal);margin-left:6px;font-variant-numeric:tabular-nums}

  /* --- ledger table --- */
  .ledger{width:100%;border-collapse:collapse;font-size:13px}
  .ledger th{font-weight:500;font-size:10px;letter-spacing:.16em;color:var(--ink-soft);
    text-align:right;padding:0 8px 7px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
  .ledger th:first-child,.ledger th.l{text-align:left}
  .ledger td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
  .ledger td.l{text-align:left}
  .ledger tbody tr:hover{background:#F3F4F1}
  .date{font-family:"Shippori Mincho",serif;font-size:13px;letter-spacing:.04em;color:var(--ink-soft)}
  .venue{font-weight:500}
  .memo{font-size:10px;color:var(--ink-faint);margin-left:7px;letter-spacing:.06em}
  .plus{color:var(--pen)}
  .minus{color:var(--minus)}
  .zero{color:var(--ink-faint)}

  /* --- unsettled: brace grouping = the paper ledger's 括弧 --- */
  .group{margin-bottom:30px}
  .group-head{display:flex;align-items:baseline;gap:12px;
    border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:2px}
  .group-name{font-family:"Shippori Mincho",serif;font-size:17px;letter-spacing:.14em}
  .group-rate{font-size:10px;color:var(--ink-soft);letter-spacing:.1em}
  .group-total{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums}
  .brace{position:relative;padding-left:26px}
  .brace::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:9px;
    border:1px solid var(--rule-strong);border-right:0;border-radius:7px 0 0 7px}
  .sealbox{display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border:1px solid var(--seal);color:var(--seal);
    font-family:"Shippori Mincho",serif;font-size:11px;border-radius:2px;
    transform:rotate(-4deg);letter-spacing:0}
  .empty{padding:34px 0;text-align:center;color:var(--ink-faint);font-size:12px;letter-spacing:.1em}

  /* --- settlements --- */
  .stl{border:1px solid var(--rule-strong);background:#fff;padding:16px 18px;margin-bottom:20px}
  .stl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:2px}
  .stl-period{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
  .stl-sum{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .stl-sum b{color:var(--ink);font-size:14px;margin-left:4px}
  .stl-foot{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
  .diff{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .pick{width:36px}
  .pick input{width:20px;height:20px;accent-color:var(--pen)}

  /* --- form --- */
  form.sheet{border:1px solid var(--rule-strong);padding:20px;margin-bottom:26px;background:#fff}
  .legend{font-family:"Shippori Mincho",serif;font-size:14px;letter-spacing:.16em;
    margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .f{display:flex;flex-direction:column;gap:5px}
  .f.wide{grid-column:span 2}
  .f label{font-size:10px;letter-spacing:.14em;color:var(--ink-soft)}
  .f input,.f select{font-family:inherit;font-size:14px;color:var(--ink);
    border:0;border-bottom:1px solid var(--rule-strong);background:none;
    padding:6px 2px;width:100%}
  .f input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
  .f input:focus,.f select:focus{outline:0;border-bottom-color:var(--pen)}
  .f input:focus-visible{outline:0}
  .split{margin-top:20px;padding-top:16px;border-top:1px dashed var(--rule-strong)}
  .split .cap{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:12px}
  .actions{display:flex;align-items:center;gap:16px;margin-top:22px}
  .preview{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .preview b{font-size:15px;color:var(--ink);font-weight:700;margin-left:6px}
  button.primary{margin-left:auto;font-family:inherit;font-size:13px;letter-spacing:.14em;
    background:var(--ink);color:var(--paper);border:0;padding:11px 26px;cursor:pointer}
  button.primary:hover{background:#41474F}
  button.ghost{font-family:inherit;font-size:11px;letter-spacing:.1em;
    background:none;border:1px solid var(--rule-strong);color:var(--ink-soft);
    padding:5px 12px;cursor:pointer}
  button.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
  button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

  .foot{margin-top:34px;padding-top:12px;border-top:2px solid var(--ink);
    display:flex;gap:26px;font-size:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .foot span{color:var(--ink-soft);letter-spacing:.1em}
  .foot b{color:var(--ink);margin-left:6px;font-size:14px}

  @media(max-width:640px){
    .wrap{padding:22px 14px 80px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .f.wide{grid-column:span 2}
    .ledger .hide-sm{display:none}
    .title{font-size:24px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ============================================================
   設定：ここに自分の Firebase の値を入れると同期が有効になる。
   空のままなら、この端末のメモリ上だけで動く（リロードで消える）。
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyClcn7gdyPAnO3J9Ho8_yAc59vlwb7i5II",
  authDomain: "kakeibo-family-874a4.firebaseapp.com",
  databaseURL: "https://kakeibo-family-874a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kakeibo-family-874a4",
  storageBucket: "kakeibo-family-874a4.firebasestorage.app",
  messagingSenderId: "1037397086146",
  appId: "1:1037397086146:web:bf832935bd57e8c260505b"
};

/* このアプリ専用のルートノード。家計簿など他アプリと同じ Firebase を共有するため、
   読み書きはすべてこの配下に閉じる。ルート直下には触らない。 */
const APP_ROOT = "detenLedger";

const RATE = { credit: 0.0248, paypay: 0.0198 };   // 手数料率
const METHODS = [
  { key:"cash",   label:"現金",       rate:0 },
  { key:"credit", label:"クレジット", rate:RATE.credit },
  { key:"paypay", label:"PayPay",     rate:RATE.paypay }
];
const RECEIVABLE = METHODS.filter(m => m.rate > 0);

const yen = n => (n<0?"△":"") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const fee = (amt, rate) => Math.floor(amt * rate);

/* ---- storage ---- */
let appRef = null, eventsRef = null, settlementsRef = null;
const live = !!FIREBASE_CONFIG.databaseURL;
if (live) {
  firebase.initializeApp(FIREBASE_CONFIG);
  appRef         = firebase.database().ref(APP_ROOT);
  eventsRef      = appRef.child("events");
  settlementsRef = appRef.child("settlements");
}

/* ---- 一件の損益 ---- */
function profitOf(e){
  const gross = METHODS.reduce((s,m) => s + (e[m.key]||0), 0);
  const fees  = METHODS.reduce((s,m) => s + fee(e[m.key]||0, m.rate), 0);
  return { gross, fees, net: gross - fees - (e.fee||0) - (e.transit||0) };
}

/* ---- 売掛の突合 ----
   突合は gross（売上総額）で行う。手数料は決済1件ごとに切り捨てられるため、
   日次合計に floor をかけている当アプリの手数料額とは数円ずれる。gross はずれない。
   メール記載の手数料は settlement 側に持ち、表示にだけ使う（損益の計算式は変えない）。 */
const labelOf = k => (METHODS.find(m => m.key === k) || {}).label || k;

/* この入金の対象になりうるイベント：期間内・その手段の売上あり・未消込（またはこの入金で消込済） */
function candidatesOf(stl, events){
  return events
    .filter(e => (e[stl.method]||0) > 0
              && e.date >= stl.periodFrom && e.date <= stl.periodTo)
    .filter(e => { const s = (e.settled||{})[stl.method]; return !s || s === stl.id; })
    .sort((a,b) => a.date.localeCompare(b.date));
}

/* ============================ 1. 記録 ============================ */
function EntryForm({ onSave }){
  const blank = { date:"", venue:"", fee:"", transit:"", note:"", cash:"", credit:"", paypay:"" };
  const [v, setV] = useState(blank);
  const set = k => ev => setV({ ...v, [k]: ev.target.value });
  const n = k => Number(v[k]) || 0;

  const draft = { fee:n("fee"), transit:n("transit"), cash:n("cash"), credit:n("credit"), paypay:n("paypay") };
  const p = profitOf(draft);
  const ready = v.date && v.venue;

  const save = () => {
    if (!ready) return;
    onSave({ id: String(Date.now()), date:v.date, venue:v.venue.trim(), note:v.note.trim(),
             ...draft, settled:{} });
    setV(blank);
  };

  return (
    <form className="sheet" onSubmit={ev => ev.preventDefault()}>
      <div className="legend">出店を記録する</div>

      <div className="grid">
        <div className="f"><label>日付</label>
          <input type="date" value={v.date} onChange={set("date")} /></div>
        <div className="f wide"><label>会場</label>
          <input value={v.venue} onChange={set("venue")} placeholder="ベルファーム" /></div>
        <div className="f"><label>天候・メモ</label>
          <input value={v.note} onChange={set("note")} placeholder="雨" /></div>
        <div className="f"><label>出店料</label>
          <input type="number" value={v.fee} onChange={set("fee")} placeholder="0" /></div>
        <div className="f"><label>交通費</label>
          <input type="number" value={v.transit} onChange={set("transit")} placeholder="0" /></div>
      </div>

      <div className="split">
        <div className="cap">売上の内訳</div>
        <div className="grid">
          {METHODS.map(m => (
            <div className="f" key={m.key}>
              <label>{m.label}{m.rate ? `　${(m.rate*100).toFixed(2)}%` : ""}</label>
              <input type="number" value={v[m.key]} onChange={set(m.key)} placeholder="0" />
            </div>
          ))}
        </div>
      </div>

      <div className="actions">
        <div className="preview">
          売上 {yen(p.gross)}　手数料 {yen(p.fees)}　利益
          <b className={p.net<0?"minus":"plus"}>{yen(p.net)}</b>
        </div>
        <button type="button" className="primary" onClick={save} disabled={!ready}>記録する</button>
      </div>
    </form>
  );
}

/* ============================ 出店一覧 ============================ */
function EventList({ events }){
  const rows = [...events].sort((a,b) => b.date.localeCompare(a.date));
  const tot = rows.reduce((s,e) => s + profitOf(e).net, 0);
  const avg = rows.length ? tot / rows.length : 0;

  if (!rows.length) return <div className="empty">まだ記録がありません。上のフォームから最初の出店を入れてください。</div>;

  return (
    <>
      <table className="ledger">
        <thead><tr>
          <th className="l">日付</th><th className="l">会場</th>
          <th>売上</th><th className="hide-sm">出店料</th><th className="hide-sm">交通費</th>
          <th className="hide-sm">手数料</th><th>損益</th>
        </tr></thead>
        <tbody>
          {rows.map(e => {
            const p = profitOf(e);
            const [,mm,dd] = e.date.split("-");
            return (
              <tr key={e.id}>
                <td className="l date num">{Number(mm)}/{Number(dd)}</td>
                <td className="l"><span className="venue">{e.venue}</span>
                  {e.note && <span className="memo">{e.note}</span>}</td>
                <td className="num">{yen(p.gross)}</td>
                <td className="num hide-sm zero">{yen(e.fee||0)}</td>
                <td className="num hide-sm zero">{yen(e.transit||0)}</td>
                <td className="num hide-sm zero">{yen(p.fees)}</td>
                <td className={"num " + (p.net<0?"minus":"plus")}>{yen(p.net)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="foot">
        <div><span>出店</span><b className="num">{rows.length}回</b></div>
        <div><span>累計損益</span><b className={"num "+(tot<0?"minus":"plus")}>{yen(tot)}</b></div>
        <div><span>1回平均</span><b className="num">{yen(avg)}</b></div>
      </div>
    </>
  );
}

/* ============================ 2. 未入金 ============================ */
function Unsettled({ events, onSettle }){
  const groups = RECEIVABLE.map(m => ({
    ...m,
    rows: events
      .filter(e => (e[m.key]||0) > 0 && !(e.settled||{})[m.key])
      .sort((a,b) => a.date.localeCompare(b.date))
  }));

  const any = groups.some(g => g.rows.length);
  if (!any) return <div className="empty">未入金はありません。売掛はすべて消し込み済みです。</div>;

  return (
    <>
      {groups.map(g => {
        if (!g.rows.length) return null;
        const gross = g.rows.reduce((s,e) => s + e[g.key], 0);
        const fees  = g.rows.reduce((s,e) => s + fee(e[g.key], g.rate), 0);
        return (
          <div className="group" key={g.key}>
            <div className="group-head">
              <span className="group-name">{g.label}</span>
              <span className="group-rate">{(g.rate*100).toFixed(2)}%</span>
              <span className="group-total num">
                売掛 {yen(gross)}　手数料 {yen(fees)}　入金予定 <b>{yen(gross-fees)}</b>
              </span>
            </div>
            <div className="brace">
              <table className="ledger">
                <tbody>
                  {g.rows.map(e => {
                    const amt = e[g.key], f = fee(amt, g.rate);
                    const [,mm,dd] = e.date.split("-");
                    return (
                      <tr key={e.id}>
                        <td className="l" style={{width:"32px"}}><span className="sealbox">未</span></td>
                        <td className="l date num">{Number(mm)}/{Number(dd)}</td>
                        <td className="l venue">{e.venue}</td>
                        <td className="num">{yen(amt)}</td>
                        <td className="num zero hide-sm">−{yen(f)}</td>
                        <td className="num">{yen(amt-f)}</td>
                        <td className="l" style={{width:"92px"}}>
                          <button className="ghost" onClick={() => onSettle(e.id, g.key)}>入金済に</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}
    </>
  );
}

/* ============================ 3. 入金 ============================ */
function SettlementForm({ onSave }){
  const blank = { method:"credit", periodFrom:"", periodTo:"", payoutDate:"", gross:"", fee:"" };
  const [v, setV] = useState(blank);
  const set = k => ev => setV({ ...v, [k]: ev.target.value });
  const n = k => Number(v[k]) || 0;
  const ready = v.periodFrom && v.periodTo && v.payoutDate && n("gross") > 0;

  const save = () => {
    if (!ready) return;
    onSave({ id:"stl"+Date.now(), method:v.method,
             periodFrom:v.periodFrom, periodTo:v.periodTo, payoutDate:v.payoutDate,
             gross:n("gross"), fee:n("fee"), amount:n("gross")-n("fee"),
             source:"manual", matched:false });
    setV(blank);
  };

  return (
    <form className="sheet" onSubmit={ev => ev.preventDefault()}>
      <div className="legend">入金を記録する（振込確定メールの内容）</div>
      <div className="grid">
        <div className="f"><label>手段</label>
          <select value={v.method} onChange={set("method")}>
            {RECEIVABLE.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
          </select></div>
        <div className="f"><label>期間開始</label>
          <input type="date" value={v.periodFrom} onChange={set("periodFrom")} /></div>
        <div className="f"><label>期間終了</label>
          <input type="date" value={v.periodTo} onChange={set("periodTo")} /></div>
        <div className="f"><label>振込日</label>
          <input type="date" value={v.payoutDate} onChange={set("payoutDate")} /></div>
        <div className="f"><label>売上総額</label>
          <input type="number" value={v.gross} onChange={set("gross")} placeholder="0" /></div>
        <div className="f"><label>手数料</label>
          <input type="number" value={v.fee} onChange={set("fee")} placeholder="0" /></div>
      </div>
      <div className="actions">
        <div className="preview">振込額 <b>{yen(n("gross") - n("fee"))}</b></div>
        <button type="button" className="primary" onClick={save} disabled={!ready}>記録する</button>
      </div>
    </form>
  );
}

function SettlementCard({ stl, events, onApply }){
  const cands = candidatesOf(stl, events);
  const key = cands.map(e => e.id).join(",");
  const [sel, setSel] = useState(() => new Set(cands.map(e => e.id)));
  /* 候補が入れ替わったら「全部入り」に戻す＝自動突合の初期案 */
  useEffect(() => { setSel(new Set(cands.map(e => e.id))); }, [key]);

  const done   = !!stl.matched;
  const chosen = cands.filter(e => sel.has(e.id));
  const sum    = chosen.reduce((s,e) => s + e[stl.method], 0);
  const diff   = sum - stl.gross;
  const toggle = id => setSel(p => {
    const s = new Set(p); s.has(id) ? s.delete(id) : s.add(id); return s;
  });
  const [,pm,pd] = stl.payoutDate.split("-");

  return (
    <div className="stl">
      <div className="stl-head">
        <span className="group-name">{labelOf(stl.method)}</span>
        <span className="stl-period">
          {stl.periodFrom.slice(5)} 〜 {stl.periodTo.slice(5)}　振込 {Number(pm)}/{Number(pd)}
        </span>
        <span className="stl-sum">
          売上 {yen(stl.gross)}　手数料 {yen(stl.fee)}　振込額 <b>{yen(stl.amount)}</b>
        </span>
      </div>

      {!cands.length
        ? <div className="empty">この期間に該当する売掛がありません。</div>
        : <table className="ledger"><tbody>
            {cands.map(e => {
              const [,mm,dd] = e.date.split("-");
              return (
                <tr key={e.id}>
                  <td className="l pick">
                    {done
                      ? <span className="sealbox">済</span>
                      : <input type="checkbox" checked={sel.has(e.id)}
                          onChange={() => toggle(e.id)}
                          aria-label={`${e.date} ${e.venue} をこの入金に含める`} />}
                  </td>
                  <td className="l date num">{Number(mm)}/{Number(dd)}</td>
                  <td className="l venue">{e.venue}</td>
                  <td className="num">{yen(e[stl.method])}</td>
                </tr>
              );
            })}
          </tbody></table>}

      {!done && !!cands.length && (
        <div className="stl-foot">
          <span className="diff">
            選択 {yen(sum)} ／ メール {yen(stl.gross)}
            {diff !== 0 && <b className="minus">　差額 {yen(diff)}</b>}
          </span>
          <button className="primary" disabled={diff !== 0 || !chosen.length}
            onClick={() => onApply(stl, chosen.map(e => e.id))}>
            {diff === 0 ? `この${chosen.length}件を消し込む` : "金額が合いません"}
          </button>
        </div>
      )}
    </div>
  );
}

function Settlements({ settlements, events, onSave, onApply }){
  const rows = [...settlements].sort((a,b) => b.payoutDate.localeCompare(a.payoutDate));
  return (
    <>
      <SettlementForm onSave={onSave} />
      {rows.length
        ? rows.map(s => <SettlementCard key={s.id} stl={s} events={events} onApply={onApply} />)
        : <div className="empty">入金の記録がありません。振込確定メールの内容を上のフォームから入れてください。</div>}
    </>
  );
}

/* ============================ App ============================ */
function App(){
  const [events, setEvents] = useState([]);
  const [settlements, setSettlements] = useState([]);
  const [tab, setTab] = useState("log");

  useEffect(() => {
    if (!live) return;
    const cb = eventsRef.on("value", snap => {
      const val = snap.val() || {};
      setEvents(Object.keys(val).map(k => ({ id:k, settled:{}, ...val[k] })));
    }, err => console.error("読み込みに失敗しました", err));
    return () => eventsRef.off("value", cb);
  }, []);

  useEffect(() => {
    if (!live) return;
    const cb = settlementsRef.on("value", snap => {
      const val = snap.val() || {};
      setSettlements(Object.keys(val).map(k => ({ id:k, ...val[k] })));
    }, err => console.error("入金の読み込みに失敗しました", err));
    return () => settlementsRef.off("value", cb);
  }, []);

  const add = e => {
    if (live) eventsRef.child(e.id).set(e).catch(err => console.error("保存に失敗しました", err));
    else setEvents(p => [...p, e]);
  };

  const addSettlement = s => {
    if (live) settlementsRef.child(s.id).set(s).catch(err => console.error("保存に失敗しました", err));
    else setSettlements(p => [...p, s]);
  };

  /* 消込：イベント側の settled と settlement 側の eventIds を一度に書く。
     settled には settlementId を入れる。手動の「入金済に」が入れる日付文字列も
     引き続き消込済みとして読めるよう、読み側は truthy 判定のままにしてある。 */
  const applySettlement = (stl, ids) => {
    if (live) {
      const up = {};
      ids.forEach(id => { up[`events/${id}/settled/${stl.method}`] = stl.id; });
      up[`settlements/${stl.id}/eventIds`] = ids;
      up[`settlements/${stl.id}/matched`]  = true;
      appRef.update(up).catch(err => console.error("消込に失敗しました", err));
    } else {
      setEvents(p => p.map(e => ids.includes(e.id)
        ? { ...e, settled:{ ...(e.settled||{}), [stl.method]: stl.id } } : e));
      setSettlements(p => p.map(s => s.id===stl.id ? { ...s, eventIds:ids, matched:true } : s));
    }
  };

  const settle = (id, method) => {
    const today = new Date().toISOString().slice(0,10);
    if (live) eventsRef.child(id).child("settled").child(method).set(today);
    else setEvents(p => p.map(e => e.id===id
      ? { ...e, settled:{ ...(e.settled||{}), [method]: today } } : e));
  };

  const pending = useMemo(() =>
    events.reduce((s,e) =>
      s + RECEIVABLE.filter(m => (e[m.key]||0)>0 && !(e.settled||{})[m.key]).length, 0)
  , [events]);

  return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span>
        <span className="sub">売上表</span>
      </header>
      <div className="modeline">
        {live ? "Firebase に同期中" : "お試しモード：この画面を閉じると記録は消えます"}
      </div>

      <nav className="tabs">
        <button data-on={tab==="log"?1:0} onClick={() => setTab("log")}>出店記録</button>
        <button data-on={tab==="due"?1:0} onClick={() => setTab("due")}>
          未入金{pending > 0 && <span className="count">{pending}</span>}
        </button>
        <button data-on={tab==="stl"?1:0} onClick={() => setTab("stl")}>入金</button>
      </nav>

      {tab==="log" && <><EntryForm onSave={add} /><EventList events={events} /></>}
      {tab==="due" && <Unsettled events={events} onSettle={settle} />}
      {tab==="stl" && <Settlements settlements={settlements} events={events}
                        onSave={addSettlement} onApply={applySettlement} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
