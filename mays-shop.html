/* ======================== 販売・送信待ち ======================== */
const SALE_OUTBOX_KEY = "mays-shop-sale-outbox-v1";
let outboxFlushPromise = null;

function readSaleOutbox(){
  try {
    const value = JSON.parse(localStorage.getItem(SALE_OUTBOX_KEY) || "[]");
    return Array.isArray(value) ? value : [];
  } catch (_) { return []; }
}

function writeSaleOutbox(entries){
  localStorage.setItem(SALE_OUTBOX_KEY, JSON.stringify(entries));
  window.dispatchEvent(new CustomEvent("mays-outbox-change", { detail:{ count:saleOutboxCount(entries) } }));
}

function saleOutboxCount(entries){
  return entries.reduce((sum,entry) => sum + Math.max(1, Array.isArray(entry.sales)?entry.sales.length:0), 0);
}

function makeLocalId(prefix){
  if (crypto.randomUUID) return `${prefix}-${crypto.randomUUID()}`;
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  return `${prefix}-${[...bytes].map(value => value.toString(16).padStart(2,"0")).join("")}`;
}

function saleIdFor(token, sequence){
  return sequence === 1 ? token : `${token}-${sequence}`;
}

async function updateRemoteSyncStatus(deviceId, pendingCount, lastSyncedAt){
  if (!live || !deviceId) return;
  try {
    const patch = {
      name:getDeviceName() || "名前のない端末",
      pendingCount,
      updatedAt:firebase.database.ServerValue.TIMESTAMP
    };
    if (lastSyncedAt) patch.lastSyncedAt = lastSyncedAt;
    await syncStatusRef.child(deviceId).update(patch);
  } catch (_) {}
}

async function claimItemForSale(sale){
  const result = await itemsRef.child(sale.itemToken).transaction(current => {
    if (!current) return;
    if (current.status === "sold" && current.saleId === sale.id && current.saleTxId === sale.txId) return current;
    const currentSequence = Number(current.saleSequence)||0;
    if (current.status !== "in_stock" || sale.sequence !== currentSequence + 1) return;
    return { ...current, status:"sold", soldAt:sale.soldAt, saleId:sale.id,
      saleTxId:sale.txId, saleSequence:sale.sequence };
  }, undefined, false);
  const item = result.snapshot && result.snapshot.val();
  return !!(result.committed && item && item.status === "sold" && item.saleId === sale.id);
}

async function storeSale(sale){
  const result = await salesRef.child(sale.id).transaction(current => {
    if (!current) return sale;
    return current.txId === sale.txId ? current : undefined;
  }, undefined, false);
  const saved = result.snapshot && result.snapshot.val();
  return !!(result.committed && saved && saved.txId === sale.txId);
}

async function voidStoredSale(sale, reason){
  const voidedAt = Date.now();
  await salesRef.child(sale.id).transaction(current => {
    if (!current || current.txId !== sale.txId) return;
    if (current.voided) return current;
    return { ...current, voided:true, voidedAt, voidReason:reason };
  }, undefined, false);
  await itemsRef.child(sale.itemToken).transaction(current => {
    if (!current || current.status !== "sold" || current.saleId !== sale.id || current.saleTxId !== sale.txId) return current;
    return { ...current, status:"in_stock", soldAt:null, saleId:null, saleTxId:null };
  }, undefined, false);
}

async function sendOutboxEntry(entry){
  if (entry.type === "checkout") {
    const claimed = [];
    try {
      for (const sale of entry.sales) {
        if (!await claimItemForSale(sale)) throw new Error("already-sold");
        claimed.push(sale);
        if (!await storeSale(sale)) throw new Error("sale-id-used");
      }
    } catch (err) {
      if (err && (err.message === "already-sold" || err.message === "sale-id-used")) {
        for (const sale of claimed) await voidStoredSale(sale, "同じ会計内の商品競合のため取消");
        err.permanent = true;
      }
      throw err;
    }
    return;
  }
  if (entry.type === "void") {
    for (const sale of entry.sales) await voidStoredSale(sale, entry.reason || "会計直後の取消");
  }
}

function flushSaleOutbox(deviceId){
  if (!live || !navigator.onLine) return Promise.resolve();
  if (outboxFlushPromise) return outboxFlushPromise;
  outboxFlushPromise = (async () => {
    while (readSaleOutbox().length) {
      const entry = readSaleOutbox()[0];
      try {
        await sendOutboxEntry(entry);
        const entries = readSaleOutbox().filter(value => value.id !== entry.id);
        writeSaleOutbox(entries);
        await updateRemoteSyncStatus(deviceId, saleOutboxCount(entries), Date.now());
      } catch (err) {
        if (err && err.permanent) {
          const entries = readSaleOutbox().filter(value => value.id !== entry.id);
          writeSaleOutbox(entries);
          await updateRemoteSyncStatus(deviceId, saleOutboxCount(entries), Date.now());
          window.dispatchEvent(new CustomEvent("mays-sale-conflict"));
          continue;
        }
        await updateRemoteSyncStatus(deviceId, saleOutboxCount(readSaleOutbox()), null);
        break;
      }
    }
  })().finally(() => { outboxFlushPromise = null; });
  return outboxFlushPromise;
}

function queueSaleEntry(entry, deviceId){
  const entries = [...readSaleOutbox(), entry];
  writeSaleOutbox(entries);
  updateRemoteSyncStatus(deviceId, saleOutboxCount(entries), null);
  flushSaleOutbox(deviceId);
}

function useSaleOutbox(deviceId){
  const [entries, setEntries] = useState(() => readSaleOutbox());
  const pendingCount = saleOutboxCount(entries);
  const [conflict, setConflict] = useState(false);
  useEffect(() => {
    const changed = () => setEntries(readSaleOutbox());
    const online = () => flushSaleOutbox(deviceId);
    const conflicted = () => setConflict(true);
    window.addEventListener("mays-outbox-change", changed);
    window.addEventListener("mays-sale-conflict", conflicted);
    window.addEventListener("online", online);
    updateRemoteSyncStatus(deviceId, saleOutboxCount(readSaleOutbox()), null);
    flushSaleOutbox(deviceId);
    return () => {
      window.removeEventListener("mays-outbox-change", changed);
      window.removeEventListener("mays-sale-conflict", conflicted);
      window.removeEventListener("online", online);
    };
  }, [deviceId]);
  return { pendingCount, entries, conflict, clearConflict:() => setConflict(false) };
}

function SaleMode({ onClose, onViewLedger, outboxState, market=null }){
  const [cart, setCart] = useState([]);
  const [availableItems, setAvailableItems] = useState({});
  const [scanMessage, setScanMessage] = useState("売る商品のQR札を読んでください。");
  const [scanError, setScanError] = useState(false);
  const [paying, setPaying] = useState(false);
  const [lastCheckout, setLastCheckout] = useState(null);
  const [todaySales, setTodaySales] = useState([]);
  const { pendingCount, entries:outboxEntries, conflict, clearConflict } = outboxState;
  const undoTimerRef = useRef(null);
  const payingRef = useRef(false);

  useEffect(() => {
    /* 将来メモ：販売件数が増えたら、全件購読ではなく当日範囲のqueryへ絞る。 */
    const start = new Date(); start.setHours(0,0,0,0);
    /* 将来メモ：日をまたいで開き続ける運用が生じたら、日付境界で再計算する。 */
    const cb = salesRef.on("value", snap => {
      const val = snap.val() || {};
      setTodaySales(Object.keys(val).map(id => ({ id, ...val[id] }))
        .filter(sale => !sale.voided && Number(sale.soldAt) >= start.getTime())
        .filter(sale => market ? sale.eventId === market.eventId : sale.eventId === null));
    });
    return () => salesRef.off("value", cb);
  }, [market && market.eventId]);

  useEffect(() => {
    const cb = itemsRef.on("value", snap => setAvailableItems(snap.val() || {}));
    return () => itemsRef.off("value", cb);
  }, []);

  useEffect(() => () => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
  }, []);

  useEffect(() => {
    const conflicted = () => setLastCheckout(null);
    window.addEventListener("mays-sale-conflict", conflicted);
    return () => window.removeEventListener("mays-sale-conflict", conflicted);
  }, []);

  const inspectSaleToken = async rawValue => {
    const token = String(rawValue||"").trim().toUpperCase();
    if (!ITEM_TOKEN_RE.test(token)) {
      setScanError(true); setScanMessage("may's shopのQR札ではありません。"); return;
    }
    if (cart.some(item => item.token === token)) {
      setScanError(true); setScanMessage("この商品は、すでにカートに入っています。"); return;
    }
    try {
      const item = availableItems[token] || (await itemsRef.child(token).once("value")).val();
      if (!item) { setScanError(true); setScanMessage("商品登録されていないQR札です。"); return; }
      if (item.status !== "in_stock") {
        setScanError(true); setScanMessage("この商品は販売済みです。別の商品を読んでください。"); return;
      }
      setCart(current => [...current, {
        token, itemNo:item.itemNo, name:item.name, listPrice:Number(item.price)||0,
        price:String(Number(item.price)||0), cost:item.cost===undefined?null:item.cost,
        sequence:(Number(item.saleSequence)||0)+1
      }]);
      setScanError(false); setScanMessage(`${item.itemNo}をカートに入れました。次の商品を読めます。`);
    } catch (_) {
      setScanError(true); setScanMessage("商品を確認できませんでした。通信を確認して、もう一度読んでください。");
    }
  };

  const total = cart.reduce((sum,item) => sum + (Number(item.price)||0), 0);
  const invalidPrice = cart.some(item => !String(item.price).trim()
    || !Number.isFinite(Number(item.price)) || Number(item.price)<0);
  const pay = method => {
    if (payingRef.current || !cart.length) return;
    if (invalidPrice) {
      setScanError(true);
      setScanMessage("販売額を入れてください。");
      return;
    }
    payingRef.current = true;
    setPaying(true);
    const soldAt = Date.now();
    const txId = makeLocalId("TX");
    const sales = cart.map(item => ({
      id:saleIdFor(item.token,item.sequence), itemToken:item.token, itemNo:item.itemNo,
      name:item.name, price:Math.round(Number(item.price)), listPrice:item.listPrice,
      cost:item.cost===undefined?null:item.cost, method, eventId:market ? market.eventId : null, txId,
      sequence:item.sequence, soldAt, sellerDevice:DEVICE_ID, voided:false,
      voidedAt:null, voidReason:null
    }));
    const entry = { id:makeLocalId("OUT"), type:"checkout", createdAt:soldAt, sales };
    try { queueSaleEntry(entry, DEVICE_ID); }
    catch (_) {
      payingRef.current=false; setPaying(false); setScanError(true);
      setScanMessage("端末に記録できませんでした。画面を開き直して、もう一度お試しください。");
      return;
    }
    setCart([]);
    setScanError(false);
    setScanMessage("記録しました。次の商品を読めます。");
    setLastCheckout({ entry, sales, expiresAt:Date.now()+10000 });
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setLastCheckout(null), 10000);
    setTimeout(() => { payingRef.current=false; setPaying(false); }, 500);
  };

  const undo = () => {
    if (!lastCheckout || Date.now() > lastCheckout.expiresAt) return;
    try {
      const waiting = readSaleOutbox();
      const voidEntry = {
        id:makeLocalId("OUT"), type:"void", createdAt:Date.now(),
        sales:lastCheckout.sales, reason:"会計直後の取消"
      };
      const next = [...waiting.filter(entry => entry.id !== lastCheckout.entry.id), voidEntry];
      writeSaleOutbox(next);
      updateRemoteSyncStatus(DEVICE_ID, saleOutboxCount(next), null);
      flushSaleOutbox(DEVICE_ID);
    } catch (_) {
      setScanError(true); setScanMessage("取り消しを記録できませんでした。通信を確認して、もう一度押してください。");
      return;
    }
    setLastCheckout(null);
    setScanMessage("取り消しました。商品はもう一度販売できます。");
  };

  const remoteSaleIds = new Set(todaySales.map(sale => sale.id));
  const waitingSales = outboxEntries.filter(entry => entry.type === "checkout")
    .flatMap(entry => entry.sales || [])
    .filter(sale => market ? sale.eventId === market.eventId : sale.eventId === null)
    .filter(sale => !remoteSaleIds.has(sale.id));
  const todayTotal = [...todaySales, ...waitingSales].reduce((sum,sale) => sum + (Number(sale.price)||0), 0);
  return <div className="wrap">
    <header className="masthead"><span className="title">may's shop</span><span className="sub">販売</span></header>
    <div className="sale-head"><h2>{market ? market.venue : "その場で販売"}</h2>
      <div className="sale-head-actions">
        {market && <button type="button" className="ghost" onClick={onViewLedger}>帳簿を見る</button>}
        <button type="button" className="ghost danger-text" onClick={onClose}>{market ? "マルシェを終える" : "販売を終える"}</button>
      </div></div>
    {pendingCount>0 && <div className="outbox-status">送信待ち {pendingCount}件（通信が戻ると自動で送ります）</div>}
    {conflict && <div className="outbox-status error" onClick={clearConflict}>同じ商品が別の端末で先に記録されました。売上には重ねて入れていません。</div>}
    <div className="sale-today"><span>今日の売上</span><b>{yen(todayTotal)}円</b></div>
    <QrScanner onRead={inspectSaleToken} message={scanMessage} error={scanError} />
    <section className="cart-panel">
      <h3>カート</h3>
      {!cart.length && <div className="cart-empty">QR札を読むと、ここに商品が入ります。</div>}
      {cart.map(item => <div className="cart-row" key={item.token}>
        <div className="cart-name"><b>{item.name}</b><span>{item.itemNo}</span></div>
        <label className="cart-price"><input aria-label={`${item.itemNo}の販売額`} type="number" min="0" inputMode="numeric"
          value={item.price} onChange={event => setCart(current => current.map(value => value.token===item.token
            ? {...value,price:event.target.value} : value))} /><span>円</span></label>
        <button type="button" className="ghost danger-text cart-remove" onClick={() => setCart(current => current.filter(value => value.token!==item.token))}>外す</button>
      </div>)}
      <div className="cart-total"><span>合計</span><b>{yen(total)}円</b></div>
      <div className="pay-buttons">
        <button type="button" className="primary" disabled={paying||!cart.length||invalidPrice} onClick={() => pay("cash")}>現金</button>
        <button type="button" className="primary" disabled={paying||!cart.length||invalidPrice} onClick={() => pay("credit")}>カード</button>
        <button type="button" className="primary" disabled={paying||!cart.length||invalidPrice} onClick={() => pay("paypay")}>PayPay</button>
      </div>
      {lastCheckout && <div className="undo-bar"><span>記録しました</span>
        <button type="button" className="danger" onClick={undo}>取り消す</button></div>}
    </section>
  </div>;
}

/* ======================== 控えを保存する ======================== */
const EXPORT_NODE_NAMES = ["events","settlements","labels","items","sales","settings","syncStatus"];
const APP_PUBLIC_URL = "https://nana-keke.github.io/kakeibo-family/mays-shop.html";

function csvCell(value){
  if (value === null || value === undefined) return "";
  let text = String(value);
  if (typeof value === "string" && /^[=+\-@]/.test(text)) text = `'${text}`;
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g,'""')}"` : text;
}

function csvText(headers, rows){
  return "\uFEFF" + [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n");
}

function dateTimeText(value){
  const number = Number(value);
  return number ? new Date(number).toLocaleString("ja-JP") : "";
}

function effectiveSalesForExport(remoteSales, outbox){
  const sales = { ...(remoteSales||{}) };
  outbox.forEach(entry => {
    if (entry.type === "checkout") (entry.sales||[]).forEach(sale => { if (!sales[sale.id]) sales[sale.id]=sale; });
    if (entry.type === "void") (entry.sales||[]).forEach(sale => {
      if (sales[sale.id]) sales[sale.id]={...sales[sale.id],voided:true,
        voidedAt:entry.createdAt,voidReason:entry.reason||"会計直後の取消（送信待ち）"};
    });
  });
  return sales;
}

async function loadExportData(){
  const snapshots = await Promise.all(EXPORT_NODE_NAMES.map(name => appRef.child(name).once("value")));
  const data = {};
  EXPORT_NODE_NAMES.forEach((name,index) => { data[name]=snapshots[index].val()||{}; });
  data.pendingSales = readSaleOutbox();
  return data;
}

function createExportFiles(data){
  const exportedAt = new Date();
  const effectiveSales = effectiveSalesForExport(data.sales, data.pendingSales);
  const events = data.events||{}, items=data.items||{};
  const derivedEvents = deriveEventsFromSales(
    Object.keys(events).map(id => ({id,...events[id]})), effectiveSales
  );
  const saleRows = Object.keys(effectiveSales).map(id => ({id,...effectiveSales[id]}))
    .sort((a,b)=>(Number(a.soldAt)||0)-(Number(b.soldAt)||0)).map(sale => {
      const event = events[sale.eventId]||{};
      const cost = sale.cost===null || sale.cost===undefined ? "" : Number(sale.cost);
      return [sale.id,sale.itemNo,sale.name,sale.price,sale.listPrice,cost,
        cost===""?"":Number(sale.price)-cost,dateTimeText(sale.soldAt),event.venue||"その場で販売",
        labelOf(sale.method),sale.txId,sale.voided?"取消":"",dateTimeText(sale.voidedAt),sale.voidReason||""];
    });
  const itemRows = Object.keys(items).map(token => ({token,...items[token]}))
    .sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0)).map(item => [
      item.token,item.itemNo,item.itemNoAlpha||"",item.itemNoNum,item.name,
      item.cost===null||item.cost===undefined?"":item.cost,item.costEstimated?"目安":"",
      item.price,item.status==="in_stock"?"在庫":item.status==="sold"?"販売済":"所在不明",
      dateTimeText(item.createdAt),dateTimeText(item.soldAt),item.note||""
    ]);
  const eventRows = derivedEvents
    .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).map(event => [
      event.id,event.date,event.venue,event.organizer||"",event.fee||0,event.transit||0,event.material||0,event.unknownCostCount||0,
      event.cash||0,event.credit||0,event.paypay||0,event.salesMode?"商品販売から算出":"手入力",
      dateTimeText(event.marketOpenedAt),dateTimeText(event.marketClosedAt),
      event.actualCash===null||event.actualCash===undefined?"":event.actualCash,
      event.actualCashless===null||event.actualCashless===undefined?"":event.actualCashless,
      event.reconciliationDifference===null||event.reconciliationDifference===undefined?"":event.reconciliationDifference,
      event.note||""
    ]);

  const salesCsv = csvText(
    ["販売ID","札番","商品名","販売価格","値札価格","販売時の原価","粗利","売れた日","出店先","決済方法","会計番号","取消","取消日時","取消理由"], saleRows);
  const itemsCsv = csvText(
    ["商品ID","札番","文字","番号","商品名","原価","原価区分","販売価格","状態","登録日","販売日","メモ"], itemRows);
  const eventsCsv = csvText(
    ["出店ID","日付","会場","主催者","出店料","交通費","材料費","原価不明点数","現金売上","カード売上","PayPay売上","売上の記録方法","開始日時","終了日時","実際の現金","カード・PayPay実額","照合差額","メモ"], eventRows);
  const { pendingSales, ...firebaseData } = data;
  const json = JSON.stringify({
    format:"may's shop 控え v1", exportedAt:exportedAt.toISOString(), appUrl:APP_PUBLIC_URL,
    note:"写真データは意図的に含めていません。", detenLedger:firebaseData, 送信待ち:pendingSales
  }, null, 2);
  const readme = `may's shop データの控え\r\n\r\n`+
    `これはハンドメイド商品の登録、在庫、販売、出店、入金記録の控えです。\r\n`+
    `書き出した日：${exportedAt.toLocaleString("ja-JP")}\r\n`+
    `アプリ：${APP_PUBLIC_URL}\r\n\r\n`+
    `【ファイルの説明】\r\n`+
    `売上.csv：商品ごとの販売額、販売時の原価、粗利、出店先、決済方法です。\r\n`+
    `商品.csv：商品名、札番、原価、販売価格、現在の状態です。\r\n`+
    `出店.csv：出店日、会場、経費、売上、終了時の金額照合です。\r\n`+
    `全データ.json：写真以外の全記録と、この端末に残る送信待ちです。復元や詳しい確認に使います。\r\n`+
    `はじめにお読みください.txt：この説明です。\r\n\r\n`+
    `【大切なこと】\r\n`+
    `販売時の原価は、商品が売れた当時の値をコピーしたものです。後で商品情報を直しても変わりません。\r\n`+
    `売れたあとに取り消した記録も、消さずに残しています。「取消」欄に印がある行です。売上を合計するときは、その行を除いてください。\r\n`+
    `原価が空欄の商品は、紙の記録が残っていない古い在庫など、原価が分からない商品です。\r\n`+
    `カードとPayPayの売上は、手数料などが引かれて後日入金されます。\r\n`+
    `写真は容量が大きく共有に失敗しやすいため、この控えには含めていません。\r\n`;
  const options = type => ({type});
  return [
    new File([salesCsv],"売上.csv",options("text/csv;charset=utf-8")),
    new File([itemsCsv],"商品.csv",options("text/csv;charset=utf-8")),
    new File([eventsCsv],"出店.csv",options("text/csv;charset=utf-8")),
    new File([json],"全データ.json",options("application/json;charset=utf-8")),
    new File([readme],"はじめにお読みください.txt",options("text/plain;charset=utf-8"))
  ];
}

function downloadExportFiles(files){
  files.forEach((file,index) => {
    const url=URL.createObjectURL(file), link=document.createElement("a");
    link.href=url;link.download=file.name;link.style.display="none";document.body.appendChild(link);
    setTimeout(()=>{link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);},index*250);
  });
}

function RecordsExport({ compact=false }){
  const [busy,setBusy]=useState(false);
  const [prepared,setPrepared]=useState(null);
  const [message,setMessage]=useState(null);

  const save = async () => {
    if (busy) return;
    setBusy(true);setMessage(null);
    try {
      const alreadyPrepared=!!prepared;
      const files=prepared||createExportFiles(await loadExportData());
      setPrepared(files);
      let shareable=!!navigator.share;
      try { if (shareable && navigator.canShare) shareable=navigator.canShare({files}); }
      catch (_) { shareable=false; }
      if (shareable) {
        try {
          await navigator.share({title:"may's shop データの控え",text:"may's shop の全期間の控えです。",files});
          setMessage({error:false,text:"共有先へ控えを渡しました。"});setPrepared(null);
        } catch (err) {
          if (err && err.name==="AbortError") setMessage({error:false,text:"共有をやめました。控えはまだ送られていません。"});
          else if (err && err.name==="NotAllowedError") setMessage({error:false,text:"控えの準備ができました。もう一度「控えを保存する」を押してください。"});
          else throw err;
        }
      } else {
        if (!alreadyPrepared) {
          setMessage({error:false,text:"控えの準備ができました。もう一度「控えを保存する」を押すと、端末へ保存します。"});
          return;
        }
        downloadExportFiles(files);setPrepared(null);
        setMessage({error:false,text:"5つのファイルを保存しました。端末のダウンロードをご確認ください。"});
      }
    } catch (_) {
      setMessage({error:true,text:"控えを作れませんでした。通信を確認して、もう一度押してください。"});
    } finally {setBusy(false);}
  };
  return <div className={`records-export${compact?" compact":""}`}>
    <p>写真を除く全期間の記録を、家族やGoogleドライブへ残せます。</p>
    <button type="button" className="ghost" disabled={busy} onClick={save}>{busy?"控えを作っています…":"控えを保存する"}</button>
    {message&&<div className={`export-message${message.error?" error":""}`}>{message.text}</div>}
  </div>;
}

/* ======================== マルシェ開始・終了 ======================== */
function MarketStart({ venues, organizers, onStarted, onCancel }){
  const [date, setDate] = useState(() => localDateKey());
  const [venue, setVenue] = useState("");
  const [organizer, setOrganizer] = useState("");
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");

  const start = async () => {
    if (!date || !venue.trim() || busy) return;
    setBusy(true); setMessage("");
    const eventId = eventsRef.push().key;
    const candidate = {
      eventId, date, venue:venue.trim(), organizer:organizer.trim(),
      openedAt:Date.now(), openedByDevice:DEVICE_ID, continuedOn:null
    };
    try {
      const result = await settingsRef.child("activeMarket").transaction(current => current || candidate, undefined, false);
      const active = result.snapshot && result.snapshot.val();
      if (!active) throw new Error("start-failed");
      const event = {
        date:active.date, venue:active.venue, organizer:active.organizer||"", note:"",
        fee:0, transit:0, material:0, cash:0, credit:0, paypay:0, settled:{},
        salesMode:true, marketStatus:"open", marketOpenedAt:active.openedAt
      };
      await eventsRef.child(active.eventId).transaction(current => current || event, undefined, false);
      onStarted(active);
    } catch (_) {
      setMessage("マルシェを始められませんでした。通信を確認して、もう一度押してください。");
    } finally { setBusy(false); }
  };

  return <div className="wrap">
    <header className="masthead"><span className="title">may's shop</span><span className="sub">マルシェ開始</span></header>
    <section className="market-form">
      <h2>マルシェを始める</h2>
      <div className="grid">
        <div className="f"><label>日付</label><input type="date" value={date} onChange={event => setDate(event.target.value)} /></div>
        <ChipField label="会場" placeholder="ベルファーム" value={venue} options={venues} onChange={setVenue} />
        <ChipField label="主催者" placeholder="（任意）" value={organizer} options={organizers} onChange={setOrganizer} />
      </div>
      {message && <div className="label-message error">{message}</div>}
      <button type="button" className="primary" disabled={busy||!date||!venue.trim()} onClick={start}>
        {busy?"始めています…":"このマルシェを始める"}
      </button>
      <div className="register-actions"><button type="button" className="ghost" disabled={busy} onClick={onCancel}>戻る</button></div>
    </section>
  </div>;
}

function otherPendingDevices(syncStatuses, ownDeviceId){
  return Object.keys(syncStatuses||{}).filter(deviceId => deviceId !== ownDeviceId)
    .map(deviceId => ({ deviceId, ...syncStatuses[deviceId] }))
    .filter(status => Number(status.pendingCount)>0)
    .sort((a,b) => String(a.name||"").localeCompare(String(b.name||""), "ja"));
}

function syncTimeText(value){
  const timestamp = Number(value);
  if (!Number.isFinite(timestamp) || timestamp<=0) return "記録なし";
  return new Intl.DateTimeFormat("ja-JP", { month:"numeric", day:"numeric",
    hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date(timestamp));
}

function MarketClose({ market, outboxState, onBack, onFinished }){
  const [sales, setSales] = useState([]);
  const [syncStatuses, setSyncStatuses] = useState({});
  const [actualCash, setActualCash] = useState("");
  const [actualCashless, setActualCashless] = useState("");
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState("");

  useEffect(() => {
    const cb = salesRef.on("value", snap => {
      const val = snap.val() || {};
      setSales(Object.keys(val).map(id => ({ id, ...val[id] }))
        .filter(sale => sale.eventId === market.eventId && !sale.voided));
    });
    return () => salesRef.off("value", cb);
  }, [market.eventId]);

  useEffect(() => {
    const cb = syncStatusRef.on("value", snap => setSyncStatuses(snap.val() || {}));
    return () => syncStatusRef.off("value", cb);
  }, []);

  const otherDevicePending = otherPendingDevices(syncStatuses, DEVICE_ID);

  const waitingSales = outboxState.entries.filter(entry => entry.type === "checkout")
    .flatMap(entry => entry.sales||[]).filter(sale => sale.eventId === market.eventId);
  const remoteIds = new Set(sales.map(sale => sale.id));
  const allSales = [...sales, ...waitingSales.filter(sale => !remoteIds.has(sale.id))];
  const recorded = allSales.reduce((sum,sale) => sum+(Number(sale.price)||0),0);
  const cashNumber = Number(actualCash), cashlessNumber = Number(actualCashless);
  const actualReady = String(actualCash).trim()!=="" && String(actualCashless).trim()!==""
    && Number.isFinite(cashNumber) && Number.isFinite(cashlessNumber)
    && cashNumber>=0 && cashlessNumber>=0;
  const actualTotal = (cashNumber||0)+(cashlessNumber||0);
  const difference = actualTotal-recorded;

  const finish = async skipReconciliation => {
    if ((!skipReconciliation && !actualReady) || busy) return;
    setBusy(true); setMessage("");
    try {
      await eventsRef.child(market.eventId).update({
        marketStatus:"closed", marketClosedAt:firebase.database.ServerValue.TIMESTAMP,
        actualCash:skipReconciliation?null:Math.round(cashNumber),
        actualCashless:skipReconciliation?null:Math.round(cashlessNumber),
        reconciliationDifference:skipReconciliation?null:Math.round(difference)
      });
      const closeResult = await settingsRef.child("activeMarket").transaction(current =>
        current && current.eventId === market.eventId ? null : current, undefined, false);
      if (closeResult.snapshot && closeResult.snapshot.val()) throw new Error("market-changed");
      onFinished();
    } catch (_) {
      setMessage("終了を保存できませんでした。通信を確認して、もう一度押してください。");
    } finally { setBusy(false); }
  };

  return <div className="wrap">
    <header className="masthead"><span className="title">may's shop</span><span className="sub">マルシェ終了</span></header>
    <section className="market-close">
      <h2>おつかれさまでした</h2><h3>{market.venue}</h3>
      {outboxState.pendingCount>0 && <div className="outbox-status">送信待ち {outboxState.pendingCount}件があります。通信が戻ると自動で送ります。</div>}
      {otherDevicePending.map(status => <div className="other-device-warning" key={status.deviceId}>
        <b>{status.name || "名前のない端末"} に送信待ちが{Number(status.pendingCount)}件あります</b>
        <span>（最終同期 {syncTimeText(status.lastSyncedAt)}）。その端末で通信が戻るのを待ってから終了すると、金額が正しく合います。</span>
      </div>)}
      <div className="reconcile-recorded"><span>記録した売上</span><b>{yen(recorded)}円</b></div>
      <div className="reconcile-inputs">
        <div className="f"><label>実際の現金</label><input type="number" min="0" inputMode="numeric" value={actualCash} onChange={event=>setActualCash(event.target.value)} /></div>
        <div className="f"><label>カード・PayPay</label><input type="number" min="0" inputMode="numeric" value={actualCashless} onChange={event=>setActualCashless(event.target.value)} /></div>
      </div>
      <div className="reconcile-diff"><span>差</span><b>{actualReady ? `${difference>0?"＋":""}${yen(difference)}円` : "—"}</b></div>
      {message && <div className="label-message error">{message}</div>}
      <div className="market-close-actions">
        <button type="button" className="ghost" disabled={busy} onClick={onBack}>販売に戻る</button>
        <button type="button" className="ghost" disabled={busy} onClick={() => finish(true)}>あとで数える</button>
        <button type="button" className="primary" disabled={busy||!actualReady} onClick={() => finish(false)}>{busy?"保存しています…":"マルシェを終了する"}</button>
      </div>
      <RecordsExport />
    </section>
  </div>;
}

function StaleMarketPrompt({ market, onCloseYesterday, onContinue }){
  const date = new Date(`${market.date}T00:00:00`);
  return <div className="stale-card"><div>
    <h2>{date.getMonth()+1}月{date.getDate()}日　{market.venue}が開いたままです</h2>
    <p>このマルシェは、どうしますか？</p>
    <div className="stale-actions">
      <button type="button" className="primary" onClick={onCloseYesterday}>きのうで終わりにする</button>
      <button type="button" className="ghost" onClick={onContinue}>まだ続いている（2日開催）</button>
    </div>
  </div></div>;
}

function DeviceNameCard({ name, draft, onDraft, onSave, onCancel }){
  return <section className="device-name-card">
    <h2>この端末の名前を決めてください</h2>
    <p>「ババちゃんのiPhone」のように、誰の端末か分かる名前を付けます。</p>
    <div className="device-name-form">
      <div className="f"><label>端末の名前</label>
        <input type="text" value={draft} placeholder="ババちゃんのiPhone"
          onChange={event => onDraft(event.target.value)} /></div>
      {name && <button type="button" className="ghost" onClick={onCancel}>やめる</button>}
      <button type="button" className="primary" disabled={!draft.trim()} onClick={onSave}>保存</button>
    </div>
  </section>;
}

/* ============================ App ============================ */
function App(){
  const [events, setEvents] = useState([]);
  const [settlements, setSettlements] = useState([]);
  const [sales, setSales] = useState({});
  const [tab, setTab] = useState("log");
  const [screen, setScreen] = useState("ledger");
  const [picked, setPicked] = useState(null);   // 長押しで選ばれた出店（編集シート用）
  const [activeMarket, setActiveMarket] = useState(null);
  const [staleMarket, setStaleMarket] = useState(null);
  const [viewingLedger, setViewingLedger] = useState(false);
  const [deviceName, setDeviceName] = useState(() => getDeviceName());
  const [deviceNameDraft, setDeviceNameDraft] = useState(() => getDeviceName());
  const [deviceNameOpen, setDeviceNameOpen] = useState(() => !getDeviceName());
  const saleOutbox = useSaleOutbox(DEVICE_ID);

  const storeDeviceName = () => {
    const saved = saveDeviceName(deviceNameDraft);
    if (!saved) return;
    setDeviceName(saved);
    setDeviceNameDraft(saved);
    setDeviceNameOpen(false);
    updateRemoteSyncStatus(DEVICE_ID, saleOutbox.pendingCount, null);
  };

  useEffect(() => {
    const ref = settingsRef.child("activeMarket");
    const cb = ref.on("value", snap => {
      const market = snap.val();
      setActiveMarket(market);
      if (!market) {
        setViewingLedger(false);
        setStaleMarket(null);
        setScreen(current => current==="market" || current==="close" ? "ledger" : current);
        return;
      }
      const lastOpenDate = market.continuedOn || market.date;
      if (lastOpenDate < localDateKey()) {
        setViewingLedger(false);
        setStaleMarket(market);
        setScreen("ledger");
      } else {
        setStaleMarket(null);
        setScreen(current => viewingLedger ? "ledger" : current==="close" ? current : "market");
      }
    });
    return () => ref.off("value", cb);
  }, [viewingLedger]);

  useEffect(() => {
    if (!live) return;
    const cb = eventsRef.on("value", snap => {
      const val = snap.val() || {};
      setEvents(Object.keys(val).map(k => ({ id:k, settled:{}, ...val[k] })));
    }, err => console.error("読み込みに失敗しました", err));
    return () => eventsRef.off("value", cb);
  }, []);

  useEffect(() => {
    if (!live) return;
    const cb = settlementsRef.on("value", snap => {
      const val = snap.val() || {};
      setSettlements(Object.keys(val).map(k => ({ id:k, ...val[k] })));
    }, err => console.error("入金の読み込みに失敗しました", err));
    return () => settlementsRef.off("value", cb);
  }, []);

  useEffect(() => {
    if (!live) return;
    // 今は全件を購読する。件数が増えたら当日分などへの絞り込みを検討する。
    const cb = salesRef.on("value", snap => setSales(snap.val()||{}),
      err => console.error("販売の読み込みに失敗しました", err));
    return () => salesRef.off("value", cb);
  }, []);

  const add = e => {
    if (live) eventsRef.child(e.id).set(e).catch(err => console.error("保存に失敗しました", err));
    else setEvents(p => [...p, e]);
  };

  const addSettlement = s => {
    if (live) settlementsRef.child(s.id).set(s).catch(err => console.error("保存に失敗しました", err));
    else setSettlements(p => [...p, s]);
  };

  /* 消込：イベント側の settled と settlement 側の eventIds を一度に書く。
     settled には settlementId を入れる。手動の「入金済に」が入れる日付文字列も
     引き続き消込済みとして読めるよう、読み側は truthy 判定のままにしてある。 */
  const applySettlement = (stl, ids) => {
    if (live) {
      const up = {};
      ids.forEach(id => { up[`events/${id}/settled/${stl.method}`] = stl.id; });
      up[`settlements/${stl.id}/eventIds`] = ids;
      up[`settlements/${stl.id}/matched`]  = true;
      appRef.update(up).catch(err => console.error("消込に失敗しました", err));
    } else {
      setEvents(p => p.map(e => ids.includes(e.id)
        ? { ...e, settled:{ ...(e.settled||{}), [stl.method]: stl.id } } : e));
      setSettlements(p => p.map(s => s.id===stl.id ? { ...s, eventIds:ids, matched:true } : s));
    }
  };

  /* 編集：既存フィールドだけ書き換える（settled は触らない） */
  const updateEvent = (id, patch) => {
    if (live) eventsRef.child(id).update(patch).catch(err => console.error("更新に失敗しました", err));
    else setEvents(p => p.map(e => e.id===id ? { ...e, ...patch } : e));
    setPicked(null);
  };

  const removeEvent = id => {
    if (live) eventsRef.child(id).remove().catch(err => console.error("削除に失敗しました", err));
    else setEvents(p => p.filter(e => e.id !== id));
    setPicked(null);
  };

  /* 選んだ分をまとめて消し込む。1回の update にするので、
     途中で通信が切れて半分だけ済みになることがない。 */
  const settleMany = (ids, method) => {
    if (!ids.length) return;
    const today = new Date().toISOString().slice(0,10);
    if (live) {
      const up = {};
      ids.forEach(id => { up[`${id}/settled/${method}`] = today; });
      eventsRef.update(up).catch(err => alert("保存できませんでした: " + err.message));
    } else {
      const s = new Set(ids);
      setEvents(p => p.map(e => s.has(e.id)
        ? { ...e, settled:{ ...(e.settled||{}), [method]: today } } : e));
    }
  };

  const effectiveSales = useMemo(() =>
    effectiveSalesForExport(sales, saleOutbox.entries), [sales, saleOutbox.entries]);
  const displayEvents = useMemo(() =>
    deriveEventsFromSales(events, effectiveSales), [events, effectiveSales]);
  const pickedEvent = picked && (displayEvents.find(event => event.id===picked.id)||picked);

  const pending = useMemo(() =>
    displayEvents.reduce((s,e) =>
      s + RECEIVABLE.filter(m => (e[m.key]||0)>0 && !(e.settled||{})[m.key]).length, 0)
  , [displayEvents]);

  const venues     = useMemo(() => optionsOf(events, "venue"),     [events]);
  const organizers = useMemo(() => optionsOf(events, "organizer"), [events]);

  if (screen === "start") return <MarketStart venues={venues} organizers={organizers}
    onStarted={market => { setActiveMarket(market); setScreen("market"); }} onCancel={() => setScreen("ledger")} />;

  if (screen === "market" && activeMarket) return <SaleMode market={activeMarket}
    outboxState={saleOutbox} onViewLedger={() => { setViewingLedger(true); setScreen("ledger"); }}
    onClose={() => setScreen("close")} />;

  if (screen === "close" && activeMarket) return <MarketClose market={activeMarket}
    outboxState={saleOutbox} onBack={() => setScreen("market")} onFinished={() => setScreen("ledger")} />;

  if (screen === "onsite") return <SaleMode outboxState={saleOutbox} onClose={() => setScreen("ledger")} />;

  if (screen === "register") return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span><span className="sub">商品登録</span>
      </header>
      <ItemRegistration onClose={() => setScreen("ledger")} />
    </div>
  );

  if (screen === "labels") return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span><span className="sub">ラベル</span>
      </header>
      <LabelMaker onClose={() => setScreen("ledger")} />
    </div>
  );

  return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span>
        <span className="sub">売上表</span>
      </header>
      <div className="modeline">
        {live ? "Firebase に同期中" : "お試しモード：この画面を閉じると記録は消えます"}
      </div>
      {viewingLedger && activeMarket && <div className="market-running">
        <b>{activeMarket.venue} を開催中です</b>
        <button type="button" className="ghost" onClick={() => { setViewingLedger(false); setScreen("market"); }}>販売に戻る</button>
      </div>}
      {saleOutbox.pendingCount>0 && <div className="outbox-status">送信待ち {saleOutbox.pendingCount}件（通信が戻ると自動で送ります）</div>}
      {deviceNameOpen && <DeviceNameCard name={deviceName} draft={deviceNameDraft}
        onDraft={setDeviceNameDraft} onSave={storeDeviceName}
        onCancel={() => { setDeviceNameDraft(deviceName); setDeviceNameOpen(false); }} />}
      <div className="home-actions">
        <button type="button" className="primary home-register" onClick={() => setScreen("start")}>マルシェを始める</button>
      </div>
      <div className="home-actions">
        <button type="button" className="primary home-register" onClick={() => setScreen("register")}>商品を登録する</button>
      </div>
      <button type="button" className="ghost onsite-button" onClick={() => setScreen("onsite")}>その場で売る</button>
      <div className="utility-row">
        <button type="button" className="ghost" onClick={() => {
          setDeviceNameDraft(deviceName); setDeviceNameOpen(true);
        }}>{deviceName ? "端末名を変える" : "端末名を設定"}</button>
        <button type="button" className="ghost" onClick={() => setScreen("labels")}>ラベルを作る</button>
        <RecordsExport compact />
      </div>

      <nav className="tabs">
        <button data-on={tab==="log"?1:0} onClick={() => setTab("log")}>出店記録</button>
        <button data-on={tab==="due"?1:0} onClick={() => setTab("due")}>
          未入金{pending > 0 && <span className="count">{pending}</span>}
        </button>
        <button data-on={tab==="stl"?1:0} onClick={() => setTab("stl")}>入金</button>
        <button data-on={tab==="sum"?1:0} onClick={() => setTab("sum")}>集計</button>
      </nav>

      {tab==="log" && <>
        <EntryForm onSave={add} venues={venues} organizers={organizers} />
        <div className="hint">記録を長押しすると直せます</div>
        <EventList events={displayEvents} onPick={setPicked} />
      </>}
      {(tab==="due" || tab==="stl") && <MailNotice pending={pending} />}
      {tab==="due" && <Unsettled events={displayEvents} onSettleMany={settleMany} />}
      {tab==="sum" && <Summary events={displayEvents} />}
      {tab==="stl" && <Settlements settlements={settlements} events={displayEvents}
                        onSave={addSettlement} onApply={applySettlement} />}

      {pickedEvent && <EditSheet event={pickedEvent} venues={venues} organizers={organizers} onSave={updateEvent}
                   onDelete={removeEvent} onClose={() => setPicked(null)} />}
      {staleMarket && <StaleMarketPrompt market={staleMarket}
        onCloseYesterday={() => { setStaleMarket(null); setScreen("close"); }}
        onContinue={async () => {
          try {
            await settingsRef.child("activeMarket").update({ continuedOn:localDateKey() });
            setStaleMarket(null); setScreen("market");
          } catch (_) { alert("保存できませんでした。通信を確認して、もう一度押してください。"); }
        }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
