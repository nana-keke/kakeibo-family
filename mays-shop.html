<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>may's shop 売上表</title>
<link rel="manifest" href="mays-shop.webmanifest">
<meta name="theme-color" content="#FBFBF9">
<link rel="apple-touch-icon" href="mays-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF9;
    --rule:#E2E6E0;
    --rule-strong:#C6CCC4;
    --ink:#2B2F36;
    --ink-soft:#79808A;
    --ink-faint:#A8AEB6;
    --seal:#9A3B34;
    --pen:#3D5C7E;
    --minus:#9A3B34;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:18px}
  body{background:var(--paper);color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    font-size:1rem;line-height:1.7;
    font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}

  .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 96px}

  header.masthead{display:flex;align-items:baseline;gap:14px;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
  .title{font-family:"Shippori Mincho",serif;font-weight:700;font-size:2rem;letter-spacing:.16em}
  .sub{font-size:.8rem;color:var(--ink-soft);letter-spacing:.14em;margin-left:auto}
  .modeline{font-size:.8rem;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:26px}

  /* 帳面の背に貼った見出しのつもり。選んでいる面だけ紙の色に抜く */
  nav.tabs{display:flex;margin-bottom:24px;background:var(--ink);
    border-radius:3px;overflow:hidden;padding:3px;gap:2px}
  nav.tabs button{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:1rem;letter-spacing:.08em;color:rgba(251,251,249,.60);
    padding:14px 6px;min-height:52px;border-radius:2px}
  nav.tabs button:hover{color:var(--paper)}
  nav.tabs button[data-on="1"]{background:var(--paper);color:var(--ink);font-weight:700}
  nav.tabs button:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
  nav.tabs .count{font-size:.72rem;line-height:1;color:var(--paper);background:var(--seal);
    border-radius:9px;padding:4px 7px;font-variant-numeric:tabular-nums}

  .hint{font-size:.82rem;color:var(--ink-faint);letter-spacing:.08em;margin:0 0 10px 2px}

  /* --- ledger table --- */
  .ledger{width:100%;border-collapse:collapse;font-size:1rem}
  .ledger th{font-weight:500;font-size:.78rem;letter-spacing:.12em;color:var(--ink-soft);
    text-align:right;padding:0 10px 9px;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
  .ledger th:first-child,.ledger th.l{text-align:left}
  .ledger td{padding:15px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
  .ledger td.l{text-align:left}
  .ledger tbody tr:hover{background:#F3F4F1}
  .pressable{cursor:pointer;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .pressable:active{background:#EDEFEA}
  .date{font-family:"Shippori Mincho",serif;font-size:1rem;letter-spacing:.04em;color:var(--ink-soft)}
  .venue{font-weight:500}
  .org{display:block;font-size:.8rem;color:var(--ink-soft);letter-spacing:.08em;margin-top:3px}
  .memo{display:block;font-size:.78rem;color:var(--ink-faint);letter-spacing:.06em;
    margin-top:2px;max-width:22em;white-space:normal;line-height:1.4}
  .plus{color:var(--pen)}
  .minus{color:var(--minus)}
  .zero{color:var(--ink-faint)}

  /* --- unsettled: brace grouping = the paper ledger's 括弧 --- */
  .group{margin-bottom:30px}
  .group-head{display:flex;align-items:baseline;gap:12px;
    border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:2px}
  .group-name{font-family:"Shippori Mincho",serif;font-size:1.25rem;letter-spacing:.14em}
  .group-rate{font-size:.8rem;color:var(--ink-soft);letter-spacing:.1em}
  .group-total{margin-left:auto;font-size:.95rem;font-variant-numeric:tabular-nums}
  .brace{position:relative;padding-left:26px}
  .brace::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:9px;
    border:1px solid var(--rule-strong);border-right:0;border-radius:7px 0 0 7px}
  .sealbox{display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border:1.5px solid var(--seal);color:var(--seal);
    font-family:"Shippori Mincho",serif;font-size:.9rem;border-radius:3px;
    transform:rotate(-4deg);letter-spacing:0}
  .empty{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:.95rem;letter-spacing:.08em}

  /* --- settlements --- */
  .stl{border:1px solid var(--rule-strong);background:#fff;padding:16px 18px;margin-bottom:20px}
  .stl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:2px}
  .stl-period{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
  .stl-sum{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .stl-sum b{color:var(--ink);font-size:14px;margin-left:4px}
  .stl-foot{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
  .diff{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .pick{width:36px}
  .pick input{width:22px;height:22px;accent-color:var(--pen)}
  .ledger tr[data-on="1"]{background:#F2F5F8}
  .bulk{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin:14px 0 0 26px;padding-top:14px;border-top:1px solid var(--rule)}
  .bulk .primary{margin-left:auto;padding:13px 24px;min-height:48px;font-size:.95rem}

  /* --- form --- */
  form.sheet{border:1px solid var(--rule-strong);padding:24px;margin-bottom:28px;background:#fff}
  .legend{font-family:"Shippori Mincho",serif;font-size:1.15rem;letter-spacing:.16em;
    margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .f{display:flex;flex-direction:column;gap:6px}
  .f.wide{grid-column:span 2}
  .f label{font-size:.82rem;letter-spacing:.1em;color:var(--ink-soft)}
  .f input,.f select{font-family:inherit;font-size:1.05rem;color:var(--ink);
    border:0;border-bottom:1.5px solid var(--rule-strong);background:none;
    padding:10px 2px;width:100%;min-height:46px}
  .f input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
  .f input:focus,.f select:focus{outline:0;border-bottom-color:var(--pen)}
  .f input:focus-visible{outline:0}
  /* --- venue quick pick --- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{font-family:inherit;font-size:.95rem;letter-spacing:.06em;line-height:1;
    background:none;border:1px solid var(--rule-strong);color:var(--ink-soft);
    padding:0 15px;min-height:44px;cursor:pointer;border-radius:2px}
  .chip:hover{border-color:var(--ink)}
  .chip[data-on="1"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip.more{color:var(--ink-faint);border-style:dashed;letter-spacing:.1em}
  .chips.filt{margin:0 0 20px}
  .chips.filt.sub{margin-top:-8px}
  .chips.filt.sub .chip{min-height:38px;font-size:.85rem;padding:0 13px}
  .bar{display:block;height:5px;width:100%;max-width:130px;
    background:var(--rule);margin-top:7px}
  .bar i{display:block;height:100%;background:var(--pen)}
  .bar i[data-neg="1"]{background:var(--minus)}
  .derived-mark{display:block;width:max-content;max-width:100%;margin-top:5px;padding:2px 6px;
    border:1px solid #9AA8B4;background:#F2F5F8;color:var(--ink-soft);font-size:1rem;line-height:1.4}
  .derived-mark.warn{border-color:#C59A5A;background:#FFF4D8;color:#72501F}

  .split{margin-top:24px;padding-top:20px;border-top:1px dashed var(--rule-strong)}
  .split .cap{font-size:.82rem;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:14px}
  .actions{display:flex;align-items:center;gap:16px;margin-top:26px;flex-wrap:wrap}
  .preview{font-size:.95rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .preview b{font-size:1.35rem;color:var(--ink);font-weight:700;margin-left:8px}
  button.primary{margin-left:auto;font-family:inherit;font-size:1rem;letter-spacing:.14em;
    background:var(--ink);color:var(--paper);border:0;padding:15px 32px;cursor:pointer;min-height:52px}
  button.primary:hover{background:#41474F}
  button.primary:disabled{background:var(--rule-strong);cursor:default}
  button.ghost{font-family:inherit;font-size:.9rem;letter-spacing:.08em;
    background:none;border:1px solid var(--rule-strong);color:var(--ink-soft);
    padding:11px 18px;cursor:pointer;min-height:44px}
  button.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
  button.danger-text{color:var(--seal);border-color:#D9C3C1}
  button.danger{font-family:inherit;font-size:1rem;letter-spacing:.14em;
    background:var(--seal);color:#fff;border:0;padding:15px 32px;cursor:pointer;min-height:52px}
  button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

  /* --- ラベル作成 --- */
  .utility-row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:-12px 0 20px}
  .utility-row .ghost{min-height:56px}
  .device-name-card{border:1px solid var(--rule-strong);background:#fff;padding:18px 20px;margin:0 0 24px}
  .device-name-card h2{font-family:"Shippori Mincho",serif;font-size:1.1rem;letter-spacing:.1em;margin-bottom:6px}
  .device-name-card p{color:var(--ink-soft);font-size:.9rem;margin-bottom:12px}
  .device-name-form{display:flex;align-items:flex-end;gap:12px}
  .device-name-form .f{flex:1}
  .device-name-form .primary{margin-left:0}
  .label-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .label-head h2{font-family:"Shippori Mincho",serif;font-size:1.55rem;letter-spacing:.12em}
  .label-head .ghost{margin-left:auto;min-height:56px}
  .label-panel{border:1px solid var(--rule-strong);background:#fff;padding:24px;margin-bottom:24px}
  .label-panel h3{font-family:"Shippori Mincho",serif;font-size:1.15rem;
    letter-spacing:.1em;margin-bottom:14px}
  .label-panel p{color:var(--ink-soft);margin-bottom:16px}
  .choice-row{display:flex;gap:10px;flex-wrap:wrap}
  .choice-row .chip{min-height:56px;font-size:1rem}
  .label-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
  .label-actions .primary{min-height:56px}
  .label-message{padding:13px 15px;margin-top:16px;background:#F2F5F8;border-left:3px solid var(--pen)}
  .label-message.error{background:#FBF3E9;border-left-color:var(--seal)}
  .setting-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .print-guide{border:2px solid var(--ink);padding:16px 18px;margin:18px 0}
  .print-guide h3{margin-bottom:10px}
  .print-guide ul{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
  .print-guide li::before{content:"□";margin-right:8px;font-weight:700}
  .sheet-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .sheet-list .chip{min-height:56px}
  .print-preview-viewport{width:100%;overflow:hidden;background:#E9ECE8;padding:16px}
  .print-pages{width:100%}
  .label-page{background:#fff;position:relative;width:100%;aspect-ratio:210/297;
    margin:0 auto 18px;box-shadow:0 2px 12px rgba(43,47,54,.16);overflow:hidden}
  .label-cell{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .label-qr{display:flex;align-items:center;justify-content:center;width:32%;aspect-ratio:1}
  .label-qr svg{display:block;width:100%;height:100%}
  .test-mark{display:none;position:absolute;inset:0;border:1px solid #000}
  .test-mark::before,.test-mark::after{content:"";position:absolute;background:#000;left:50%;top:50%;transform:translate(-50%,-50%)}
  .test-mark::before{width:14mm;height:.25mm}.test-mark::after{width:.25mm;height:14mm}
  .print-pages.test .label-qr{display:none}
  .print-pages.test .test-mark{display:block}
  .screen-only-note{font-size:.88rem;color:var(--ink-soft);margin-top:10px}

  /* --- 商品登録 --- */
  .home-actions{margin:0 0 24px}
  .home-register{width:100%;min-height:96px!important;margin:0!important;font-size:1.25rem!important}
  .register-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .register-head h2{font-family:"Shippori Mincho",serif;font-size:1.55rem;letter-spacing:.12em}
  .register-head .ghost{margin-left:auto}
  .register-panel{border:1px solid var(--rule-strong);background:#fff;padding:24px;margin-bottom:24px}
  .register-panel h3{font-family:"Shippori Mincho",serif;font-size:1.2rem;letter-spacing:.1em;margin-bottom:14px}
  .camera-box{position:relative;width:100%;max-width:560px;margin:0 auto 18px;background:#17191C;
    border-radius:4px;overflow:hidden;aspect-ratio:3/4}
  .camera-box video{display:block;width:100%;height:100%;object-fit:cover}
  .camera-guide{position:absolute;left:14%;right:14%;top:29%;aspect-ratio:1;border:4px solid #fff;
    box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
  .scan-message{padding:14px 16px;margin:14px 0;background:#F2F5F8;border-left:3px solid var(--pen)}
  .scan-message.error{background:#FBF3E9;border-left-color:var(--seal)}
  .form-block{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
  .form-block:last-of-type{border-bottom:0}
  .form-block>label,.form-cap{display:block;font-weight:700;margin-bottom:10px}
  .name-entry{font-family:inherit;font-size:1rem;width:100%;min-height:56px;
    border:1px solid var(--rule-strong);padding:10px 12px;background:#fff}
  .number-display{display:flex;align-items:center;justify-content:center;min-height:70px;
    border:2px solid var(--ink);background:#fff;font-size:1.55rem;font-weight:700;
    font-variant-numeric:tabular-nums;margin:10px 0}
  .number-display .muted{color:var(--ink-faint);font-weight:500}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
  .keypad button{font-family:inherit;font-size:1.2rem;background:#fff;border:1px solid var(--rule-strong);cursor:pointer}
  .keypad button:active{background:#EDEFEA}
  .photo-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;
    background:var(--ink);color:var(--paper);cursor:pointer;font-weight:700;letter-spacing:.08em}
  .file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .photo-preview{display:block;width:200px;height:200px;max-width:100%;object-fit:cover;
    margin:16px auto 0;border:1px solid var(--rule-strong)}
  .cost-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .register-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
  .register-actions .primary{min-height:64px}
  .unsupported{padding:24px;border:2px solid var(--seal);background:#FBF3E9}

  /* --- 販売モード --- */
  .outbox-status{margin:-8px 0 18px;padding:11px 14px;background:#FFF4D8;
    border-left:3px solid #B77816;font-weight:700}
  .outbox-status.error{background:#FBF3E9;border-left-color:var(--seal)}
  .other-device-warning{margin:0 0 12px;padding:13px 15px;background:#FFF4D8;
    border-left:3px solid #B77816;line-height:1.6}
  .other-device-warning b{display:block;margin-bottom:3px}
  .other-device-warning span{color:var(--ink-soft)}
  .sale-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .sale-head h2{font-family:"Shippori Mincho",serif;font-size:1.55rem;letter-spacing:.12em}
  .sale-head-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .market-running{display:flex;align-items:center;gap:12px;justify-content:space-between;
    flex-wrap:wrap;margin:0 0 20px;padding:12px 14px;background:#F2F5F8;border-left:3px solid var(--pen)}
  .market-running b{font-weight:700}
  .sale-today{background:var(--ink);color:var(--paper);padding:18px 20px;margin-bottom:20px;
    display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .sale-today b{font-size:1.7rem;font-variant-numeric:tabular-nums}
  .cart-panel{border:2px solid var(--ink);background:#fff;padding:18px;margin:20px 0}
  .cart-panel h3{font-family:"Shippori Mincho",serif;font-size:1.2rem;letter-spacing:.1em;margin-bottom:12px}
  .cart-empty{color:var(--ink-soft);padding:16px 0}
  .cart-row{display:grid;grid-template-columns:minmax(0,1fr) 132px 72px;gap:10px;
    align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
  .cart-name{min-width:0}.cart-name b,.cart-name span{display:block;overflow-wrap:anywhere}
  .cart-name span{color:var(--ink-soft);margin-top:3px}
  .cart-price{display:flex;align-items:center;gap:4px}
  .cart-price input{width:100%;min-width:0;min-height:56px;border:1px solid var(--rule-strong);
    background:#fff;padding:8px;text-align:right;font:inherit;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .cart-remove{padding:8px!important;min-width:0}
  .cart-total{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding-top:18px;font-weight:700}
  .cart-total b{font-size:1.7rem;font-variant-numeric:tabular-nums}
  .pay-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .pay-buttons button{margin:0!important;padding:12px 8px!important;min-height:72px!important;
    font-size:1.05rem!important;letter-spacing:.03em!important}
  .undo-bar{background:#FFF4D8;border:2px solid #B77816;padding:14px;margin-top:16px;
    display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .undo-bar .danger{margin-left:auto}
  .market-form{border:2px solid var(--ink);background:#fff;padding:24px;margin-bottom:24px}
  .market-form h2,.market-close h2{font-family:"Shippori Mincho",serif;font-size:1.55rem;
    letter-spacing:.12em;margin-bottom:18px}
  .market-form .primary{width:100%;margin:22px 0 0;min-height:72px!important}
  .market-close{border:2px solid var(--ink);background:#fff;padding:24px}
  .market-close h3{font-family:"Shippori Mincho",serif;font-size:1.2rem;margin-bottom:8px}
  .reconcile-recorded{background:var(--ink);color:var(--paper);padding:18px;margin:18px 0;
    display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .reconcile-recorded b,.reconcile-diff b{font-size:1.65rem;font-variant-numeric:tabular-nums}
  .reconcile-inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .reconcile-inputs input{width:100%;min-height:64px;border:1px solid var(--rule-strong);
    padding:10px 12px;font:inherit;font-size:1.2rem;text-align:right}
  .reconcile-diff{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border-top:2px solid var(--ink);margin-top:20px;padding-top:18px;font-weight:700}
  .market-close-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .market-close-actions .primary{margin-left:auto}
  .stale-card{position:fixed;inset:0;z-index:70;background:rgba(43,47,54,.55);padding:20px;
    display:flex;align-items:center;justify-content:center}
  .stale-card>div{width:100%;max-width:560px;background:#fff;border:2px solid var(--ink);padding:24px}
  .stale-card h2{font-family:"Shippori Mincho",serif;font-size:1.4rem;margin-bottom:14px}
  .stale-actions{display:grid;gap:10px;margin-top:20px}
  .onsite-button{width:100%;margin:0 0 20px!important}
  .records-export{border:1px solid var(--rule-strong);background:#fff;padding:18px;margin-top:22px}
  .records-export p{color:var(--ink-soft);margin-bottom:12px}
  .records-export .ghost{width:100%}
  .export-message{margin-top:12px;padding:11px 13px;background:#F2F5F8;border-left:3px solid var(--pen)}
  .export-message.error{background:#FBF3E9;border-left-color:var(--seal)}
  .utility-row .records-export{border:0;background:none;padding:0;margin:0}
  .utility-row .records-export p{display:none}

  @media print{
    @page{size:A4;margin:0}
    html,body,#root,.wrap{width:210mm!important;max-width:none!important;margin:0!important;
      padding:0!important;overflow:visible!important;background:#fff}
    .wrap>*:not(.print-preview-viewport):not(style){display:none!important}
    body *{visibility:hidden!important}
    .print-pages,.print-pages *{visibility:visible!important}

<script type="text/babel">
/* ============================================================

const DEVICE_ID_KEY = "mays-shop-device-id";
function getOrCreateDeviceId(){
  const saved = localStorage.getItem(DEVICE_ID_KEY);
  if (saved) return saved;
  let id;
  if (crypto.randomUUID) id = `DEV-${crypto.randomUUID()}`;
  else {
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    id = `DEV-${[...bytes].map(value => value.toString(16).padStart(2,"0")).join("")}`;
  }
  localStorage.setItem(DEVICE_ID_KEY, id);
  return id;
}
const DEVICE_ID = getOrCreateDeviceId();
const DEVICE_PROFILE_KEY = "mays-shop-device-profile";
function getDeviceName(){

    return profile && profile.deviceId === DEVICE_ID ? String(profile.name||"").trim() : "";

}
function saveDeviceName(name){

}

/* ============================================================
   設定：ここに自分の Firebase の値を入れると同期が有効になる。

const FIREBASE_CONFIG = {

  authDomain: "kakeibo-family-874a4.firebaseapp.com",

/* このアプリ専用のルートノード。家計簿など他アプリと同じ Firebase を共有するため、
   読み書きはすべてこの配下に閉じる。ルート直下には触らない。 */
const APP_ROOT = "detenLedger";

const RATE = { credit: 0.0248, paypay: 0.0198 };   // 手数料率
/* taxRate: 手数料にかかる消費税。ペイペイは手数料の10%が別途引かれる
   （紙の帳簿の6グループ全部で 売上−手数料−税=入金 が1円まで一致した）。
   クレジット(エアレジ)は 売上−手数料=入金 で合うため 0。 */
const METHODS = [
  { key:"cash",   label:"現金",       rate:0,           taxRate:0    },
  { key:"credit", label:"クレジット", rate:RATE.credit, taxRate:0    },
  { key:"paypay", label:"PayPay",     rate:RATE.paypay, taxRate:0.10 }
];
const RECEIVABLE = METHODS.filter(m => m.rate > 0);

const yen = n => (n<0?"△":"") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const localDateKey = (date=new Date()) => {
  const year=date.getFullYear(), month=String(date.getMonth()+1).padStart(2,"0"), day=String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
};
const fee = (amt, rate) => Math.floor(amt * rate);
const tax = (feeAmt, taxRate) => Math.floor(feeAmt * taxRate);
/* 手段ごとの控除合計（手数料＋税）。入金額 = 売上 − これ */
const deduct = (amt, m) => { const f = fee(amt, m.rate); return f + tax(f, m.taxRate); };

/* ---- storage ---- */
let appRef = null, eventsRef = null, settlementsRef = null, labelsRef = null,
    settingsRef = null, itemsRef = null, photosRef = null, salesRef = null,
    syncStatusRef = null;
const live = !!FIREBASE_CONFIG.databaseURL;
if (live) {
  firebase.initializeApp(FIREBASE_CONFIG);
  appRef         = firebase.database().ref(APP_ROOT);
  eventsRef      = appRef.child("events");
  settlementsRef = appRef.child("settlements");
  labelsRef      = appRef.child("labels");
  settingsRef    = appRef.child("settings");
  itemsRef       = appRef.child("items");
  photosRef      = appRef.child("photos");
  salesRef       = appRef.child("sales");
  syncStatusRef  = appRef.child("syncStatus");
}

/* ---- 一件の損益 ----
   material は布などの材料費。紙の帳簿の「利益」に合わせるため差し引く。
   古いデータには無いので、未入力は 0 として扱う。 */
function profitOf(e){
  const gross = METHODS.reduce((s,m) => s + (e[m.key]||0), 0);
  const fees  = METHODS.reduce((s,m) => s + deduct(e[m.key]||0, m), 0);
  return { gross, fees,
           net: gross - fees - (e.fee||0) - (e.transit||0) - (e.material||0) };
}

/* 商品販売から作った出店だけ、表示時にsalesを集計して上書きする。
   eventsの保存値には書き戻さず、過去の手入力記録はそのまま使う。 */
function deriveEventsFromSales(events, salesById){
  const byEvent = {};
  Object.keys(salesById||{}).forEach(id => {
    const sale = salesById[id];
    if (!sale || sale.voided || !sale.eventId) return;
    const sum = byEvent[sale.eventId] = byEvent[sale.eventId] || {
      cash:0, credit:0, paypay:0, material:0, salesCount:0, unknownCostCount:0
    };
    if (Object.prototype.hasOwnProperty.call(sum,sale.method)) sum[sale.method] += Number(sale.price)||0;
    if (sale.cost===null || sale.cost===undefined || sale.cost==="") sum.unknownCostCount++;
    else sum.material += Number(sale.cost)||0;
    sum.salesCount++;
  });
  return events.map(event => {
    if (!event.salesMode) return event;
    const sum = byEvent[event.id] || {cash:0,credit:0,paypay:0,material:0,salesCount:0,unknownCostCount:0};
    return {...event,...sum,salesDerived:true};
  });
}

/* ---- 売掛の突合 ----
   突合は gross（売上総額）で行う。手数料は決済1件ごとに切り捨てられるため、
   日次合計に floor をかけている当アプリの手数料額とは数円ずれる。gross はずれない。
   メール記載の手数料は settlement 側に持ち、表示にだけ使う（損益の計算式は変えない）。 */
const labelOf = k => (METHODS.find(m => m.key === k) || {}).label || k;

/* この入金の対象になりうるイベント：期間内・その手段の売上あり・未消込（またはこの入金で消込済） */
function candidatesOf(stl, events){
  return events
    .filter(e => (e[stl.method]||0) > 0
              && e.date >= stl.periodFrom && e.date <= stl.periodTo)
    .filter(e => { const s = (e.settled||{})[stl.method]; return !s || s === stl.id; })
    .sort((a,b) => a.date.localeCompare(b.date));
}

/* ---- 選択候補 ----
   マスタ表は持たず、登録済みイベントから組み立てる。
   並びは「直近1年で何回使ったか」→「最後に使ったのがいつか」の順。
   通算ではなく直近で見るので、いま通っている会場だけが前に出て、
   行かなくなった会場は放っておけば下がる。新しい会場も使うほど上がる。 */
const RECENT_DAYS = 365;

function optionsOf(events, key){
  const cut = new Date(Date.now() - RECENT_DAYS*864e5).toISOString().slice(0,10);
  const stat = {};
  events.forEach(e => {
    const v = (e[key] || "").trim();
    if (!v) return;
    const s = stat[v] = stat[v] || { recent:0, last:"" };
    if (e.date >= cut) s.recent++;
    if (e.date > s.last) s.last = e.date;
  });
  return Object.keys(stat).sort((a,b) =>
    stat[b].recent - stat[a].recent ||
    stat[b].last.localeCompare(stat[a].last) ||
    a.localeCompare(b, "ja"));
}

const CHIP_HEAD = 4;   // 最初に見せる数。残りは「ほか◯」で開く

function ChipField({ label, value, onChange, options, placeholder }){
  const [all, setAll] = useState(false);
  const shown  = all ? options : options.slice(0, CHIP_HEAD);
  const hidden = options.length - shown.length;
  const hit    = value.trim();

  return (
    <div className="f wide">
      <label>{label}</label>
      <input value={value} onChange={ev => onChange(ev.target.value)} placeholder={placeholder} />
      {!!options.length && (
        <div className="chips">
          {shown.map(name => (
            <button type="button" key={name} className="chip"
              data-on={hit === name ? 1 : 0} aria-pressed={hit === name}
              onClick={() => onChange(hit === name ? "" : name)}>{name}</button>
          ))}
          {hidden > 0 &&
            <button type="button" className="chip more"
              onClick={() => setAll(true)}>ほか{hidden}</button>}
          {all && options.length > CHIP_HEAD &&
            <button type="button" className="chip more"
              onClick={() => setAll(false)}>とじる</button>}
        </div>
      )}
    </div>
  );
}

/* ============================ 1. 記録 ============================ */
function EntryForm({ onSave, venues, organizers }){
  const blank = { date:"", venue:"", organizer:"", fee:"", transit:"", material:"", note:"", cash:"", credit:"", paypay:"" };
  const [v, setV] = useState(blank);
  const set = k => ev => setV({ ...v, [k]: ev.target.value });

  const draft = { fee:n("fee"), transit:n("transit"), material:n("material"),
                  cash:n("cash"), credit:n("credit"), paypay:n("paypay") };
  const p = profitOf(draft);
  const ready = v.date && v.venue;

  const save = () => {
    if (!ready) return;
    onSave({ id: String(Date.now()), date:v.date, venue:v.venue.trim(),

  return (

      <div className="grid">
        <div className="f"><label>日付</label>

        <div className="f"><label>天候・メモ</label>
          <input value={v.note} onChange={set("note")} placeholder="雨" /></div>
        <div className="f"><label>出店料</label>

        <div className="f"><label>材料費</label>
          <input type="number" value={v.material} onChange={set("material")} placeholder="0" /></div>

      <div className="split">

          {METHODS.map(m => (
            <div className="f" key={m.key}>

              <input type="number" value={v[m.key]} onChange={set(m.key)} placeholder="0" />
            </div>
          ))}
        </div>
      </div>

      <div className="actions">
        <div className="preview">
          売上 {yen(p.gross)}　手数料 {yen(p.fees)}　利益
          <b className={p.net<0?"minus":"plus"}>{yen(p.net)}</b>
        </div>
        <button type="button" className="primary" onClick={save} disabled={!ready}>記録する</button>
      </div>
    </form>
  );
}

/* ---- 長押し判定 ----
   0.6秒押し続けたら発火。指が動いたら（スクロール）取り消す。 */
function useLongPress(onFire){
  const timer = React.useRef(null);
  const start = React.useRef([0,0]);
  const clear = () => { clearTimeout(timer.current); timer.current = null; };
  const down = ev => {
    const t = ev.touches ? ev.touches[0] : ev;
    start.current = [t.clientX, t.clientY];
    timer.current = setTimeout(onFire, 600);
  };
  const move = ev => {
    if (!timer.current) return;
    const t = ev.touches ? ev.touches[0] : ev;
    const [x,y] = start.current;
    if (Math.abs(t.clientX-x) > 10 || Math.abs(t.clientY-y) > 10) clear();
  };
  return { onTouchStart:down, onTouchMove:move, onTouchEnd:clear, onTouchCancel:clear,
           onMouseDown:down, onMouseMove:move, onMouseUp:clear, onMouseLeave:clear,
           onContextMenu: ev => ev.preventDefault() };
}

function EditSheet({ event, onSave, onDelete, onClose, venues, organizers }){
  const init = { date:event.date, venue:event.venue,

  const [confirming, setConfirming] = useState(false);
  const set = k => ev => setV({ ...v, [k]: ev.target.value });
  const n = k => Number(v[k]) || 0;

  const draft = { fee:n("fee"), transit:n("transit"), material:n("material"),
                  cash:n("cash"), credit:n("credit"), paypay:n("paypay") };
  const p = profitOf(draft);
  const ready = v.date && v.venue.trim();
  const settledMethods = RECEIVABLE.filter(m => (event.settled||{})[m.key]);

  return (
    <div className="sheet-back" onClick={ev => { if (ev.target === ev.currentTarget) onClose(); }}>
      <div className="sheet-card" role="dialog" aria-label="出店の記録を編集">

        {!!settledMethods.length && (
          <div className="warn">
            {settledMethods.map(m => m.label).join("・")}は入金済みです。
            金額を変えると消込とずれます。
          </div>
        )}
        {event.salesMode && <div className="label-message">
          売上と材料費は、販売した商品から自動で計算されます。ここでは出店料・交通費などを直せます。
        </div>}

        <div className="grid">
          <div className="f"><label>日付</label>
            <input type="date" value={v.date} onChange={set("date")} /></div>
          <ChipField label="会場" placeholder="ベルファーム"
            value={v.venue} options={venues}
            onChange={x => setV(p => ({ ...p, venue:x }))} />
          <ChipField label="主催者" placeholder="（任意）"
            value={v.organizer} options={organizers}
            onChange={x => setV(p => ({ ...p, organizer:x }))} />
          <div className="f wide"><label>天候・メモ</label>
            <input value={v.note} onChange={set("note")} /></div>
          <div className="f"><label>出店料</label>
            <input type="number" value={v.fee} onChange={set("fee")} /></div>
          <div className="f"><label>交通費</label>
            <input type="number" value={v.transit} onChange={set("transit")} /></div>
          <div className="f"><label>材料費</label>
            <input type="number" value={v.material} disabled={event.salesMode} onChange={set("material")} /></div>
        </div>

        <div className="split">
          <div className="cap">売上の内訳</div>
          <div className="grid">
            {METHODS.map(m => (
              <div className="f" key={m.key}>
                <label>{m.label}</label>
                <input type="number" value={v[m.key]} disabled={event.salesMode} onChange={set(m.key)} />
              </div>
            ))}
          </div>
        </div>

        <div className="preview">
          売上 {yen(p.gross)}　手数料 {yen(p.fees)}　損益
          <b className={p.net<0?"minus":"plus"}>{yen(p.net)}</b>
        </div>

        {confirming ? (
          <div className="confirm">
            <div className="confirm-q">
              <b>{event.date}　{event.venue}　売上 {yen(profitOf(event).gross)}</b><br />
              この記録を消します。元に戻せません。
            </div>
            <div className="sheet-actions">
              <button className="ghost" onClick={() => setConfirming(false)}>やめる</button>
              <button className="danger" onClick={() => onDelete(event.id)}>消す</button>
            </div>
          </div>
        ) : (
          <div className="sheet-actions">
            <button className="ghost danger-text" onClick={() => setConfirming(true)}>削除</button>
            <button className="ghost" onClick={onClose}>キャンセル</button>
            <button className="primary" disabled={!ready}
              onClick={() => onSave(event.id, { date:v.date, venue:v.venue.trim(),
                                                organizer:v.organizer.trim(),
                                                note:v.note.trim(), fee:draft.fee, transit:draft.transit,
                                                ...(event.salesMode?{}:{material:draft.material,
                                                  cash:draft.cash,credit:draft.credit,paypay:draft.paypay}) })}>保存</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- 損益の出し方についてのおしらせ ----
   紙のノートは利益からカード手数料を引いていないので、アプリの損益とは
   必ずずれる。黙っていると「アプリの計算が違う」と見えるため、経緯ごと残す。
   普段は1行。数字は毎回集計するので古くならない。 */
function FeeNotice({ fees }){
  const [open, setOpen] = useState(false);
  if (!fees) return null;
  return (
    <div className="notice">
      <button type="button" onClick={() => setOpen(!open)} aria-expanded={open}>
        損益はカード手数料を引いた金額です
        <span className="mark">{open ? "とじる" : "くわしく"}</span>
      </button>
      {open && (
        <div className="notice-body">
          <p>
            ノートに書いてある利益は、クレジットとPayPayの手数料を引いていません。
            この表の損益は引いています。そのぶん<b>ノートより少なく出ます</b>
            （これまでの合計で {yen(fees)}）。
          </p>
          <p>
            表示のしかたは3つの案から選びました。
          </p>
          <ul>
            <li><b>A 手数料を引く</b>　… いま使っている表示。手元に残るお金に近い</li>
            <li>B 引かない　… ノートと同じ数字になるが、手数料が見えない</li>
            <li>C 入金済みは実際の手数料を使う　… いちばん正確だが、未入金の分は結局概算</li>
          </ul>
          <p className="sig">
            2026年8月9日、<b>A</b> を選択。変えたくなったら言ってください。
          </p>
        </div>
      )}

  );
}

/* 年ごとにまとめる。件数が増えると縦に伸びすぎるため、
   既定では最新の年だけ開き、古い年は見出しだけにしておく。 */
function yearsOf(rows){
  const by = {};
  rows.forEach(e => { (by[e.date.slice(0,4)] = by[e.date.slice(0,4)] || []).push(e); });
  return Object.keys(by).sort((a,b) => b.localeCompare(a))
    .map(y => {
      const list = by[y];
      return { year:y, list,
               gross: list.reduce((s,e) => s + profitOf(e).gross, 0),
               net:   list.reduce((s,e) => s + profitOf(e).net,   0) };
    });
}

function EventList({ events, onPick }){
  const rows = [...events].sort((a,b) => b.date.localeCompare(a.date));
  const tot = rows.reduce((s,e) => s + profitOf(e).net, 0);
  const avg = rows.length ? tot / rows.length : 0;
  const years = yearsOf(rows);
  /* Firebase の読み込み前は years が空なので、初期値を state に固定できない。
     触られるまでは null のままにして「最新の年だけ開く」を毎回導出する。 */
  const [picked, setPicked] = useState(null);
  const open = picked || new Set(years.length ? [years[0].year] : []);
  const toggle = y => setPicked(() => {
    const s = new Set(open); s.has(y) ? s.delete(y) : s.add(y); return s;
  });

  if (!rows.length) return <div className="empty">まだ記録がありません。上のフォームから最初の出店を入れてください。</div>;

  return (
    <>
      <table className="ledger">
        <thead><tr>
          <th className="l">日付</th><th className="l">会場</th>
          <th>売上</th><th className="hide-sm">出店料</th><th className="hide-sm">交通費</th>
          <th className="hide-sm">材料費</th><th className="hide-sm">手数料</th><th>損益</th>
        </tr></thead>
        {years.map(g => {
          const on = open.has(g.year);
          return (
            <tbody key={g.year}>
              <tr className="yearhead">
                <td colSpan={8}>
                  <button type="button" onClick={() => toggle(g.year)} aria-expanded={on}>
                    <span className="caret">{on ? "▾" : "▸"}</span>
                    <span className="y">{g.year}年</span>
                    <span className="n">{g.list.length}回</span>
                    <span className="g">売上 {yen(g.gross)}</span>
                    <b className={"num " + (g.net<0?"minus":"plus")}>{yen(g.net)}</b>
                  </button>
                </td>
              </tr>
              {on && g.list.map(e => <EventRow key={e.id} e={e} onPick={onPick} />)}
            </tbody>
          );
        })}
      </table>
      <div className="foot">
        <div><span>出店</span><b className="num">{rows.length}回</b></div>
        <div><span>累計損益</span><b className={"num "+(tot<0?"minus":"plus")}>{yen(tot)}</b></div>
        <div><span>1回平均</span><b className="num">{yen(avg)}</b></div>
      </div>
      <FeeNotice fees={rows.reduce((s,e) => s + profitOf(e).fees, 0)} />
    </>
  );
}

/* ============================ 2. 未入金 ============================ */
function Unsettled({ events, onSettleMany }){
  /* 選択は手段をまたぐので "手段:id" で1つの Set に持つ */
  const [sel, setSel] = useState(new Set());
  const [asking, setAsking] = useState(null);   // 確認中の手段
  const tag = (m,id) => m + ":" + id;
  const toggle = k => setSel(p => {
    const s = new Set(p); s.has(k) ? s.delete(k) : s.add(k); return s;
  });

  const groups = RECEIVABLE.map(m => ({
    ...m,
    rows: events
      .filter(e => (e[m.key]||0) > 0 && !(e.settled||{})[m.key])
      .sort((a,b) => a.date.localeCompare(b.date))
  }));

  const any = groups.some(g => g.rows.length);
  if (!any) return <div className="empty">未入金はありません。売掛はすべて消し込み済みです。</div>;

  return (
    <>
      {groups.map(g => {
        if (!g.rows.length) return null;
        /* 手数料は決済のたびに切り捨てられるので、行ごとに出すと実額とずれる。
           入金は期間の合計に対して計算されるため、合計から求める。 */
        const gross = g.rows.reduce((s,e) => s + e[g.key], 0);
        const fees  = fee(gross, g.rate);
        const taxes = tax(fees, g.taxRate);

        const chosen  = g.rows.filter(e => sel.has(tag(g.key, e.id)));
        const allOn   = chosen.length === g.rows.length;
        const pickSum = chosen.reduce((s,e) => s + e[g.key], 0);
        const toggleAll = () => setSel(p => {
          const s = new Set(p);
          g.rows.forEach(e => allOn ? s.delete(tag(g.key,e.id)) : s.add(tag(g.key,e.id)));
          return s;
        });
        const apply = () => {
          onSettleMany(chosen.map(e => e.id), g.key);
          setSel(p => { const s = new Set(p);
            chosen.forEach(e => s.delete(tag(g.key,e.id))); return s; });
          setAsking(null);
        };

        return (
          <div className="group" key={g.key}>
            <div className="group-head">
              <span className="group-name">{g.label}</span>
              <span className="group-rate">
                {(g.rate*100).toFixed(2)}%{g.taxRate > 0 && ` ＋税${g.taxRate*100}%`}
              </span>
              <span className="group-total num">
                売掛 {yen(gross)}　手数料 {yen(fees)}
                {g.taxRate > 0 && `　税 ${yen(taxes)}`}
                　入金予定 <b>{yen(gross - fees - taxes)}</b>
              </span>
            </div>
            <div className="brace">
              <table className="ledger">
                <tbody>
                  {g.rows.map(e => {
                    const amt = e[g.key], f = deduct(amt, g);
                    const [,mm,dd] = e.date.split("-");
                    const k = tag(g.key, e.id), on = sel.has(k);
                    return (
                      <tr key={e.id} className="pressable" data-on={on?1:0}
                          onClick={() => toggle(k)}>
                        <td className="l pick">
                          <input type="checkbox" checked={on} onChange={() => toggle(k)}
                            onClick={ev => ev.stopPropagation()}
                            aria-label={`${e.date} ${e.venue} ${g.label} ${yen(amt)} を選ぶ`} /></td>
                        <td className="l date num">{Number(mm)}/{Number(dd)}</td>
                        <td className="l venue">{e.venue}</td>
                        <td className="num">{yen(amt)}</td>
                        <td className="num zero hide-sm">−{yen(f)}</td>
                        <td className="num">{yen(amt-f)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="bulk">
              <button type="button" className="ghost" onClick={toggleAll}>
                {allOn ? "選択をはずす" : `すべて選ぶ（${g.rows.length}件）`}
              </button>
              <span className="diff">
                {chosen.length ? `${chosen.length}件　${yen(pickSum)}` : "選ばれていません"}
              </span>
              <button type="button" className="primary" disabled={!chosen.length}
                onClick={() => setAsking(g.key)}>入金済にする</button>
            </div>

            {asking === g.key && !!chosen.length && (
              <div className="confirm">
                <div className="confirm-q">
                  <b>{g.label}　{chosen.length}件　{yen(pickSum)}</b><br />
                  これらを入金済にします。未入金の一覧から消えます。
                </div>
                <div className="sheet-actions">
                  <button type="button" className="ghost"
                    onClick={() => setAsking(null)}>やめる</button>
                  <button type="button" className="primary"
                    onClick={apply}>入金済にする</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </>
  );
}

/* ============================ 3. 入金 ============================ */
function SettlementForm({ onSave }){
  const blank = { method:"credit", periodFrom:"", periodTo:"", payoutDate:"", gross:"", fee:"" };
  const [v, setV] = useState(blank);
  const set = k => ev => setV({ ...v, [k]: ev.target.value });
  const n = k => Number(v[k]) || 0;
  const ready = v.periodFrom && v.periodTo && v.payoutDate && n("gross") > 0;

  const save = () => {
    if (!ready) return;
    onSave({ id:"stl"+Date.now(), method:v.method,
             periodFrom:v.periodFrom, periodTo:v.periodTo, payoutDate:v.payoutDate,
             gross:n("gross"), fee:n("fee"), amount:n("gross")-n("fee"),
             source:"manual", matched:false });
    setV(blank);
  };

  return (
    <form className="sheet" onSubmit={ev => ev.preventDefault()}>
      <div className="legend">入金を記録する（振込確定メールの内容）</div>
      <div className="grid">
        <div className="f"><label>手段</label>
          <select value={v.method} onChange={set("method")}>
            {RECEIVABLE.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}
          </select></div>
        <div className="f"><label>期間開始</label>
          <input type="date" value={v.periodFrom} onChange={set("periodFrom")} /></div>
        <div className="f"><label>期間終了</label>
          <input type="date" value={v.periodTo} onChange={set("periodTo")} /></div>
        <div className="f"><label>振込日</label>
          <input type="date" value={v.payoutDate} onChange={set("payoutDate")} /></div>
        <div className="f"><label>売上総額</label>
          <input type="number" value={v.gross} onChange={set("gross")} placeholder="0" /></div>
        <div className="f"><label>手数料</label>
          <input type="number" value={v.fee} onChange={set("fee")} placeholder="0" /></div>
      </div>
      <div className="actions">
        <div className="preview">振込額 <b>{yen(n("gross") - n("fee"))}</b></div>
        <button type="button" className="primary" onClick={save} disabled={!ready}>記録する</button>
      </div>
    </form>
  );
}

function SettlementCard({ stl, events, onApply }){
  const cands = candidatesOf(stl, events);
  const key = cands.map(e => e.id).join(",");
  const [sel, setSel] = useState(() => new Set(cands.map(e => e.id)));
  /* 候補が入れ替わったら「全部入り」に戻す＝自動突合の初期案 */
  useEffect(() => { setSel(new Set(cands.map(e => e.id))); }, [key]);

  const done   = !!stl.matched;
  const chosen = cands.filter(e => sel.has(e.id));
  const sum    = chosen.reduce((s,e) => s + e[stl.method], 0);
  const diff   = sum - stl.gross;
  const toggle = id => setSel(p => {
    const s = new Set(p); s.has(id) ? s.delete(id) : s.add(id); return s;
  });
  const [,pm,pd] = stl.payoutDate.split("-");

  return (
    <div className="stl">
      <div className="stl-head">
        <span className="group-name">{labelOf(stl.method)}</span>
        <span className="stl-period">
          {stl.periodFrom.slice(5)} 〜 {stl.periodTo.slice(5)}　振込 {Number(pm)}/{Number(pd)}
        </span>
        <span className="stl-sum">
          売上 {yen(stl.gross)}　手数料 {yen(stl.fee)}　振込額 <b>{yen(stl.amount)}</b>
        </span>
      </div>

      {!cands.length
        ? <div className="empty">この期間に該当する売掛がありません。</div>
        : <table className="ledger"><tbody>
            {cands.map(e => {
              const [,mm,dd] = e.date.split("-");
              return (
                <tr key={e.id}>
                  <td className="l pick">
                    {done
                      ? <span className="sealbox">済</span>
                      : <input type="checkbox" checked={sel.has(e.id)}
                          onChange={() => toggle(e.id)}
                          aria-label={`${e.date} ${e.venue} をこの入金に含める`} />}
                  </td>
                  <td className="l date num">{Number(mm)}/{Number(dd)}</td>
                  <td className="l venue">{e.venue}</td>
                  <td className="num">{yen(e[stl.method])}</td>
                </tr>
              );
            })}
          </tbody></table>}

      {!done && !!cands.length && (
        <div className="stl-foot">
          <span className="diff">
            選択 {yen(sum)} ／ メール {yen(stl.gross)}
            {diff !== 0 && <b className="minus">　差額 {yen(diff)}</b>}
          </span>
          <button className="primary" disabled={diff !== 0 || !chosen.length}
            onClick={() => onApply(stl, chosen.map(e => e.id))}>
            {diff === 0 ? `この${chosen.length}件を消し込む` : "金額が合いません"}
          </button>
        </div>
      )}
    </div>
  );
}

function Settlements({ settlements, events, onSave, onApply }){
  const rows = [...settlements].sort((a,b) => b.payoutDate.localeCompare(a.payoutDate));
  return (
    <>
      <SettlementForm onSave={onSave} />
      {rows.length
        ? rows.map(s => <SettlementCard key={s.id} stl={s} events={events} onApply={onApply} />)
        : <div className="empty">入金の記録がありません。振込確定メールの内容を上のフォームから入れてください。</div>}
    </>
  );
}

                それまでは、いままでどおり手で入れておきます。急ぎではありません。
              </p>
            </div>

            <div className="sheet-actions">
              <button type="button" className="primary"
                onClick={() => setOpen(false)}>とじる</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ============================ 4. 集計 ============================ */
const VIEWS = [
  { key:"venue",     label:"会場別"   },
  { key:"organizer", label:"主催者別" },
  { key:"month",     label:"月別"     },
  { key:"method",    label:"決済手段" },
  { key:"cost",      label:"経費"     },
];

/* 何でくくるかだけ差し替えて、回数・売上・損益を足し上げる */
function groupBy(rows, keyOf){
  const by = {};
  rows.forEach(e => {
    const k = keyOf(e);
    if (!k) return;
    const p = profitOf(e);
    const v = by[k] = by[k] || { key:k, n:0, gross:0, net:0 };
    v.n++; v.gross += p.gross; v.net += p.net;
  });
  return Object.values(by);
}

/* 会場別・主催者別・月別で使う共通の表。bar は月別だけ（推移を見るため） */
function GroupTable({ list, label, bar }){
  const peak = Math.max(1, ...list.map(v => Math.abs(v.net)));
  return (
    <table className="ledger">
      <thead><tr>
        <th className="l">{label}</th><th>回数</th><th className="hide-sm">売上</th>
        <th>損益</th><th>1回平均</th><th className="hide-sm">利益率</th>
      </tr></thead>
      <tbody>
        {list.map(v => (
          <tr key={v.key}>
            <td className="l"><span className="venue">{v.key}</span>
              {bar && <span className="bar">
                <i style={{ width: Math.abs(v.net)/peak*100 + "%" }}
                   data-neg={v.net<0?1:0} /></span>}</td>
            <td className="num">{v.n}</td>
            <td className="num hide-sm">{yen(v.gross)}</td>
            <td className={"num " + (v.net<0?"minus":"plus")}>{yen(v.net)}</td>
            <td className="num">{yen(v.net / v.n)}</td>
            <td className="num hide-sm zero">
              {v.gross ? Math.round(v.net / v.gross * 100) + "%" : "—"}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function Summary({ events }){
  const years = [...new Set(events.map(e => e.date.slice(0,4)))].sort((a,b) => b.localeCompare(a));
  const [year, setYear] = useState("all");
  const [view, setView] = useState("venue");
  const rows = year === "all" ? events : events.filter(e => e.date.slice(0,4) === year);

  if (!events.length) return <div className="empty">まだ記録がありません。</div>;

  const byNet = (a,b) => b.net - a.net || b.gross - a.gross;
  const gross = rows.reduce((s,e) => s + profitOf(e).gross, 0);
  const net   = rows.reduce((s,e) => s + profitOf(e).net,   0);
  const sum   = k => rows.reduce((s,e) => s + (e[k]||0), 0);
  const share = v => gross ? Math.round(v / gross * 100) + "%" : "—";

  let body = null;

  if (view === "venue" || view === "organizer") {
    const key  = view === "venue" ? "venue" : "organizer";
    const list = groupBy(rows, e => e[key]).sort(byNet);
    body = list.length
      ? <>
          <GroupTable list={list} label={view==="venue" ? "会場" : "主催者"} />
          <div className="foot">
            <div><span>{view==="venue" ? "会場" : "主催者"}</span>
              <b className="num">{list.length}件</b></div>
            <div><span>出店</span>
              <b className="num">{list.reduce((s,v)=>s+v.n,0)}回</b></div>
            <div><span>損益</span>
              <b className={"num "+(net<0?"minus":"plus")}>{yen(net)}</b></div>
          </div>
          <div className="hint">損益の大きい順。カード手数料を引いた金額です。</div>
        </>
      : <div className="empty">
          主催者がまだ入っていません。記録を長押しして主催者を書き入れると、ここに出ます。
        </div>;
  }

  if (view === "month") {
    const list = groupBy(rows, e => e.date.slice(0,7))
      .sort((a,b) => b.key.localeCompare(a.key));
    body = <>
      <GroupTable list={list} label="月" bar />
      <div className="foot">
        <div><span>月数</span><b className="num">{list.length}か月</b></div>
        <div><span>1か月平均</span>
          <b className={"num "+(net<0?"minus":"plus")}>{yen(net/(list.length||1))}</b></div>
        <div><span>損益</span>
          <b className={"num "+(net<0?"minus":"plus")}>{yen(net)}</b></div>
      </div>
      <div className="hint">新しい月が上。棒の長さは損益の大きさ（朱色は赤字）。</div>
    </>;
  }

  if (view === "method") {
    const list = METHODS.map(m => {
      const g = sum(m.key);
      const f = rows.reduce((s,e) => s + deduct(e[m.key]||0, m), 0);
      return { ...m, g, f };
    });
    const fTot = list.reduce((s,x) => s + x.f, 0);
    body = <>
      <table className="ledger">
        <thead><tr>
          <th className="l">手段</th><th>売上</th><th>構成比</th>
          <th className="hide-sm">手数料</th><th>受取額</th>
        </tr></thead>
        <tbody>
          {list.map(m => (
            <tr key={m.key}>
              <td className="l"><span className="venue">{m.label}</span>
                {m.rate>0 && <span className="memo">
                  {(m.rate*100).toFixed(2)}%{m.taxRate>0 && ` ＋税${m.taxRate*100}%`}</span>}</td>
              <td className="num">{yen(m.g)}</td>
              <td className="num zero">{share(m.g)}</td>
              <td className="num hide-sm zero">{m.f ? "−"+yen(m.f) : "—"}</td>
              <td className="num">{yen(m.g - m.f)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="foot">
        <div><span>売上</span><b className="num">{yen(gross)}</b></div>
        <div><span>手数料</span><b className="num minus">{yen(fTot)}</b></div>
        <div><span>受取額</span><b className="num">{yen(gross - fTot)}</b></div>
      </div>
      <div className="hint">手数料は率からの概算です。確定額は入金タブの記録が正です。</div>
    </>;
  }

  if (view === "cost") {
    const fees = rows.reduce((s,e) => s + profitOf(e).fees, 0);
    const list = [
      { label:"出店費",       v:sum("fee")      },
      { label:"交通費",       v:sum("transit")  },
      { label:"材料費",       v:sum("material") },
      { label:"カード手数料", v:fees            },
    ].sort((a,b) => b.v - a.v);
    const costTot = list.reduce((s,x) => s + x.v, 0);
    body = <>
      <table className="ledger">
        <thead><tr>
          <th className="l">項目</th><th>金額</th><th>売上比</th>
        </tr></thead>
        <tbody>
          {list.map(x => (
            <tr key={x.label}>
              <td className="l"><span className="venue">{x.label}</span></td>

          <tr>

            <td className={"num "+(net<0?"minus":"plus")}>{yen(net)}</td>

        </tbody>
      </table>
      <div className="foot">
        <div><span>売上</span><b className="num">{yen(gross)}</b></div>
        <div><span>経費計</span><b className="num minus">{yen(costTot)}</b></div>
        <div><span>損益</span>
          <b className={"num "+(net<0?"minus":"plus")}>{yen(net)}</b></div>
      </div>

  return (
    <>
      <div className="chips filt">
        {VIEWS.map(v => (

            onClick={() => setView(v.key)}>{v.label}</button>
        ))}
      </div>
      <div className="chips filt sub">
        <button type="button" className="chip" data-on={year==="all"?1:0}
          onClick={() => setYear("all")}>全期間</button>
        {years.map(y => (
          <button type="button" key={y} className="chip" data-on={year===y?1:0}
            onClick={() => setYear(y)}>{y}年</button>
        ))}
      </div>
      {rows.length ? body : <div className="empty">この年の記録がありません。</div>}
    </>
  );
}

/* ======================== ラベル作成 ======================== */
const LABEL_ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const DEFAULT_LABEL_SETTINGS = {
  labelLayout:{
    columns:3, rows:8, labelWidthMm:70, labelHeightMm:33.9,
    marginLeftMm:0, marginTopMm:12.9
  },
  printOffsetX:0,
  printOffsetY:0
};

function newLabelToken(){
  const bytes = new Uint8Array(12);
  crypto.getRandomValues(bytes);
  let body = "";
  for (let i=0; i<12; i++) body += LABEL_ALPHABET[bytes[i] & 31];
  return "MS1-" + body;
}

function qrSvg(value){
  const qr = qrcode(0, "M");
  qr.addData(value);
  qr.make();
  return qr.createSvgTag(4, 0);
}

function numberValue(value, fallback){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function shortDate(timestamp){
  if (!Number.isFinite(timestamp)) return "日付不明";
  const d = new Date(timestamp);
  return `${d.getMonth()+1}/${d.getDate()}作成`;
}

function labelPositionCss(layout, offsetX, offsetY){
  const rulesScreen = [];
  const rulesPrint = [];
  const total = layout.columns * layout.rows;
  for (let i=0; i<total; i++) {
    const col = i % layout.columns;
    const row = Math.floor(i / layout.columns);
    const x = layout.marginLeftMm + col * layout.labelWidthMm + offsetX;
    const y = layout.marginTopMm + row * layout.labelHeightMm + offsetY;
    rulesScreen.push(
      `.label-pos-${i}{left:${x/210*100}%;top:${y/297*100}%;` +
      `width:${layout.labelWidthMm/210*100}%;height:${layout.labelHeightMm/297*100}%}`
    );
    rulesPrint.push(
      `.label-pos-${i}{left:${x}mm;top:${y}mm;` +
      `width:${layout.labelWidthMm}mm;height:${layout.labelHeightMm}mm}`
    );
  }
  return `@media screen{${rulesScreen.join("")}}@media print{${rulesPrint.join("")}}`;
}

function LabelMaker({ onClose }){
  const [count, setCount] = useState(24);
  const [labels, setLabels] = useState([]);
  const [layout, setLayout] = useState(DEFAULT_LABEL_SETTINGS.labelLayout);
  const [offsetX, setOffsetX] = useState(0);
  const [offsetY, setOffsetY] = useState(0);
  const [activeSheetNos, setActiveSheetNos] = useState([]);
  const [testMode, setTestMode] = useState(false);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState(null);
  const [settingsMessage, setSettingsMessage] = useState(null);
  const [labelsLoaded, setLabelsLoaded] = useState(false);
  const [settingsLoaded, setSettingsLoaded] = useState(false);
  const [showAllSheets, setShowAllSheets] = useState(false);

  useEffect(() => {
    if (!live) return;
    const labelsCb = labelsRef.on("value", snap => {
      const val = snap.val() || {};
      setLabels(Object.keys(val).map(token => ({ token, ...val[token] })));
      setLabelsLoaded(true);
    }, () => setMessage({ error:true, text:"ラベルの一覧を読めませんでした。通信を確認して、画面を開き直してください。" }));
    const settingsCb = settingsRef.on("value", snap => {
      const val = snap.val() || {};
      setLayout({ ...DEFAULT_LABEL_SETTINGS.labelLayout, ...(val.labelLayout||{}) });
      setOffsetX(numberValue(val.printOffsetX, 0));
      setOffsetY(numberValue(val.printOffsetY, 0));
      setSettingsLoaded(true);
    }, () => setMessage({ error:true, text:"印刷位置の設定を読めませんでした。通信を確認して、画面を開き直してください。" }));
    return () => {
      labelsRef.off("value", labelsCb);
      settingsRef.off("value", settingsCb);
    };
  }, []);

  const sheets = useMemo(() => {
    const grouped = {};
    labels.forEach(label => {
      const n = Number(label.sheetNo);
      if (!Number.isFinite(n)) return;
      grouped[n] = grouped[n] || [];
      grouped[n].push(label);
    });
    return Object.keys(grouped).map(Number).sort((a,b) => b-a)
      .map(sheetNo => ({
        sheetNo,
        labels:grouped[sheetNo],
        createdAt:Math.min(...grouped[sheetNo].map(label => Number(label.createdAt)||Infinity))
      }));
  }, [labels]);

  const visibleSheets = showAllSheets ? sheets : sheets.slice(0, 6);

  const pages = activeSheetNos.map(sheetNo => ({
    sheetNo,
    labels: labels.filter(label => Number(label.sheetNo) === sheetNo)
  }));

  const setLayoutNumber = (key, value) => {
    const integerKeys = new Set(["columns", "rows"]);
    const next = integerKeys.has(key)
      ? Math.max(1, Math.round(numberValue(value, layout[key])))
      : numberValue(value, layout[key]);
    setLayout(prev => ({ ...prev, [key]:next }));
  };

  const saveSettings = async () => {
    if (layout.columns * layout.rows !== 24) {
      setSettingsMessage({ error:true, text:"列数×行数が24になるようにしてください。" });
      return;
    }
    if (Math.min(layout.labelWidthMm, layout.labelHeightMm) < 22) {
      setSettingsMessage({ error:true, text:"QRを20mm以上にするため、ラベルの幅と高さは22mm以上にしてください。" });
      return;
    }
    setBusy(true);
    setSettingsMessage(null);
    try {
      await settingsRef.update({ labelLayout:layout, printOffsetX:offsetX, printOffsetY:offsetY });
      setSettingsMessage({ error:false, text:"印刷位置を保存しました。次の印刷にも使われます。" });
    } catch (_) {
      setSettingsMessage({ error:true, text:"印刷位置を保存できませんでした。通信を確認して、もう一度押してください。" });
    } finally { setBusy(false); }
  };

  const createLabels = async () => {
    if (!live || busy || !labelsLoaded || !settingsLoaded) return;
    setBusy(true);
    setMessage(null);
    try {
      const existing = new Set(labels.map(label => label.token));
      const highest = sheets.reduce((max, sheet) => Math.max(max, sheet.sheetNo), 0);
      const sheetCount = count / 24;
      const updates = {};
      const madeSheets = [];
      for (let page=0; page<sheetCount; page++) {
        const sheetNo = highest + page + 1;
        madeSheets.push(sheetNo);
        for (let i=0; i<24; i++) {
          let token;
          do { token = newLabelToken(); } while (existing.has(token));
          existing.add(token);
          updates[token] = {
            status:"unused",
            sheetNo,
            createdAt:firebase.database.ServerValue.TIMESTAMP
          };
        }
      }
      /* 印刷より先に登録する。登録が完了するまで印刷用ページは出さない。 */
      await labelsRef.update(updates);
      setActiveSheetNos(madeSheets);
      setTestMode(false);
      setMessage({ error:false, text:`${count}枚を登録しました。内容を確認してから印刷してください。` });
    } catch (_) {
      setMessage({ error:true, text:"ラベルを登録できなかったため、印刷画面は作りませんでした。通信を確認して、もう一度押してください。" });
    } finally { setBusy(false); }
  };

  const printWithMode = isTest => {
    if (!pages.length) {
      setMessage({ error:true, text:"先に印刷するシートを選んでください。" });
      return;
    }
    setTestMode(isTest);
    requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
  };

  const css = labelPositionCss(layout, offsetX, offsetY);

  return (
    <>
      <style>{css}</style>
      <div className="label-head">
        <h2>ラベルを作る</h2>
        <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
      </div>

      <section className="label-panel">
        <h3>1. 枚数を選ぶ</h3>
        <p>新しいラベルは、先に登録してから印刷できるようになります。</p>
        <div className="choice-row">
          {[24,48,96,240].map(n => <button type="button" key={n} className="chip"
            data-on={count===n?1:0} onClick={() => setCount(n)}>{n}枚</button>)}
        </div>
        <div className="label-actions">
          <button type="button" className="primary" disabled={busy || !labelsLoaded || !settingsLoaded} onClick={createLabels}>
            {busy ? "登録しています…" : (!labelsLoaded || !settingsLoaded) ? "読み込んでいます…" : "作る"}
          </button>
        </div>
        {message && <div className={`label-message${message.error?" error":""}`}>{message.text}</div>}
      </section>

      <section className="label-panel">
        <h3>2. 作ったシートを選ぶ</h3>
        <p>紙詰まりなどで刷り直すときは、同じシートを選んでください。</p>
        {sheets.length ? <div className="sheet-list">
          {visibleSheets.map(sheet => <button type="button" key={sheet.sheetNo} className="chip"
            data-on={activeSheetNos.length===1 && activeSheetNos[0]===sheet.sheetNo?1:0}
            onClick={() => { setActiveSheetNos([sheet.sheetNo]); setTestMode(false); }}>
            シート{sheet.sheetNo}・{shortDate(sheet.createdAt)}（{sheet.labels.length}枚）
          </button>)}
          {sheets.length > 6 && <button type="button" className="chip more"
            onClick={() => setShowAllSheets(v => !v)}>
            {showAllSheets ? "閉じる" : `もっと見る（あと${sheets.length-6}件）`}
          </button>}
        </div> : <div className="empty">まだ作ったシートはありません。</div>}
      </section>

      <section className="label-panel">
        <h3>印刷位置の調整</h3>
        <div className="setting-grid">
          <div className="f"><label>横（＋で右へ）mm</label><input type="number" step="0.1"
            value={offsetX} onChange={e => setOffsetX(numberValue(e.target.value,0))} /></div>
          <div className="f"><label>縦（＋で下へ）mm</label><input type="number" step="0.1"
            value={offsetY} onChange={e => setOffsetY(numberValue(e.target.value,0))} /></div>
          <div className="f"><label>列数</label><input type="number" min="1" step="1"
            value={layout.columns} onChange={e => setLayoutNumber("columns",e.target.value)} /></div>
          <div className="f"><label>行数</label><input type="number" min="1" step="1"
            value={layout.rows} onChange={e => setLayoutNumber("rows",e.target.value)} /></div>
          <div className="f"><label>ラベルの幅 mm</label><input type="number" min="22" step="0.1"
            value={layout.labelWidthMm} onChange={e => setLayoutNumber("labelWidthMm",e.target.value)} /></div>
          <div className="f"><label>ラベルの高さ mm</label><input type="number" min="22" step="0.1"
            value={layout.labelHeightMm} onChange={e => setLayoutNumber("labelHeightMm",e.target.value)} /></div>
          <div className="f"><label>左の余白 mm</label><input type="number" step="0.1"
            value={layout.marginLeftMm} onChange={e => setLayoutNumber("marginLeftMm",e.target.value)} /></div>
          <div className="f"><label>上の余白 mm</label><input type="number" step="0.1"
            value={layout.marginTopMm} onChange={e => setLayoutNumber("marginTopMm",e.target.value)} /></div>
        </div>
        <div className="label-actions">
          <button type="button" className="ghost" disabled={busy} onClick={saveSettings}>位置を保存する</button>
          <button type="button" className="ghost" onClick={() => printWithMode(true)}>テスト印刷</button>
        </div>
        {settingsMessage && <div className={`label-message${settingsMessage.error?" error":""}`}>{settingsMessage.text}</div>}
      </section>

      <section className="label-panel">
        <div className="print-guide">
          <h3>印刷するときは、こう設定してください</h3>
          <ul><li>用紙サイズ　A4</li><li>倍率　100%</li><li>余白　なし</li><li>両面印刷　しない</li></ul>
        </div>
        <div className="label-actions">
          <button type="button" className="primary" onClick={() => printWithMode(false)}>印刷</button>
        </div>
        <p className="screen-only-note">「用紙に合わせる」は選ばないでください。</p>
      </section>

      {pages.length > 0 && <div className="print-preview-viewport">
        <div className={`print-pages${testMode?" test":""}`}>
          {pages.map(page => <div className="label-page" key={page.sheetNo}>
            {page.labels.slice(0, layout.columns*layout.rows).map((label,index) =>
              <div className={`label-cell label-pos-${index}`} key={label.token}>
                <div className="label-qr" dangerouslySetInnerHTML={{ __html:qrSvg(label.token) }} />
                <div className="test-mark" />
              </div>)}
          </div>)}
        </div>
      </div>}
    </>
  );
}

const ITEM_TOKEN_RE = /^MS1-[2-9A-HJ-NP-Z]{12}$/;
const INITIAL_ITEM_ALPHAS = ["S", "M", "L"];
const LATIN_ITEM_ALPHAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

function rankedItemValues(items, key){
  const stat = {};
  items.forEach(item => {
    const raw = item[key];
    const value = raw === null || raw === undefined ? "" : String(raw).trim();
    if (!value) return;
    const s = stat[value] = stat[value] || { value, count:0, last:0 };
    s.count++;
    s.last = Math.max(s.last, Number(item.createdAt)||0);
  });
  return Object.values(stat).sort((a,b) => b.count-a.count || b.last-a.last)
    .map(s => s.value);
}

function photoToSmallDataUrl(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 200 / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      let quality = 0.82;
      let dataUrl = canvas.toDataURL("image/jpeg", quality);
      const bytesOf = value => Math.ceil((value.length - value.indexOf(",") - 1) * 0.75);
      while (bytesOf(dataUrl) > 20000 && quality > 0.42) {
        quality -= 0.08;
        dataUrl = canvas.toDataURL("image/jpeg", quality);
      }
      resolve(dataUrl);
    };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    image.src = url;
  });
}

function DigitPad({ value, onChange, maxValue, maxDigits }){
  const add = digit => {
    if (digit === "0" && !value) return;
    const next = (value + digit).slice(0, maxDigits);
    if (Number(next) <= maxValue) onChange(next);
  };
  return <div className="keypad">
    {["1","2","3","4","5","6","7","8","9"].map(d =>
      <button type="button" key={d} onClick={() => add(d)}>{d}</button>)}
    <button type="button" onClick={() => onChange("")}>消す</button>
    <button type="button" onClick={() => add("0")}>0</button>
    <button type="button" onClick={() => onChange(value.slice(0,-1))}>一字戻す</button>
  </div>;
}

/* 商品登録と販売で同じ読み取り経路を使う。AndroidはBarcodeDetectorを優先し、
   存在しない環境だけcanvas経由でjsQRへ渡す。 */
function QrScanner({ onRead, message, error }){
  const [cameraSupported, setCameraSupported] = useState(true);
  const [cameraMessage, setCameraMessage] = useState("");
  const [cameraError, setCameraError] = useState(false);
  const [scanNonce, setScanNonce] = useState(0);
  const videoRef = useRef(null);
  const scanCanvasRef = useRef(null);
  const lastSeenRef = useRef("");
  const onReadRef = useRef(onRead);
  onReadRef.current = onRead;

  useEffect(() => {
    let stopped = false;
    let stream = null;
    let frameId = null;
    let detecting = false;
    let lastJsQrAt = 0;
    lastSeenRef.current = "";
    setCameraError(false);
    setCameraMessage("");

    const start = async () => {
      const useBarcodeDetector = "BarcodeDetector" in window;
      if (!navigator.mediaDevices?.getUserMedia || (!useBarcodeDetector && typeof window.jsQR !== "function")) {
        setCameraSupported(false);
        setCameraError(true);
        setCameraMessage("このブラウザではQRを読めません。ブラウザを最新版にして開いてください。");
        return;
      }
      try {
        const detector = useBarcodeDetector ? new BarcodeDetector({ formats:["qr_code"] }) : null;
        stream = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ ideal:"environment" } }, audio:false
        });
        if (stopped) { stream.getTracks().forEach(track => track.stop()); return; }
        const video = videoRef.current;
        video.srcObject = stream;
        await video.play();
        setCameraSupported(true);
        const detect = async frameTime => {
          if (stopped) return;
          if (!detecting && video.readyState >= 2) {
            detecting = true;
            try {
              let value = "";
              if (detector) {
                const codes = await detector.detect(video);
                value = codes[0]?.rawValue || "";
              } else if (!lastJsQrAt || frameTime - lastJsQrAt >= 120) {
                lastJsQrAt = frameTime;
                const canvas = scanCanvasRef.current;
                const sourceWidth = video.videoWidth;
                const sourceHeight = video.videoHeight;
                if (canvas && sourceWidth && sourceHeight) {
                  const scale = Math.min(1, 960/sourceWidth, 960/sourceHeight);
                  canvas.width = Math.max(1, Math.round(sourceWidth * scale));
                  canvas.height = Math.max(1, Math.round(sourceHeight * scale));
                  const context = canvas.getContext("2d", { willReadFrequently:true });
                  if (context) {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const image = context.getImageData(0, 0, canvas.width, canvas.height);
                    value = window.jsQR(image.data, image.width, image.height)?.data || "";
                  }
                }
              }
              if (value && value !== lastSeenRef.current) {
                lastSeenRef.current = value;
                await onReadRef.current(value);
              }
            } catch (_) {}
            detecting = false;
          }
          frameId = requestAnimationFrame(detect);
        };
        frameId = requestAnimationFrame(detect);
      } catch (err) {
        setCameraError(true);
        setCameraMessage(err && err.name === "NotAllowedError"
          ? "カメラを使えません。アドレス欄のカメラ設定を「許可」にして、もう一度押してください。"
          : "カメラを開けませんでした。ブラウザを開き直して、もう一度お試しください。");
      }
    };
    start();
    return () => {
      stopped = true;
      if (frameId) cancelAnimationFrame(frameId);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (videoRef.current) videoRef.current.srcObject = null;
    };
  }, [scanNonce]);

  const shownMessage = cameraMessage || message;
  const shownError = cameraError || error;
  return <>
    {cameraSupported && <div className="camera-box">
      <video ref={videoRef} playsInline muted />
      <canvas ref={scanCanvasRef} hidden aria-hidden="true" />
      <div className="camera-guide" />
    </div>}
    <div className={`scan-message${shownError?" error":""}`}>{shownMessage}</div>
    {cameraError && <div className="register-actions">
      <button type="button" className="ghost" onClick={() => setScanNonce(n => n+1)}>カメラをもう一度開く</button>
    </div>}
  </>;
}
