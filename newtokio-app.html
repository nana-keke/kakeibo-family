<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ニュートキオ 実戦記録</title>

<!--
  =========================================================================
  ニュートキオ 実戦記録アプリ
  -------------------------------------------------------------------------
  単一HTMLファイル構成。GitHub Pages 等でそのまま配信できます。
  データは Firebase Realtime Database (newTokioApp/v1/users/{uid}/... )
  に保存され、他の姉妹アプリ（家計簿・おだてブタ等）のデータとは完全に分離されています。

  実装メモ（仕様書には無いが、実装上判断した点）:
   - 認証は匿名認証(signInAnonymously)を使用します。ブラウザ/端末ごとに
     別ユーザーになるため、同じ端末で使い続ける前提です。
   - Firebase と localStorage が競合した場合は、セッション単位では
     updatedAt が新しい方を採用し、イベント(events)は eventId 単位で
     マージしたうえで、同一IDが両方に存在する場合は updatedAt が新しい
     方を採用します（データを失わないことを優先）。
   - 「羽根開放回数スナップショット」は実戦開始時のデータカウンター値
     (counterBaseline) を基準値とし、最新スナップショットとの差を
     実戦中の羽根開放回数とします。基準値は開始画面・設定から入力可能。
   - タワー滞在計測（大当たり後、中央のタワーで玉が左右に揺れて滞在する
     時間）は手動ストップウォッチで計測します。計測中の状態(state.towerTimer)
     はlocalStorageに永続化し、リロードしても計測が失われないようにして
     います（Firebaseには同期しない、単一端末内の一時状態）。
   - ノーマルルートの当たり方パターン（土手越え／ポールダンス／ターン
     テーブル／ストレートイン／それ以外）は、単一eventType(NORMAL_WIN)に
     detailタグを付与する方式。新しいパターンが判明したら
     NORMAL_WIN_PATTERNS に1件追加するだけで、既存データを壊さず拡張できます。
  =========================================================================
-->

<style>
:root{
  --bg:#0b0d10;
  --bg-panel:#15181d;
  --bg-panel-2:#1c2027;
  --border:#2a2f38;
  --text:#eef0f2;
  --text-dim:#9aa3ad;
  --text-faint:#6b7480;
  --gold:#e0a942;
  --gold-dim:#8a6a2c;
  --plus-green:#4fbf7a;
  --minus-red:#e0625c;
  --accent-blue:#5b9bd5;
  --danger:#c9463c;
  --font-ui: -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-num: "SF Mono","Roboto Mono", "Yu Gothic", monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
body{padding-bottom:76px;}
button{font-family:inherit;}
h1,h2,h3,h4{margin:0;font-weight:700;}
.hidden{display:none !important;}
.screen{padding:12px 12px 24px;max-width:520px;margin:0 auto;}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b0d10 85%,transparent);
  padding:10px 14px 4px;display:flex;align-items:center;justify-content:space-between;
}
.topbar .title{font-size:15px;color:var(--text-dim);letter-spacing:.05em;}
.sync-badge{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-faint);display:flex;align-items:center;gap:5px;}
.sync-badge.unsynced{color:var(--gold);border-color:var(--gold-dim);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
.sync-badge.unsynced .sync-dot{background:var(--gold);}

/* ---------- floating action buttons (sticky, always reachable while scrolling) ---------- */
.fab-row{position:sticky;top:48px;z-index:40;display:flex;justify-content:flex-end;margin-bottom:8px;pointer-events:none;}
.fab-row .fab{pointer-events:auto;background:var(--bg-panel-2);border:1px solid var(--gold-dim);color:var(--gold);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.4);}

/* ---------- primary stat block ---------- */
.stat-hero{
  background:linear-gradient(160deg,#1c1409,#161a20 60%);
  border:1px solid var(--gold-dim);
  border-radius:16px;padding:16px 18px;margin-bottom:10px;
}
.stat-hero .label{font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:2px;}
.stat-hero .value{font-family:var(--font-num);font-size:44px;font-weight:700;color:#fff;line-height:1.05;}
.stat-hero .value small{font-size:18px;color:var(--gold);margin-left:4px;}
.stat-hero .sub{font-size:12px;color:var(--text-dim);margin-top:4px;font-family:var(--font-num);}
.stat-hero-row{display:flex;gap:14px;}
.stat-hero-cell{flex:1;min-width:0;}
.stat-hero-cell .value{font-size:30px;}
.stat-hero-cell .value small{font-size:14px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.stat-card .label{font-size:11px;color:var(--text-dim);margin-bottom:3px;}
.stat-card .value{font-family:var(--font-num);font-size:19px;font-weight:700;}
.stat-card .value.pos::before{content:"＋";color:var(--plus-green);}
.stat-card .value.neg::before{content:"－";color:var(--minus-red);}
.stat-card .sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;font-family:var(--font-num);}
.stat-card.wide{grid-column:1 / -1;}

/* ---------- buttons ---------- */
.cat-block{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
.cat-block.dense{padding:9px 10px;margin-bottom:6px;}
.cat-block.dense .btn-row{gap:6px;}
.cat-title{font-size:12px;color:var(--text-dim);margin-bottom:8px;letter-spacing:.05em;}
.cat-block.dense .cat-title{margin-bottom:5px;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-row.cols3{grid-template-columns:1fr 1fr 1fr;}
.btn-row.cols5{grid-template-columns:repeat(5,1fr);}
.act-btn{
  position:relative;
  min-height:56px;border-radius:12px;border:1px solid var(--border);background:var(--bg-panel-2);
  color:var(--text);font-size:14.5px;font-weight:600;padding:10px 6px 8px;line-height:1.25;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;
  transition:transform .06s ease, background .15s ease;
  user-select:none;
}
.act-btn:active{transform:scale(.95);}
.act-btn.fired{transform:scale(.94);}
.act-btn.big{grid-column:1/-1;min-height:68px;font-size:16px;}
.act-btn.hifreq{min-height:80px;font-size:18px;border-width:2px;}
.act-btn.hifreq .btn-count{font-size:20px;}
.act-btn:disabled{opacity:.4;}
.btn-row.cols5 .act-btn{font-size:12.5px;min-height:54px;padding:9px 2px 6px;}
.act-btn .btn-count{
  font-family:var(--font-num);font-size:15px;font-weight:800;line-height:1;
}
.act-btn.big .btn-count{font-size:19px;}
.act-btn .btn-label{font-size:inherit;}
.btn-row.cols5 .act-btn .btn-count{font-size:13px;}
.act-btn .btn-rate{font-size:10.5px;color:var(--text-dim);line-height:1.1;}
.btn-row.cols5 .act-btn .btn-rate{font-size:9px;}

/* ---------- full-screen flash feedback ---------- */
#flashOverlay{
  position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;background:transparent;
}

.subtract-toggle{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);color:var(--text-dim);font-size:12.5px;margin-bottom:10px;background:var(--bg-panel);user-select:none;}
.subtract-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.subtract-toggle.active{border-color:var(--danger);color:var(--danger);background:#2a1512;}
.subtract-toggle.active .dot{background:var(--danger);}
.util-row{display:flex;gap:8px;margin-top:4px;}
.util-btn{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;}
.util-btn:active{background:var(--bg-panel-2);}
.demo-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;}
.demo-tools span{font-size:10.5px;color:#fff;text-decoration:underline;user-select:none;}
.demo-badge{font-size:10px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.util-btn.end{color:var(--minus-red);border-color:#5a2b28;}
.util-btn.primary{color:var(--gold);border-color:var(--gold-dim);}

/* ---------- feedback toast ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);
  background:#20242cee;border:1px solid var(--gold-dim);color:var(--gold);
  padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;z-index:50;font-weight:600;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;height:64px;background:#0e1114;
  border-top:1px solid var(--border);display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{
  flex:1;background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;
}
.tab-btn.active{color:var(--gold);}
.tab-btn .ic{font-size:19px;}

/* ---------- forms ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%;max-width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-panel-2);color:var(--text);font-size:15px;font-family:inherit;
}
.field input[type="date"], .field input[type="datetime-local"]{
  font-size:13px;padding:10px 6px;
}
.field textarea{resize:vertical;min-height:56px;}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;min-width:0;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{padding:5px 11px;border-radius:14px;background:var(--bg-panel-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);}
.chip:active{background:#262b33;}
.chip.selected{background:var(--gold);color:#1a1200;border-color:var(--gold);}
.chip-select-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip-select-row .chip{padding:9px 16px;font-size:14px;font-family:var(--font-num);font-weight:700;}

.lr-select-row{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0 6px;}
.lr-btn{
  padding:9px 1px;border-radius:9px;border:1px solid var(--border);background:var(--bg-panel-2);
  color:var(--text-dim);font-size:11px;font-family:var(--font-num);font-weight:700;text-align:center;line-height:1.3;
}
.lr-btn:active{background:#262b33;}
.lr-btn.zero{border-color:var(--gold-dim);color:var(--gold);}
.lr-btn.selected{background:var(--gold);color:#1a1200;border-color:var(--gold);}

.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h3{font-size:14px;color:var(--gold);margin-bottom:10px;}
.row-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.row-line:last-child{border-bottom:none;}
.row-line .k{color:var(--text-dim);}
.row-line .v{font-family:var(--font-num);font-weight:600;}
.row-line.formula-row{cursor:pointer;}
.row-line.formula-row:active{background:var(--bg-panel-2);}
.row-line.formula-row .k{text-decoration:underline dotted;text-underline-offset:3px;}
.formula-modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;}
.formula-modal{background:var(--bg-panel);border:1px solid var(--gold-dim);border-radius:14px;padding:18px;max-width:420px;width:100%;}
.formula-modal-title{font-size:12px;color:var(--gold);letter-spacing:.05em;margin-bottom:8px;}
.formula-modal-text{font-size:14px;line-height:1.6;margin-bottom:16px;white-space:pre-wrap;}
.row-line .v.lr-arrow{font-weight:800;font-size:15px;}
.section-title{font-size:13px;color:var(--text-dim);margin:16px 0 8px;letter-spacing:.05em;text-transform:uppercase;}

.warn-box{position:relative;background:#2a1a12;border:1px solid #6b3a1f;color:#f0b27a;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;}
.warn-box.sara-warn{padding-right:36px;border-color:#a4552a;background:#331a10;}
.warn-close{position:absolute;top:4px;right:6px;background:transparent;border:none;color:#f0b27a;font-size:18px;line-height:1;padding:4px 8px;}
.warn-box.floating{
  position:fixed;top:46px;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:496px;z-index:50;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.info-note{font-size:11px;color:var(--text-faint);margin-top:2px;}

.primary-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--gold);color:#1a1200;font-weight:700;font-size:15px;}
.secondary-btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;margin-top:8px;}
.danger-btn{width:100%;padding:12px;border-radius:12px;border:1px solid #5a2b28;background:transparent;color:var(--minus-red);font-size:14px;margin-top:8px;}

/* ---------- history list ---------- */
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px;}
.hist-item.deleted{opacity:.35;text-decoration:line-through;}
.hist-item .t{color:var(--text-faint);font-family:var(--font-num);font-size:11.5px;min-width:58px;}
.hist-item .lbl{flex:1;padding:0 8px;}
.hist-item .amt{font-family:var(--font-num);color:var(--gold);}
.hist-actions{display:flex;gap:6px;}
.icon-btn{border:1px solid var(--border);background:var(--bg-panel-2);color:var(--text-dim);border-radius:8px;padding:4px 8px;font-size:11px;}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head button{background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--text-faint);padding:4px 0;}
.cal-cell{aspect-ratio:1;border-radius:10px;background:var(--bg-panel);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);position:relative;}
.cal-cell.empty{background:transparent;border:none;}
.cal-cell.has-data{border-color:var(--gold-dim);background:#1a1710;}
.cal-cell .d{font-size:11px;color:var(--text-faint);position:absolute;top:4px;left:6px;}
.cal-cell .metric{font-family:var(--font-num);font-weight:700;font-size:12.5px;color:var(--gold);margin-top:6px;}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}

/* ---------- analysis filters ---------- */
.filter-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;}
.filter-tabs button{white-space:nowrap;background:var(--bg-panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:20px;padding:7px 14px;font-size:12.5px;}
.filter-tabs button.active{color:#1a1200;background:var(--gold);border-color:var(--gold);}
.group-row{padding:10px 12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.group-row .gname{font-size:13.5px;font-weight:700;margin-bottom:4px;}
.group-row .gmetrics{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--text-dim);}
.group-row .gmetrics b{color:var(--text);font-family:var(--font-num);}
.sample-warn{color:#f0b27a;font-size:10.5px;margin-top:2px;}

/* toggle group for calendar display metric */
.seg{display:flex;overflow-x:auto;gap:6px;margin-bottom:10px;}
.seg button{white-space:nowrap;padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--bg-panel-2);color:var(--text-dim);font-size:12px;}
.seg button.active{background:var(--gold);color:#1a1200;border-color:var(--gold);}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div class="topbar">
  <div class="title" id="topbarTitle">ニュートキオ</div>
  <div class="sync-badge" id="syncBadge"><span class="sync-dot"></span><span id="syncText">同期済み</span></div>
</div>

<div id="app" class="screen"></div>

<div id="toast"></div>
<div id="flashOverlay"></div>

<div class="tabbar">
  <button class="tab-btn" data-tab="battle"><span class="ic">🎮</span>実戦</button>
  <button class="tab-btn" data-tab="summary"><span class="ic">📊</span>集計</button>
  <button class="tab-btn" data-tab="calendar"><span class="ic">📅</span>カレンダー</button>
  <button class="tab-btn" data-tab="analysis"><span class="ic">🔍</span>分析</button>
  <button class="tab-btn" data-tab="settings"><span class="ic">⚙️</span>設定</button>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
"use strict";
/* =========================================================================
   0. 設定
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyClcn7gdyPAnO3J9Ho8_yAc59vlwb7i5II",
  authDomain: "kakeibo-family-874a4.firebaseapp.com",
  databaseURL: "https://kakeibo-family-874a4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kakeibo-family-874a4",
  storageBucket: "kakeibo-family-874a4.firebasestorage.app",
  messagingSenderId: "1037397086146",
  appId: "1:1037397086146:web:bf832935bd57e8c260505b"
};
const APP_ROOT = "newTokioApp/v1"; // 他の姉妹アプリのデータと衝突しない専用ルート

const APP_SETTINGS = {
  ballsPerPlate: 125,
  yenPerBall: 3.57,
  closingTime: "22:50",
  payout3R: 250,
  payout5R: 460,
  payout10R: 1020,
};
const AVG_PAYOUT = (APP_SETTINGS.payout3R + APP_SETTINGS.payout5R + APP_SETTINGS.payout10R) / 3;

// 傾斜の区分設定（0.3度刻み）。ここを変更すれば分析区分を一括変更できる。
// 前後傾斜の区分は、分析タブでのタワー滞在時間の相関分析にそのまま使う。
const TILT_CONFIG = {
  binWidth: 0.3,
  frontBackOffset: 0.15,
  leftRightOffset: 0.15,
};

// ---------------------------------------------------------------------------
// 簡易アクセスキー（URL: ?key=2029 を付与した場合のみ利用可能にする）
// 注意: これはクライアント側のみの簡易的なアクセス制限（見知らぬ第三者による
// 偶発的なアクセスを防ぐ程度のもの）であり、真のセキュリティ対策ではありません。
// ソースコードを読める人には鍵の値は分かってしまいます。本格的な保護が必要な
// 場合は、Firebase側の認証・セキュリティルールを別途設定してください。
// ---------------------------------------------------------------------------
const ACCESS_KEY = "2029";
const ACCESS_LS_KEY = "newTokio_access_v1";

/* =========================================================================
   1. ユーティリティ
   ========================================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid_ = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const nowIso = () => new Date().toISOString();
const clone = (o) => JSON.parse(JSON.stringify(o));

function fmtInt(n){
  if(n===null||n===undefined||!isFinite(n)) return '－';
  return Math.round(n).toLocaleString('ja-JP');
}
function fmtYen(n){
  if(n===null||n===undefined||!isFinite(n)) return '－';
  const r = Math.round(n);
  return (r>=0?'＋':'－') + Math.abs(r).toLocaleString('ja-JP') + '円';
}
function fmtYenRate(n){
  if(n===null||n===undefined||!isFinite(n)) return '－';
  const r = Math.round(n);
  return (r>=0?'＋':'－') + Math.abs(r).toLocaleString('ja-JP') + '円／時';
}
function rowLine(label, valueHtml, formula){
  return `<div class="row-line formula-row" data-formula="${escapeHtml(formula)}"><span class="k">${label}</span><span class="v">${valueHtml}</span></div>`;
}
function fmtDec(n, digits){
  if(n===null||n===undefined||!isFinite(n)) return '－';
  return n.toFixed(digits);
}
function fmtDuration(minutes){
  if(minutes===null||minutes===undefined||!isFinite(minutes)||minutes<0) return '－';
  const m = Math.round(minutes);
  const h = Math.floor(m/60), mm = m%60;
  return `${h}時間${mm}分`;
}
// タワー滞在時間の表示（秒単位、小数1桁）
function fmtSec(ms){
  if(ms===null||ms===undefined||!isFinite(ms)) return '－';
  return (ms/1000).toFixed(1)+'秒';
}
// 計測中のストップウォッチ表示（分:秒）
function fmtStopwatch(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function pct(num, den, digits=1){
  if(!den || den<=0 || !isFinite(num)) return {text:'－', value:null, num, den};
  const v = num/den*100;
  return {text:`${v.toFixed(digits)}％（${fmtInt(num)}／${fmtInt(den)}）`, value:v, num, den};
}
function rate(num, den, digits, unit){
  if(!den || den<=0 || !isFinite(num)) return {text:'－', value:null, num, den};
  const v = num/den;
  return {text:`${v.toFixed(digits)}${unit}（${fmtInt(num)}／${fmtInt(den)}）`, value:v, num, den};
}
function safeDiv(num,den){ return (den&&den>0) ? num/den : null; }

function classifyFrontBack(v){
  if(v===null||v===undefined||!isFinite(v)) return null;
  const w = TILT_CONFIG.binWidth, off = TILT_CONFIG.frontBackOffset;
  const idx = Math.floor((v+off)/w);
  const center = idx*w;
  return { key:'FB_'+center.toFixed(2), label:`手前${center.toFixed(1)}度帯` };
}
function classifyLeftRight(v){
  if(v===null||v===undefined||!isFinite(v)) return null;
  const w = TILT_CONFIG.binWidth, off = TILT_CONFIG.leftRightOffset;
  const idx = Math.round((v)/w);
  const center = idx*w;
  let label;
  if(Math.abs(center) < 1e-9) label = '水平帯';
  else if(center>0) label = `右上がり${center.toFixed(1)}度帯`;
  else label = `左上がり${Math.abs(center).toFixed(1)}度帯`;
  return { key:'LR_'+center.toFixed(2), label };
}
function tiltLRDisplay(v){
  if(v===null||v===undefined||!isFinite(v)) return '－';
  if(Math.abs(v)<1e-9) return `0.00度（水平）`;
  return v>0 ? `+${v.toFixed(2)}度（右上がり）` : `${v.toFixed(2)}度（左上がり${Math.abs(v).toFixed(2)}度）`;
}
const LR_QUICK_VALUES = [-0.4,-0.3,-0.2,-0.1,0,0.1,0.2,0.3,0.4];
// 台番号（設置されている台が固定のため、手入力ではなく選択制）
const MACHINE_NUMBERS = ['1011','1012','1013','1015','1016','1017','1018'];
function lrQuickLabel(v){
  if(Math.abs(v)<1e-9) return '水平';
  return v>0 ? `⇘${v.toFixed(1)}` : `⇙${Math.abs(v).toFixed(1)}`;
}
function lrArrowLabel(v){
  if(v===null||v===undefined||!isFinite(v)) return '－';
  if(Math.abs(v)<1e-9) return '水平';
  return v>0 ? `⇘${v.toFixed(2)}` : `⇙${Math.abs(v).toFixed(2)}`;
}
function machineHammerAvg(machineNumber){
  const vals = Object.values(state.sessions)
    .filter(s=>s.machineNumber===machineNumber && s.hammerHabit!=null)
    .map(s=>s.hammerHabit);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function machineHammerHue(avg){
  return Math.round(((avg-1)/4)*120);
}
function minutesBetween(startIso, endIso){
  if(!startIso||!endIso) return null;
  const s = new Date(startIso).getTime(), e = new Date(endIso).getTime();
  if(!isFinite(s)||!isFinite(e)) return null;
  let diff = (e-s)/60000;
  if(diff<0) diff += 24*60;
  return diff;
}
function flashScreen(color, strong=false){
  const el = $('#flashOverlay');
  if(!el) return;
  el.style.transition = 'none';
  el.style.background = color;
  el.style.opacity = strong ? '0.62' : '0.42';
  void el.offsetWidth;
  el.style.transition = strong ? 'opacity .5s ease-out' : 'opacity .35s ease-out';
  el.style.opacity = '0';
}
function vibrate(pattern){
  if(navigator.vibrate) navigator.vibrate(pattern);
}
function warnBoxHtml(s){
  if(!s.warnings.length) return '';
  return `<div class="warn-box floating">${s.warnings.map(w=>'⚠ '+escapeHtml(w)).join('<br>')}</div>`;
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1400);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function timeStr(iso){
  if(!iso) return '--:--';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function dateTimeLocalValue(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function rateBadgeText(metric, fmt){
  if(!metric || metric.value===null || metric.value===undefined || !isFinite(metric.value)) return '－';
  if(fmt==='oneOverX') return metric.value>0 ? `1／${(1/metric.value).toFixed(1)}` : '－';
  return `${metric.value.toFixed(1)}%`;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const LS_KEYS = {

  settings: 'newTokio_settings_v1',
  uid: 'newTokio_uid_v1',
  towerTimer: 'newTokio_towerTimer_v1',
  migrated: 'newTokio_migratedShared_v1',
};
const state = {
  uid: null,
  sessions: {},
  activeSessionId: null,
  settings: { tiltPresets: [], debugPlatePace: 0.3, haneKaihouBulkAmount: 10,
    // 皿単価の低下警告。直近N皿の皿単価が、それ以前の平均よりdropPct%以上下がったら警告する。
    // サンプルが少ないうちはブレて誤警告になるため、minPlatesに達するまでは判定しない。
    saraWarnEnabled: true, saraWarnRecentPlates: 10, saraWarnDropPct: 25, saraWarnMinPlates: 20 },
  unsynced: new Set(),
  online: navigator.onLine,
  tab: 'battle',
  view: {
    battle: 'main',
    calendar: { mode:'calendar', month: new Date().toISOString().slice(0,7), day:null, sessionId:null, metric:'sara' },
    analysis: { dim:'machine', dateFrom:null, dateTo:null, mode:'group', metric:'sara' },
  },
  firebaseReady:false,
  subtractMode:false,
  bulkMode:false,    // ONの間、羽根開放回数ボタンのタップ量が1ではなくhaneKaihouBulkAmountになる（まとめて入力用）
  towerTimer:null,   // {sessionId, startedAt} | null。タワー滞在計測中の状態。localStorageに永続化（Firebase非同期）
};

function loadLocal(){
  try{ state.sessions = JSON.parse(localStorage.getItem(LS_KEYS.sessions)||'{}'); }catch(e){ state.sessions={}; }
  // 他端末から受け取った不完全な形のまま保存されている場合があるため、読み込み時にも形を整える
  Object.values(state.sessions).forEach(s=>normalizeSession(s));
  try{ state.settings = Object.assign(state.settings, JSON.parse(localStorage.getItem(LS_KEYS.settings)||'{}')); }catch(e){}
  try{ state.towerTimer = JSON.parse(localStorage.getItem(LS_KEYS.towerTimer)||'null'); }catch(e){ state.towerTimer=null; }
  const active = Object.values(state.sessions).find(s=>s.status==='active');
  state.activeSessionId = active ? active.sessionId : null;
  // 計測中タイマーが現在アクティブなセッションを指していない場合は破棄する
  if(state.towerTimer && state.towerTimer.sessionId !== state.activeSessionId){
    state.towerTimer = null;
    saveTowerTimer();
  }
}
function saveLocalSessions(){
  localStorage.setItem(LS_KEYS.sessions, JSON.stringify(state.sessions));
}
function saveLocalSettings(){
  localStorage.setItem(LS_KEYS.settings, JSON.stringify(state.settings));
}
function saveTowerTimer(){
  if(state.towerTimer) localStorage.setItem(LS_KEYS.towerTimer, JSON.stringify(state.towerTimer));
  else localStorage.removeItem(LS_KEYS.towerTimer);
}
function getActiveSession(){ return state.activeSessionId ? state.sessions[state.activeSessionId] : null; }

/* =========================================================================
   4. Firebase 同期
   ========================================================================= */
// 複数端末（自分のスマホ2台等）で同じデータを共有するための固定ID。
// 他人との共有は想定していないため、認証UID単位ではなく固定値のパスにしている。
const SHARED_DEVICE_ID = 'primary';
let fbApp=null, fbAuth=null, fbDb=null;
let _sharedSyncSubscribed = false;
function initFirebase(){
  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.database();
    fbAuth.onAuthStateChanged(user=>{
      if(user){
        state.uid = user.uid;
        state.firebaseReady = true;
        localStorage.setItem(LS_KEYS.uid, user.uid);
        migrateLegacyDeviceDataThenSubscribe();
        flushPending();
      }
    });
    fbAuth.signInAnonymously().catch(err=>{
      console.warn('anon auth failed', err);
      updateSyncBadge();
    });
  }catch(e){
    console.warn('firebase init failed', e);
  }
}
function sessionsPath(){ return `${APP_ROOT}/users/${SHARED_DEVICE_ID}/sessions`; }
function settingsPath(){ return `${APP_ROOT}/users/${SHARED_DEVICE_ID}/settings`; }

// 入力中（実戦開始・実戦終了画面のテキスト/数値欄）に他端末からの更新でDOMが再生成され、
// 入力途中の内容が消えてしまうのを避けるためのガード付き再描画。他端末発の更新はこちらを使う。
function safeRenderFromRemote(){
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return; // 次の操作で自然に最新化される
  render();
}

// セッションのマージ本体（既存: セッション単位はupdatedAtのLWW、イベント・スナップショットは
// ID単位のunion+LWW）。初回移行時の1回限りのマージと、常時購読の両方から呼ぶ。
// 戻り値: マージの結果、ローカルの状態が実質的に変化したかどうか
// Firebaseは null・空オブジェクト・空配列のキーを保存しないため、他端末から受け取った
// セッションでは events / tilt / openingCounterSnapshots が「存在しない」ことがある。
// 描画のたびに個別ガードするのは漏れやすいので、取り込み時点で形を揃えておく。
// （これを怠ると描画関数が例外を投げ、画面が真っ黒でタブも反応しない状態になる）
function normalizeSession(s){
  if(!s || typeof s!=='object') return s;
  if(!s.events || typeof s.events!=='object') s.events = {};
  if(!s.tilt || typeof s.tilt!=='object') s.tilt = { frontBack:null, leftRight:null, note:'' };
  if(!Array.isArray(s.openingCounterSnapshots)) s.openingCounterSnapshots = [];
  return s;
}

function mergeRemoteSessions(remote){
  let changed = false;
  Object.keys(remote).forEach(sid=>{
    const r = normalizeSession(remote[sid]), l = state.sessions[sid];
    if(!l){ state.sessions[sid] = r; changed = true; return; }
    const merged = (new Date(r.updatedAt||0) > new Date(l.updatedAt||0)) ? clone(r) : clone(l);
    const evs = {};
    Object.assign(evs, (l.events||{}));
    Object.keys(r.events||{}).forEach(eid=>{
      const re=r.events[eid], le=l.events[eid];
      if(!le || new Date(re.updatedAt||0) >= new Date(le.updatedAt||0)) evs[eid]=re;
    });
    merged.events = evs;
    const snapMap = {};
    (l.openingCounterSnapshots||[]).forEach(s=>snapMap[s.id]=s);
    (r.openingCounterSnapshots||[]).forEach(s=>{
      const ex = snapMap[s.id];
      if(!ex || new Date(s.updatedAt||0) >= new Date(ex.updatedAt||0)) snapMap[s.id]=s;
    });
    merged.openingCounterSnapshots = Object.values(snapMap).sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt));
    normalizeSession(merged);
    if(JSON.stringify(merged) !== JSON.stringify(l)) changed = true;
    state.sessions[sid]=merged;
  });
  const active = Object.values(state.sessions).find(s=>s.status==='active');
  state.activeSessionId = active ? active.sessionId : state.activeSessionId;
  saveLocalSessions();
  return changed;
}

// 共有パスをリアルタイム購読する（多重購読防止のガード付き）。以後、他端末での変更が
// 即座にこの端末にも反映される。
function subscribeToFirebase(){
  if(_sharedSyncSubscribed || !fbDb) return;
  _sharedSyncSubscribed = true;
  fbDb.ref(sessionsPath()).on('value', snap=>{
    const changed = mergeRemoteSessions(snap.val()||{});
    if(changed) safeRenderFromRemote();
  }, e=>console.warn('sessions subscribe failed', e));
  fbDb.ref(settingsPath()).on('value', snap=>{
    const rs = snap.val();
    if(rs){ state.settings = Object.assign(state.settings, rs); saveLocalSettings(); safeRenderFromRemote(); }
  }, e=>console.warn('settings subscribe failed', e));
}

// 端末ごとに一度だけ実行する移行処理。共有パスへの切り替え以前、この端末は自分専用の
// 認証UID配下にデータを持っていた可能性があるため、そのデータを読み出して共有パスへ
// マージ・書き戻す（既存データを失わないため）。移行済みなら購読だけ行う。
function migrateLegacyDeviceDataThenSubscribe(){
  if(!fbDb || !state.uid) return;
  if(localStorage.getItem(LS_KEYS.migrated)==='done'){ subscribeToFirebase(); return; }
  const legacyPath = `${APP_ROOT}/users/${state.uid}/sessions`;
  fbDb.ref(sessionsPath()).once('value').then(sharedSnap=>{
    mergeRemoteSessions(sharedSnap.val()||{});
    return fbDb.ref(legacyPath).once('value');
  }).then(legacySnap=>{
    const legacy = legacySnap.val() || {};
    if(Object.keys(legacy).length>0){
      mergeRemoteSessions(legacy);
      Object.values(state.sessions).forEach(s=>pushSession(s)); // 共有パスへ書き戻す
    }
    localStorage.setItem(LS_KEYS.migrated, 'done');
    render();
    subscribeToFirebase();
  }).catch(e=>{
    console.warn('legacy migration failed', e);
    localStorage.setItem(LS_KEYS.migrated, 'done');
    subscribeToFirebase();
  });
  fbDb.ref(settingsPath()).once('value').then(snap=>{
    const rs = snap.val();
    if(rs) { state.settings = Object.assign(state.settings, rs); saveLocalSettings(); render(); }
  }).catch(()=>{});
}

function pushSession(session){
  saveLocalSessions();
  if(!fbDb || !state.uid){ state.unsynced.add(session.sessionId); updateSyncBadge(); return; }
  fbDb.ref(`${sessionsPath()}/${session.sessionId}`).set(
    Object.assign(clone(session), {_serverTouchedAt: firebase.database.ServerValue.TIMESTAMP})
  ).then(()=>{
    state.unsynced.delete(session.sessionId);
    updateSyncBadge();
  }).catch(err=>{
    console.warn('push failed, will retry', err);
    state.unsynced.add(session.sessionId);
    updateSyncBadge();
  });
}
function pushSettings(){
  saveLocalSettings();
  if(!fbDb || !state.uid) return;
  fbDb.ref(settingsPath()).set(clone(state.settings)).catch(()=>{});
}
function flushPending(){
  if(!state.online || !fbDb || !state.uid) return;
  Array.from(state.unsynced).forEach(sid=>{
    const s = state.sessions[sid];
    if(s) pushSession(s);
  });
}
window.addEventListener('online', ()=>{ state.online=true; flushPending(); updateSyncBadge(); });
window.addEventListener('offline', ()=>{ state.online=false; updateSyncBadge(); });
setInterval(flushPending, 12000);

function updateSyncBadge(){
  const badge = $('#syncBadge'), text = $('#syncText');
  if(!badge) return;
  if(state.unsynced.size>0){
    badge.classList.add('unsynced');
    text.textContent = `未同期 ${state.unsynced.size}件`;
  } else {
    badge.classList.remove('unsynced');
    text.textContent = state.online ? '同期済み' : 'オフライン';
  }
}

/* =========================================================================
   5. セッション / イベント CRUD
   ========================================================================= */
function createSession({machineNumber, tiltFB, tiltLR, tiltNote, counterBaseline, startGameCount, memo}){
  const id = uid_();
  const now = nowIso();
  const session = {
    sessionId: id,
    date: todayStr(),
    machineNumber: machineNumber || '',
    startedAt: now,
    endedAt: null,
    status: 'active',
    tilt: { frontBack: tiltFB, leftRight: tiltLR, note: tiltNote||'' },
    counterBaseline: counterBaseline || 0,
    startGameCount: startGameCount || 0, // 開始ゲーム数。羽根開放回数＋1ボタンに「開始比」を表示するための基準値（表示専用、集計計算には使わない）
    openingCounterSnapshots: [],
    events: {},
    memo: memo || '',
    hammerHabit: null,
    isDemo: false,
    actualDiffBallsManual: null,
    createdAt: now,
    updatedAt: now,
  };
  state.sessions[id]=session;
  state.activeSessionId=id;
  pushSession(session);
  return session;
}
function addEvent(session, eventType, note='', detail=null, amount=1){
  const now = nowIso();
  const ev = { eventId: uid_(), sessionId: session.sessionId, eventType, amount,
    occurredAt: now, createdAt: now, updatedAt: now, deleted:false, note, detail };
  session.events[ev.eventId] = ev;
  session.updatedAt = now;
  pushSession(session);
  return ev;
}
// タワー滞在計測イベント。他のイベントと違い、amountは常に1件のカウントで、
// 実測した滞在時間はdurationMsという専用フィールドに記録する（一部イベント種別
// のみ使うフィールドを追加する、という既存のdetail運用と同じ考え方の拡張）。
function addTowerStayEvent(session, durationMs){
  const now = nowIso();
  const ev = { eventId: uid_(), sessionId: session.sessionId, eventType:'TOWER_STAY', amount:1,
    occurredAt: now, createdAt: now, updatedAt: now, deleted:false, note:'', detail:null, durationMs };
  session.events[ev.eventId] = ev;
  session.updatedAt = now;
  pushSession(session);
  return ev;
}
function editTowerStayDuration(session, eventId, newDurationMs){
  const e = session.events[eventId];
  if(!e) return;
  e.durationMs = newDurationMs;
  e.updatedAt = nowIso();
  session.updatedAt = e.updatedAt;
  pushSession(session);
}
function startTowerStay(session){
  state.towerTimer = { sessionId: session.sessionId, startedAt: nowIso() };
  saveTowerTimer();
}
function stopTowerStay(session){
  if(!state.towerTimer || state.towerTimer.sessionId!==session.sessionId) return null;
  const durationMs = Math.max(0, Date.now() - new Date(state.towerTimer.startedAt).getTime());
  state.towerTimer = null;
  saveTowerTimer();
  return addTowerStayEvent(session, durationMs);
}
// 他人への使用感デモ用：各カウンターにまとめてそれっぽい値を一括投入する（isDemoフラグも立てる）
function fillDemoData(session){
  const add = (type, n, detail)=>{ for(let i=0;i<n;i++) addEvent(session, type, '', detail!==undefined?detail:null); };
  add('PLATE', 15);
  add('YAKUMONO', 45);
  add('NORMAL_WIN', 1, 'dote_goe');
  add('NORMAL_WIN', 1, 'straight_in');
  add('SP_ENTRY', 1);
  add('SP_WIN', 1);
  add('ROUND3', 1);
  add('ROUND5', 1);
  add('ROUND10', 1);
  addTowerStayEvent(session, 2200);
  addTowerStayEvent(session, 3400);
  addTowerStayEvent(session, 4100);
  addEvent(session, 'HANE_KAIHOU', 'デモ用ダミー', null, 50);
  session.isDemo = true;
  const pace = state.settings.debugPlatePace || 0.3;
  const plateCount = sumEvents(session,'PLATE');
  if(plateCount>0){
    const minutes = plateCount/pace;
    session.startedAt = new Date(Date.now()-minutes*60000).toISOString();
  }
  session.updatedAt = nowIso();
  pushSession(session);
}
function undoLastEvent(session){
  const evs = Object.values(session.events||{}).filter(e=>!e.deleted)
    .sort((a,b)=> new Date(b.occurredAt)-new Date(a.occurredAt));
  if(evs.length===0){ toast('取り消せる操作がありません'); return; }
  const last = evs[0];
  last.deleted = true;
  last.updatedAt = nowIso();
  session.updatedAt = last.updatedAt;
  pushSession(session);
  toast(`「${eventLabel(last)}」を取り消しました`);
}
function deleteEvent(session, eventId){
  const e = session.events[eventId];
  if(!e) return;
  e.deleted = true;
  e.updatedAt = nowIso();
  session.updatedAt = e.updatedAt;
  pushSession(session);
}
function restoreEvent(session, eventId){
  const e = session.events[eventId];
  if(!e) return;
  e.deleted = false;
  e.updatedAt = nowIso();
  session.updatedAt = e.updatedAt;
  pushSession(session);
}
function editEventAmount(session, eventId, newAmount){
  const e = session.events[eventId];
  if(!e) return;
  e.amount = newAmount;
  e.updatedAt = nowIso();
  session.updatedAt = e.updatedAt;
  pushSession(session);
}
// 羽根開放回数の絶対値スナップショット機能は廃止（+1タップ方式に置き換え）。
// ただし過去に記録されたスナップショットが残っているセッションのために、
// 編集・削除の関数と履歴画面での表示は互換性のため残している。
function editCounterSnapshot(session, snapId, newValue){
  const snap = (session.openingCounterSnapshots||[]).find(s=>s.id===snapId);
  if(!snap) return;
  snap.editHistory = snap.editHistory || [];
  snap.editHistory.push({ prevValue: snap.value, changedAt: nowIso() });
  snap.prevValue = snap.value;
  snap.value = newValue;
  snap.updatedAt = nowIso();
  session.updatedAt = snap.updatedAt;
  pushSession(session);
}
function deleteCounterSnapshot(session, snapId){
  const snap = (session.openingCounterSnapshots||[]).find(s=>s.id===snapId);
  if(!snap) return;
  snap.deleted = true;
  snap.updatedAt = nowIso();
  session.updatedAt = snap.updatedAt;
  pushSession(session);
}
function editSessionTilt(session, patch){
  session.tilt = Object.assign({}, session.tilt, patch);
  session.updatedAt = nowIso();
  pushSession(session);
}
function endSession(session, endedAtIso){
  session.endedAt = endedAtIso || nowIso();
  session.status = 'ended';
  session.updatedAt = nowIso();
  pushSession(session);
  state.activeSessionId = null;
  // 計測中のタワー滞在タイマーがあれば、実戦終了に伴い破棄する（終了後は意味を持たないため）
  if(state.towerTimer && state.towerTimer.sessionId===session.sessionId){
    state.towerTimer = null;
    saveTowerTimer();
  }
}

/* =========================================================================
   6. 集計ロジック（イベントから再計算。率や割合はFirebaseに固定保存しない）
   ========================================================================= */
function sumEvents(session, type){
  let s=0;
  const evs = session.events||{};
  for(const id in evs){ const e=evs[id]; if(!e.deleted && e.eventType===type) s += e.amount; }
  return s;
}
function sumNormalWinPattern(session, detail){
  let s=0;
  const evs = session.events||{};
  for(const id in evs){
    const e = evs[id];
    if(!e.deleted && e.eventType==='NORMAL_WIN' && e.detail===detail) s += e.amount;
  }
  return s;
}
function eventLabel(e){
  if(e.eventType==='NORMAL_WIN'){
    const pat = NORMAL_WIN_PATTERNS.find(p=>p.detail===e.detail);
    return pat ? `${pat.label}＋1` : 'ノーマル当選＋1';
  }
  if(e.eventType==='TOWER_STAY'){
    return `タワー滞在計測：${fmtSec(e.durationMs)}`;
  }
  return EVENT_DEFS[e.eventType]?.label || e.eventType;
}
// 皿単価の低下検知。「直近N皿ぶんの皿単価」と「それ以前の皿単価」を比べ、
// 一定割合以上落ちていたら低下とみなす（＝やめどきの判断材料）。
// 集計値ではなくイベントの発生順から都度計算するので、余計な保存項目は増やさない。
// 判定できない場合（皿数が足りない等）は null を返す。
function computeSaraDrop(session){
  const st = state.settings;
  if(st.saraWarnEnabled === false) return null;
  const recentN   = st.saraWarnRecentPlates || 10;
  const minPlates = st.saraWarnMinPlates || 20;
  const dropPct   = (st.saraWarnDropPct===undefined || st.saraWarnDropPct===null) ? 25 : st.saraWarnDropPct;

  const evs = Object.values(session.events||{}).filter(e=>!e.deleted);
  const plates = evs.filter(e=>e.eventType==='PLATE').sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt));
  const totalPlates = plates.reduce((a,e)=>a+e.amount, 0);
  // 最低皿数に達していない、または「それ以前」と比較できるだけの皿数が無いうちは判定しない
  if(totalPlates < minPlates || totalPlates <= recentN) return null;

  // 直近N皿が始まった時刻＝累計皿数が (総皿数 − N) を超えた最初の皿
  let cum = 0, boundary = null;
  for(const e of plates){
    cum += e.amount;
    if(cum > totalPlates - recentN){ boundary = e.occurredAt; break; }
  }
  if(!boundary) return null;
  const bt = new Date(boundary).getTime();

  const sumYakumono = pred => evs
    .filter(e=>e.eventType==='YAKUMONO' && pred(new Date(e.occurredAt).getTime()))
    .reduce((a,e)=>a+e.amount, 0);
  const recentYak  = sumYakumono(t => t >= bt);
  const totalYak   = sumYakumono(() => true);
  const earlierYak = totalYak - recentYak;
  const earlierPlates = totalPlates - recentN;
  if(earlierPlates <= 0) return null;

  const recentSara  = recentYak / recentN;
  const earlierSara = earlierYak / earlierPlates;
  if(!(earlierSara > 0)) return null;

  const drop = (earlierSara - recentSara) / earlierSara * 100;
  return { recentSara, earlierSara, drop, recentN, dropPct, triggered: drop >= dropPct };
}
// 低下警告のHTML（×で閉じられる）。閉じた状態は state._saraWarnDismissed で保持し、
// 条件が解消したら自動的に解除して、再度悪化したときにまた出るようにする。
function saraWarnHtml(d){
  if(!d || !d.triggered || state._saraWarnDismissed) return '';
  return `<div class="warn-box sara-warn">
    <button class="warn-close" data-action="dismissSaraWarn" aria-label="閉じる">×</button>
    ⚠ 皿単価が低下しています（直近${d.recentN}皿 ${d.recentSara.toFixed(2)}玉／皿　←　それ以前 ${d.earlierSara.toFixed(2)}玉／皿　約${Math.round(d.drop)}%ダウン）
  </div>`;
}
function countValidWarnings(session, stats){
  const warns = [];
  if(stats.raw.haneKaihou < 0) warns.push('羽根開放回数が負数です（データカウンターの入力を確認してください）');
  if(stats.raw.spWin > stats.raw.spEntry) warns.push('SP当選回数がSP突入回数を超えています');
  if(stats.raw.totalV !== stats.raw.roundTotal) warns.push(`総V入賞回数(${stats.raw.totalV})とラウンド総数(${stats.raw.roundTotal})が一致しません`);
  return warns;
}

function computeStats(session){
  const r = {};
  r.plateCount    = sumEvents(session,'PLATE');
  r.yakumonoBalls = sumEvents(session,'YAKUMONO');
  r.normalWinDoteGoe    = sumNormalWinPattern(session,'dote_goe');
  r.normalWinPoleDance  = sumNormalWinPattern(session,'pole_dance');
  r.normalWinTurntable  = sumNormalWinPattern(session,'turntable');
  r.normalWinStraightIn = sumNormalWinPattern(session,'straight_in');
  r.normalWinOther      = sumNormalWinPattern(session,'other');
  r.normalWin = sumEvents(session,'NORMAL_WIN');
  r.spEntry = sumEvents(session,'SP_ENTRY');
  r.spWin   = sumEvents(session,'SP_WIN');
  r.round3  = sumEvents(session,'ROUND3');
  r.round5  = sumEvents(session,'ROUND5');
  r.round10 = sumEvents(session,'ROUND10');

  // タワー滞在計測（非削除のTOWER_STAYイベントを集計）
  const towerEvs = Object.values(session.events||{}).filter(e=>!e.deleted && e.eventType==='TOWER_STAY');
  r.towerStayCount = towerEvs.length;
  r.towerStayTotalMs = towerEvs.reduce((a,e)=>a+(e.durationMs||0),0);
  r.towerStayAvgMs = r.towerStayCount>0 ? r.towerStayTotalMs/r.towerStayCount : null;

  // 羽根開放回数 = 旧方式のスナップショット差分（互換維持）＋ 新方式の+1タップ合計
  // 新規セッションはスナップショットが空のため、実質HANE_KAIHOUイベントの合計のみになる
  const snaps = (session.openingCounterSnapshots||[]).filter(s=>!s.deleted).sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt));
  const baseline = session.counterBaseline || 0;
  const latest = snaps.length ? snaps[snaps.length-1].value : baseline;
  r.counterBaseline = baseline;
  r.counterLatest = latest;
  r.haneKaihou = (latest - baseline) + sumEvents(session,'HANE_KAIHOU');

  r.totalV = r.normalWin + r.spWin;
  r.roundTotal = r.round3 + r.round5 + r.round10;

  r.ballsUsed = r.plateCount * APP_SETTINGS.ballsPerPlate;
  r.ballsUsedYen = r.ballsUsed * APP_SETTINGS.yenPerBall;

  r.actualPayout = r.round3*APP_SETTINGS.payout3R + r.round5*APP_SETTINGS.payout5R + r.round10*APP_SETTINGS.payout10R;
  r.expectedPayout = r.totalV * AVG_PAYOUT;
  // 実際の差玉は、実戦終了時に実測値が入力されていればそれを優先し、無ければラウンド回数からの計算値を使う
  r.actualDiffBallsCalculated = r.actualPayout - r.ballsUsed;
  r.actualDiffBalls = (session.actualDiffBallsManual!=null && isFinite(session.actualDiffBallsManual)) ? session.actualDiffBallsManual : r.actualDiffBallsCalculated;

  // 皿単価あたりの期待差玉（A）＝ 皿単価 × 役物当選率 × 1当選あたり平均出玉 − 125玉（1皿分の打ち込み玉数）
  const saraTankaVal = safeDiv(r.yakumonoBalls, r.plateCount);
  const yakumonoWinRateVal = safeDiv(r.totalV, r.yakumonoBalls);
  r.expectedPayoutPerPlate = (saraTankaVal!==null && yakumonoWinRateVal!==null) ? (saraTankaVal * yakumonoWinRateVal * AVG_PAYOUT) - APP_SETTINGS.ballsPerPlate : null;

  const endRef = session.endedAt || nowIso();
  r.minutes = minutesBetween(session.startedAt, endRef);
  const hours = r.minutes ? r.minutes/60 : null;

  if(session.status==='active'){
    const [ch,cm] = APP_SETTINGS.closingTime.split(':').map(Number);
    const nowD = new Date();
    const closing = new Date(nowD); closing.setHours(ch,cm,0,0);
    let remain = (closing - nowD)/60000;
    if(remain<0) remain=0;
    r.remainMinutes = remain;
  } else {
    r.remainMinutes = null;
  }

  if(session.status==='active' && r.expectedPayoutPerPlate!==null && r.minutes && r.minutes>0){
    r.platePace = r.plateCount / r.minutes;
    r.projectedAdditionalPlates = r.platePace * r.remainMinutes;
    // 閉店までの着地予想 = ここまでの実績差玉（実際に起きたこと） + 残り時間分の期待差玉（A×残り皿数）。
    // 以前は実績を加味せず使用玉数をそのまま差し引いていたため、期待値プラスの台でも
    // 使用玉数が嵩むと終日マイナス表示になってしまう不具合があった。
    r.expectedDiffBalls = r.expectedPayoutPerPlate * r.projectedAdditionalPlates + r.actualDiffBalls;
  } else {
    r.platePace = null;
    r.projectedAdditionalPlates = null;
    r.expectedDiffBalls = r.expectedPayout - r.ballsUsed;
  }

  r.actualYen = r.actualDiffBalls * APP_SETTINGS.yenPerBall;
  r.expectedYen = r.expectedDiffBalls * APP_SETTINGS.yenPerBall;
  r.actualHourly = (hours && hours>0) ? r.actualYen/hours : null;

  if(session.status==='active'){
    r.expectedHourly = (r.platePace!==null) ? r.platePace * 60 * r.expectedPayoutPerPlate * APP_SETTINGS.yenPerBall : null;
  } else {
    r.expectedHourly = (hours && hours>0) ? r.expectedYen/hours : null;
  }

  if(session.status==='active'){
    r.expectedAtClose = r.expectedYen;
    r.expectedUntilClose = r.expectedAtClose - r.actualYen;
  } else {
    r.expectedUntilClose = null; r.expectedAtClose = null;
  }

  const m = {};
  m.saraTanka = rate(r.yakumonoBalls, r.plateCount, 2, '玉／皿');
  m.expectedPayoutPerPlate = { text: r.expectedPayoutPerPlate!==null ? r.expectedPayoutPerPlate.toFixed(2)+'玉／皿' : '－', value: r.expectedPayoutPerPlate };
  m.haneKaihouPerPlate = rate(r.haneKaihou, r.plateCount, 2, '回／皿');
  m.pickupRate = pct(r.yakumonoBalls, r.haneKaihou);
  m.normalWinDoteGoeRatio    = pct(r.normalWinDoteGoe, r.normalWin);
  m.normalWinPoleDanceRatio  = pct(r.normalWinPoleDance, r.normalWin);
  m.normalWinTurntableRatio  = pct(r.normalWinTurntable, r.normalWin);
  m.normalWinStraightInRatio = pct(r.normalWinStraightIn, r.normalWin);
  m.normalWinOtherRatio      = pct(r.normalWinOther, r.normalWin);
  m.spEntryRate = pct(r.spEntry, r.yakumonoBalls);
  m.spWinRate = pct(r.spWin, r.spEntry);
  m.yakumonoWinRate = pct(r.totalV, r.yakumonoBalls);
  // 大当たり確率 = 当選（総V入賞）÷ スタート（羽根開放回数）。パチンコ業界慣習の「1/X」表記で表示
  m.jackpotProbability = (()=>{
    const p = safeDiv(r.totalV, r.haneKaihou);
    if(p===null) return {text:'－', value:null};
    if(p<=0) return {text:`0／${fmtInt(r.totalV)}／${fmtInt(r.haneKaihou)}`, value:0};
    return {text:`1／${(1/p).toFixed(1)}（${fmtInt(r.totalV)}／${fmtInt(r.haneKaihou)}）`, value:p};
  })();
  m.round3Ratio = pct(r.round3, r.roundTotal);
  m.round5Ratio = pct(r.round5, r.roundTotal);
  m.round10Ratio = pct(r.round10, r.roundTotal);
  m.normalWinCompRatio = pct(r.normalWin, r.totalV);
  m.spWinCompRatio = pct(r.spWin, r.totalV);
  m.towerStayAvg = { text: r.towerStayAvgMs!==null ? fmtSec(r.towerStayAvgMs) : '－', value: r.towerStayAvgMs };

  return { raw:r, m, warnings: countValidWarnings(session,{raw:r}) };
}

/* =========================================================================
   7. 描画: 共通レンダラ
   ========================================================================= */
// タブ・実戦サブビュー・カレンダーモードが変わった時だけスクロール位置を先頭に戻す。
// 1秒/60秒ごとの自動再描画（ストップウォッチ・閉店カウントダウン）はキーが変わらないため、
// 実戦中に下までスクロールしていても勝手に先頭へ戻らない。
let _lastScrollKey = null;
function currentScrollKey(){
  if(state.tab==='battle') return 'battle:'+state.view.battle;
  if(state.tab==='calendar') return 'calendar:'+state.view.calendar.mode;
  if(state.tab==='analysis') return 'analysis:'+state.view.analysis.mode;
  return state.tab;
}
function render(){
  updateSyncBadge();
  $$('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  const app = $('#app');
  // 描画中に例外が起きても、画面が真っ黒のまま操作不能にならないようにする。
  // （bindDynamic() まで到達しないとタブのタップすら効かなくなるため）
  try{
    if(state.tab==='battle') app.innerHTML = renderBattleTab();
    else if(state.tab==='summary') app.innerHTML = renderSummaryTab();
    else if(state.tab==='calendar') app.innerHTML = renderCalendarTab();
    else if(state.tab==='analysis') app.innerHTML = renderAnalysisTab();
    else if(state.tab==='settings') app.innerHTML = renderSettingsTab();
  }catch(e){
    console.error('render failed', e);
    app.innerHTML = `<div class="warn-box">この画面の表示中にエラーが発生しました。下のタブから他の画面には移動できます。<br><span style="font-size:11px;">${escapeHtml(String((e && e.message) || e))}</span></div>`;
  }
  if(state._formulaText) app.innerHTML += formulaModalHtml(state._formulaText);
  bindDynamic();
  const key = currentScrollKey();
  if(key !== _lastScrollKey){ window.scrollTo(0,0); _lastScrollKey = key; }
}
function formulaModalHtml(text){
  return `
  <div class="formula-modal-backdrop" data-action="closeFormulaBackdrop">
    <div class="formula-modal">
      <div class="formula-modal-title">計算式</div>
      <div class="formula-modal-text">${escapeHtml(text)}</div>
      <button class="secondary-btn" data-action="closeFormula">閉じる</button>
    </div>
  </div>`;
}

/* ---------- 実戦タブ ---------- */
function renderBattleTab(){
  const session = getActiveSession();
  if(!session) return renderStartScreen();
  if(state.view.battle==='history') return renderHistoryScreen(session);
  if(state.view.battle==='end') return renderEndScreen(session);
  return renderCounterScreen(session);
}

function renderStartScreen(){
  return `
  <h2 style="margin-bottom:14px;">実戦開始</h2>
  <div class="card">
    <div class="field">
      <label>台番号</label>
      <div class="chip-select-row">
        ${MACHINE_NUMBERS.map(m=>{
          const avg = machineHammerAvg(m);
          const hue = avg!==null ? machineHammerHue(avg) : '';
          const style = avg!==null ? ` style="background:hsla(${hue},55%,45%,0.22);border-color:hsl(${hue},55%,45%);color:hsl(${hue},70%,78%);"` : '';
          const title = avg!==null ? ` title="ハンマー・ハンドル・ストップボタンの癖 平均${avg.toFixed(1)}"` : '';
          return `<span class="chip" data-machine-select="${m}" data-hue="${hue}"${style}${title}>${m}</span>`;
        }).join('')}
      </div>
      <input type="hidden" id="inMachine">
    </div>
    <div class="field-row">
      <div class="field">
        <label>前後傾斜実測値（度・手前方向）</label>
        <input id="inTiltFB" type="number" step="0.01" placeholder="例：1.18">
        <div class="chip-row">
          ${[0.3,0.6,0.9,1.2,1.5,1.8].map(v=>`<span class="chip" data-fill="inTiltFB:${v}">${v}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="field">
      <label>左右傾斜実測値（度・＋は右上がり／－は左上がり）</label>
      <div class="lr-select-row">
        ${LR_QUICK_VALUES.map(v=>`<button type="button" class="lr-btn ${Math.abs(v)<1e-9?'zero':''}" data-lr-select="${v}">${lrQuickLabel(v)}</button>`).join('')}
      </div>
      <input id="inTiltLR" type="number" step="0.01" placeholder="範囲外の値はここに直接入力">
      <div class="hint">上のボタンでワンタップ選択（左0.4〜右0.4／0.1度刻み）。範囲外の値は直接入力してください。0で水平です。</div>
    </div>
    <div class="field">
      <label>傾斜メモ（任意）</label>
      <input id="inTiltNote" type="text" placeholder="測定条件など">
    </div>
    <div class="field">
      <label>開始ゲーム数（任意）</label>
      <input id="inStartGameCount" type="number" step="1" placeholder="例：120">
      <div class="hint">既に回っていた分の基準値。実戦中は羽根開放回数＋1ボタンに「集計値－この値」を追加表示します（マイナスも表示されます）。</div>
    </div>
    <div class="field">
      <label>実戦メモ（任意）</label>
      <textarea id="inMemo" placeholder="狙い目・状況など"></textarea>
    </div>
    <button class="primary-btn" id="btnStartSession">実戦開始</button>
  </div>`;
}

  <div class="cat-block dense">

      ${evButtonHtml('PLATE', r, 'hifreq')}

      <button class="act-btn big" data-action="towerStayToggle" data-color="${EVENT_DEFS.TOWER_STAY.color}"

  <div class="stat-grid">

    <div class="stat-card"><div class="label">拾い率</div><div class="value">${m.pickupRate.value!==null?m.pickupRate.value.toFixed(1)+'％':'－'}</div><div class="sub">${m.pickupRate.text}</div></div>
    <div class="stat-card"><div class="label">役物当選率</div><div class="value">${m.yakumonoWinRate.value!==null?m.yakumonoWinRate.value.toFixed(1)+'％':'－'}</div><div class="sub">${m.yakumonoWinRate.text}</div></div>

    <span data-action="demoSetTime">経過時間を手動設定</span>
  </div>
  `;
}

function renderHistoryScreen(session){
  const evs = Object.values(session.events||{}).sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt));
  const snaps = (session.openingCounterSnapshots||[]).slice().sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt));
  return `
  <div class="fab-row"><button class="fab" data-action="backToCounter">← 戻る</button></div>
  <h2 style="margin-bottom:10px;">操作履歴</h2>
  ${snaps.length===0? '' : `
  <div class="section-title">羽根開放回数スナップショット（旧方式・互換表示のみ）</div>
  <div class="card">
    ${snaps.map(s=>`
      <div class="hist-item ${s.deleted?'deleted':''}">
        <span class="t">${timeStr(s.occurredAt)}</span>
        <span class="lbl">現在値 ${fmtInt(s.value)}${s.note?`（${escapeHtml(s.note)}）`:''}${(s.editHistory&&s.editHistory.length)?` <span class="info-note">修正${s.editHistory.length}回</span>`:''}</span>
        <span class="hist-actions">
          <button class="icon-btn" data-edit-snap="${s.id}">修正</button>
          ${!s.deleted?`<button class="icon-btn" data-del-snap="${s.id}">削除</button>`:''}
        </span>
      </div>`).join('')}
  </div>`}
  <div class="section-title">イベント履歴（全${evs.length}件）</div>
  <div class="card">
    ${evs.length===0? '<div class="info-note">まだ操作がありません</div>' : evs.map(e=>`
      <div class="hist-item ${e.deleted?'deleted':''}">
        <span class="t">${timeStr(e.occurredAt)}</span>
        <span class="lbl">${eventLabel(e)}</span>
        <span class="amt">${e.eventType==='TOWER_STAY' ? '' : (e.amount>0?'+':'')+e.amount}</span>
        <span class="hist-actions">
          <button class="icon-btn" data-edit-ev="${e.eventId}">修正</button>
          ${e.deleted? `<button class="icon-btn" data-restore-ev="${e.eventId}">復元</button>` : `<button class="icon-btn" data-del-ev="${e.eventId}">削除</button>`}
        </span>
      </div>`).join('')}
  </div>
  `;
}

      <input id="editStart" type="datetime-local" value="${dateTimeLocalValue(session.startedAt)}">

    ${rowLine('実績収支', fmtYen(r.actualYen), '実績差玉 × 3.57円')}
    ${rowLine('期待収支', fmtYen(r.expectedYen), '期待差玉 × 3.57円')}

  </div>
  `;
}

function latestSession(){

const CAL_METRICS = [
  {key:'sara', label:'皿単価'}, {key:'jackpot', label:'大当たり確率'}, {key:'towerAvg', label:'タワー平均滞在'},
  {key:'actualHourly', label:'実績時給'}, {key:'expectedHourly', label:'期待時給'},
  {key:'count', label:'実戦件数'}, {key:'machine', label:'台番号'}, {key:'actualYen', label:'実績収支'}, {key:'expectedYen', label:'期待収支'},
];
function sessionsOfMonth(month){
  return Object.values(state.sessions).filter(s=>s.date && s.date.startsWith(month));
}
function sessionsOfDay(date){
  return Object.values(state.sessions).filter(s=>s.date===date).sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));
}
function aggregateSessions(list){
  const agg = { plateCount:0, yakumonoBalls:0, haneKaihou:0, totalV:0, actualPayout:0, expectedPayout:0,
    ballsUsed:0, actualYen:0, expectedYen:0, minutes:0, count:list.length, machineCounts:{},
    normalWin:0, normalWinDoteGoe:0, normalWinPoleDance:0, normalWinTurntable:0, normalWinStraightIn:0, normalWinOther:0,
    towerStayCount:0, towerStayTotalMs:0 };
  list.forEach(session=>{
    const s = computeStats(session);
    agg.plateCount += s.raw.plateCount;
    agg.yakumonoBalls += s.raw.yakumonoBalls;
    agg.haneKaihou += s.raw.haneKaihou;
    agg.totalV += s.raw.totalV;
    agg.actualPayout += s.raw.actualPayout;
    agg.expectedPayout += s.raw.expectedPayout;
    agg.ballsUsed += s.raw.ballsUsed;
    agg.actualYen += s.raw.actualYen;
    agg.expectedYen += s.raw.expectedYen;
    agg.minutes += (s.raw.minutes||0);
    agg.normalWin += s.raw.normalWin;
    agg.normalWinDoteGoe += s.raw.normalWinDoteGoe;
    agg.normalWinPoleDance += s.raw.normalWinPoleDance;
    agg.normalWinTurntable += s.raw.normalWinTurntable;
    agg.normalWinStraightIn += s.raw.normalWinStraightIn;
    agg.normalWinOther += s.raw.normalWinOther;
    agg.towerStayCount += s.raw.towerStayCount;
    agg.towerStayTotalMs += s.raw.towerStayTotalMs;
    if(session.machineNumber){ agg.machineCounts[session.machineNumber] = (agg.machineCounts[session.machineNumber]||0)+1; }
  });
  agg.sara = safeDiv(agg.yakumonoBalls, agg.plateCount);
  agg.pickupRate = safeDiv(agg.yakumonoBalls, agg.haneKaihou);
  agg.winRate = safeDiv(agg.totalV, agg.yakumonoBalls);
  agg.actualHourly = agg.minutes>0 ? agg.actualYen/(agg.minutes/60) : null;
  agg.expectedHourly = agg.minutes>0 ? agg.expectedYen/(agg.minutes/60) : null;
  agg.topMachine = Object.entries(agg.machineCounts).sort((a,b)=>b[1]-a[1])[0];
  {
    const p = safeDiv(agg.totalV, agg.haneKaihou);
    agg.jackpotProbability = (p===null) ? {text:'－', value:null}
      : (p<=0) ? {text:`0／${fmtInt(agg.totalV)}／${fmtInt(agg.haneKaihou)}`, value:0}
      : {text:`1／${(1/p).toFixed(1)}（${fmtInt(agg.totalV)}／${fmtInt(agg.haneKaihou)}）`, value:p};
  }
  agg.days = new Set(list.map(s=>s.date)).size;
  agg.towerStayAvgMs = agg.towerStayCount>0 ? agg.towerStayTotalMs/agg.towerStayCount : null;
  agg.towerStayAvg = { text: agg.towerStayAvgMs!==null ? fmtSec(agg.towerStayAvgMs) : '－', value: agg.towerStayAvgMs };
  agg.normalWinDoteGoeRatio    = pct(agg.normalWinDoteGoe, agg.normalWin);
  agg.normalWinPoleDanceRatio  = pct(agg.normalWinPoleDance, agg.normalWin);
  agg.normalWinTurntableRatio  = pct(agg.normalWinTurntable, agg.normalWin);
  agg.normalWinStraightInRatio = pct(agg.normalWinStraightIn, agg.normalWin);
  agg.normalWinOtherRatio      = pct(agg.normalWinOther, agg.normalWin);
  return agg;
}
function calCellValue(dayList, metric){
  if(dayList.length===0) return '';
  const agg = aggregateSessions(dayList);
  switch(metric){
    case 'sara': return agg.sara!==null? agg.sara.toFixed(2):'－';
    case 'jackpot': return (agg.jackpotProbability.value!==null && agg.jackpotProbability.value>0) ? '1/'+(1/agg.jackpotProbability.value).toFixed(1) : '－';
    case 'towerAvg': return agg.towerStayAvg.text;
    case 'actualHourly': return agg.actualHourly!==null? Math.round(agg.actualHourly).toLocaleString('ja-JP'):'－';
    case 'expectedHourly': return agg.expectedHourly!==null? Math.round(agg.expectedHourly).toLocaleString('ja-JP'):'－';
    case 'count': return String(dayList.length);
    case 'machine': return dayList[dayList.length-1].machineNumber || '－';
    case 'actualYen': return fmtYen(agg.actualYen);
    case 'expectedYen': return fmtYen(agg.expectedYen);
  }
}

const ANALYSIS_DIMS = [
  {key:'machine', label:'台番号別'}, {key:'fb', label:'前後傾斜別'}, {key:'lr', label:'左右傾斜別'},
  {key:'combo', label:'傾斜組合せ別'}, {key:'month', label:'月別'},

function groupSessions(list, dim){
  const groups = {};
  list.forEach(s=>{
    let key, label;
    if(dim==='machine'){ key = s.machineNumber||'(未入力)'; label=key; }
    else if(dim==='fb'){ const c=classifyFrontBack(s.tilt.frontBack); key=c?c.key:'(不明)'; label=c?c.label:'(不明)'; }
    else if(dim==='lr'){ const c=classifyLeftRight(s.tilt.leftRight); key=c?c.key:'(不明)'; label=c?c.label:'(不明)'; }
    else if(dim==='combo'){ const cf=classifyFrontBack(s.tilt.frontBack), cl=classifyLeftRight(s.tilt.leftRight);
      key=(cf?cf.key:'?')+'|'+(cl?cl.key:'?'); label=(cf?cf.label:'不明')+' × '+(cl?cl.label:'不明'); }
    else if(dim==='month'){ key = s.date.slice(0,7); label = key; }
    (groups[key] = groups[key] || {label, list:[]}).list.push(s);
  });
  return Object.values(groups).sort((a,b)=>b.list.length-a.list.length);
}

const TREND_METRICS = [
  {key:'sara', label:'皿単価', unit:'玉/皿'},
  {key:'jackpot', label:'大当たり確率(%)', unit:'%'},
  {key:'pickup', label:'拾い率(%)', unit:'%'},
  {key:'winRate', label:'役物当選率(%)', unit:'%'},
  {key:'towerAvg', label:'タワー平均滞在(秒)', unit:'秒'},
  {key:'actualYen', label:'実績収支', unit:'円'},
  {key:'expectedYen', label:'期待収支', unit:'円'},
  {key:'actualHourly', label:'実績時給', unit:'円/時'},
];
function trendMetricValue(stats, key){
  const r = stats.raw, m = stats.m;
  switch(key){
    case 'sara': return m.saraTanka.value;
    case 'jackpot': return m.jackpotProbability.value!==null ? m.jackpotProbability.value*100 : null;
    case 'pickup': return m.pickupRate.value;
    case 'winRate': return m.yakumonoWinRate.value;
    case 'towerAvg': return r.towerStayAvgMs!==null ? r.towerStayAvgMs/1000 : null;
    case 'actualYen': return r.actualYen;
    case 'expectedYen': return r.expectedYen;
    case 'actualHourly': return r.actualHourly;
  }
  return null;
}
// 外部ライブラリ不使用の軽量な折れ線グラフ（インラインSVG）。CSS変数はSVG属性の互換性のため使わず16進色を直書きする。
function trendChartSvg(points, opts={}){
  const W=520, H=220, padL=48, padR=12, padT=18, padB=26;
  const vals = points.map(p=>p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min -= 1; max += 1; }
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (points.length<=1 ? innerW/2 : (i/(points.length-1))*innerW);
  const y = v => padT + innerH - ((v-min)/(max-min))*innerH;
  const pathD = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const color = opts.color || '#e0a942';
  const unit = opts.unit || '';
  const maxLabels = 6;
  const step = Math.max(1, Math.ceil(points.length/maxLabels));
  const labels = points.map((p,i)=> (i%step===0 || i===points.length-1) ? `<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9" fill="#6b7480" text-anchor="middle">${escapeHtml(p.label)}</text>` : '').join('');
  const dots = points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3" fill="${color}"><title>${escapeHtml(p.label)}: ${p.value.toFixed(2)}${unit}</title></circle>`).join('');
  return `
  <div class="card" style="padding:10px;overflow-x:auto;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      <text x="${padL}" y="${padT}" font-size="10" fill="#9aa3ad">${max.toFixed(2)}${unit}</text>
      <text x="${padL}" y="${H-padB+2}" font-size="10" fill="#9aa3ad">${min.toFixed(2)}${unit}</text>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#2a2f38" stroke-width="1"/>
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#2a2f38" stroke-width="1"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  </div>`;
}
function renderTrendView(sessionsFiltered){
  const v = state.view.analysis;
  const metric = TREND_METRICS.find(mtr=>mtr.key===v.metric) || TREND_METRICS[0];
  const sorted = sessionsFiltered.slice().sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));
  const points = sorted.map(s=>{
    const stats = computeStats(s);
    return { label: s.date.slice(5), value: trendMetricValue(stats, metric.key) };
  }).filter(p=>p.value!==null && isFinite(p.value));
  return `
  <div class="filter-tabs">
    ${TREND_METRICS.map(mtr=>`<button class="${v.metric===mtr.key?'active':''}" data-trend-metric="${mtr.key}">${mtr.label}</button>`).join('')}
  </div>
  <div class="info-note" style="margin-bottom:8px;">対象実戦：${points.length}件</div>
  ${points.length<2 ? `<div class="card">グラフ表示には2件以上の実戦データが必要です（現在${points.length}件）。</div>` : trendChartSvg(points, {color:'#e0a942', unit:metric.unit})}

function renderAnalysisTab(){
  const v = state.view.analysis;
  const all = Object.values(state.sessions).filter(s=>{
    if(v.dateFrom && s.date < v.dateFrom) return false;
    if(v.dateTo && s.date > v.dateTo) return false;
    return true;
  });
  const modeSeg = `<div class="seg">
    <button class="${v.mode!=='trend'?'active':''}" data-an-mode="group">グループ集計</button>
    <button class="${v.mode==='trend'?'active':''}" data-an-mode="trend">推移グラフ</button>
  </div>`;
  const dateFilterHtml = `
  <div class="field-row" style="margin-bottom:6px;">
    <div class="field"><label>期間（From）</label><input type="date" id="anFrom" value="${v.dateFrom||''}"></div>
    <div class="field"><label>期間（To）</label><input type="date" id="anTo" value="${v.dateTo||''}"></div>
  </div>
  <button class="secondary-btn" id="btnApplyAnFilter" style="margin-bottom:10px;">絞り込みを適用</button>`;

  if(v.mode==='trend'){
    return `
    <h2 style="margin-bottom:8px;">分析</h2>
    ${modeSeg}
    ${dateFilterHtml}
    ${renderTrendView(all)}

  const groups = groupSessions(all, v.dim);
  return `
  <h2 style="margin-bottom:8px;">分析</h2>
  ${modeSeg}
  <div class="filter-tabs">
    ${ANALYSIS_DIMS.map(d=>`<button class="${v.dim===d.key?'active':''}" data-an-dim="${d.key}">${d.label}</button>`).join('')}

      <div class="gmetrics">
        <span>実戦回数 <b>${g.list.length}</b></span>
        <span>合計実戦時間 <b>${fmtDuration(totalMinutes)}</b></span>
        <span>使用皿数 <b>${fmtInt(agg.plateCount)}</b></span>
        <span>皿単価 <b>${agg.sara!==null?agg.sara.toFixed(2):'－'}</b>（${fmtInt(agg.yakumonoBalls)}／${fmtInt(agg.plateCount)}）</span>
        <span>拾い率 <b>${pct(agg.yakumonoBalls,agg.haneKaihou).text}</b></span>
        <span>役物当選率 <b>${pct(agg.totalV,agg.yakumonoBalls).text}</b></span>
        <span>大当たり確率 <b>${agg.jackpotProbability.text}</b></span>
        <span>実績収支 <b>${fmtYen(agg.actualYen)}</b></span>
        <span>期待収支 <b>${fmtYen(agg.expectedYen)}</b></span>
        <span>実績時給 <b>${fmtYenRate(agg.actualHourly)}</b></span>
        <span>期待時給 <b>${fmtYenRate(agg.expectedHourly)}</b></span>
      </div>
      <div class="gmetrics" style="margin-top:6px;">
        <span>タワー計測回数 <b>${fmtInt(agg.towerStayCount)}</b></span>
        <span>タワー平均滞在時間 <b>${agg.towerStayAvg.text}</b></span>
      </div>
      <div class="gmetrics" style="margin-top:6px;">
        <span>土手越え <b>${agg.normalWinDoteGoeRatio.text}</b></span>
        <span>ポールダンス <b>${agg.normalWinPoleDanceRatio.text}</b></span>
        <span>ターンテーブル <b>${agg.normalWinTurntableRatio.text}</b></span>
        <span>ストレートイン <b>${agg.normalWinStraightInRatio.text}</b></span>
        <span>それ以外 <b>${agg.normalWinOtherRatio.text}</b></span>

      ${lowSample? `<div class="sample-warn">⚠ サンプル数が少ないため参考値です（${g.list.length}件）</div>`:''}
    </div>`;
  }).join('')}
  `;
}

/* =========================================================================
   8. CSV エクスポート
   ========================================================================= */
function exportCsv(){
  const headers = ['実戦日','台番号','前後傾斜実測値','前後傾斜区分','左右傾斜実測値','左右傾斜区分','実戦時間(分)',
    '使用皿数','使用玉数','羽根開放回数','役物入賞玉数','皿単価','拾い率(%)',
    'ノーマル当選_土手越え','ノーマル当選_ポールダンス','ノーマル当選_ターンテーブル','ノーマル当選_ストレートイン','ノーマル当選_それ以外',
    'SP突入率(%)','SP当選率(%)','役物当選率(%)','大当たり確率(1/X)',
    '3R回数','5R回数','10R回数','実績出玉','期待出玉','実績収支','期待収支','実績時給','期待時給',
    'タワー計測回数','タワー平均滞在時間(秒)'];
  const rows = Object.values(state.sessions).sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt)).map(session=>{
    const s = computeStats(session);
    const r = s.raw, m = s.m;
    const fb = classifyFrontBack(session.tilt.frontBack), lr = classifyLeftRight(session.tilt.leftRight);
    return [
      session.date, session.machineNumber,
      session.tilt.frontBack, fb?fb.label:'',
      session.tilt.leftRight, lr?lr.label:'',
      r.minutes!==null?Math.round(r.minutes):'',
      r.plateCount, r.ballsUsed, r.haneKaihou, r.yakumonoBalls,
      m.saraTanka.value!==null?m.saraTanka.value.toFixed(2):'',
      m.pickupRate.value!==null?m.pickupRate.value.toFixed(1):'',
      r.normalWinDoteGoe, r.normalWinPoleDance, r.normalWinTurntable, r.normalWinStraightIn, r.normalWinOther,
      m.spEntryRate.value!==null?m.spEntryRate.value.toFixed(1):'',
      m.spWinRate.value!==null?m.spWinRate.value.toFixed(1):'',
      m.yakumonoWinRate.value!==null?m.yakumonoWinRate.value.toFixed(1):'',
      (m.jackpotProbability.value!==null && m.jackpotProbability.value>0) ? (1/m.jackpotProbability.value).toFixed(1) : '',
      r.round3, r.round5, r.round10,
      Math.round(r.actualPayout), Math.round(r.expectedPayout),
      Math.round(r.actualYen), Math.round(r.expectedYen),
      r.actualHourly!==null?Math.round(r.actualHourly):'',
      r.expectedHourly!==null?Math.round(r.expectedHourly):'',
      r.towerStayCount, r.towerStayAvgMs!==null?(r.towerStayAvgMs/1000).toFixed(1):'',
    ];
  });
  const csv = [headers.join(',')].concat(rows.map(row=>row.map(v=>{
    const sv = String(v===null||v===undefined?'':v);
    return /[",\n]/.test(sv) ? '"'+sv.replace(/"/g,'""')+'"' : sv;
  }).join(','))).join('\n');
  const blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `newtokio-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
