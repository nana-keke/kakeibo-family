/* ======================== 商品登録 ======================== */
const ITEM_TOKEN_RE = /^MS1-[2-9A-HJ-NP-Z]{12}$/;
const INITIAL_ITEM_ALPHAS = ["S", "M", "L"];
const LATIN_ITEM_ALPHAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


function rankedItemValues(items, key){
  const stat = {};
  items.forEach(item => {
    const raw = item[key];
    const value = raw === null || raw === undefined ? "" : String(raw).trim();
    if (!value) return;
    const s = stat[value] = stat[value] || { value, count:0, last:0 };
    s.count++;
    s.last = Math.max(s.last, Number(item.createdAt)||0);
  });
  return Object.values(stat).sort((a,b) => b.count-a.count || b.last-a.last)
    .map(s => s.value);
}

function photoToSmallDataUrl(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 200 / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      let quality = 0.82;
      let dataUrl = canvas.toDataURL("image/jpeg", quality);
      const bytesOf = value => Math.ceil((value.length - value.indexOf(",") - 1) * 0.75);
      while (bytesOf(dataUrl) > 20000 && quality > 0.42) {
        quality -= 0.08;
        dataUrl = canvas.toDataURL("image/jpeg", quality);
      }
      resolve(dataUrl);
    };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    image.src = url;
  });
}

function DigitPad({ value, onChange, maxValue, maxDigits }){
  const add = digit => {
    if (digit === "0" && !value) return;
    const next = (value + digit).slice(0, maxDigits);
    if (Number(next) <= maxValue) onChange(next);
  };
  return <div className="keypad">
    {["1","2","3","4","5","6","7","8","9"].map(d =>
      <button type="button" key={d} onClick={() => add(d)}>{d}</button>)}
    <button type="button" onClick={() => onChange("")}>消す</button>
    <button type="button" onClick={() => add("0")}>0</button>
    <button type="button" onClick={() => onChange(value.slice(0,-1))}>一字戻す</button>
  </div>;
}

/* 商品登録と販売で同じ読み取り経路を使う。AndroidはBarcodeDetectorを優先し、
   存在しない環境だけcanvas経由でjsQRへ渡す。 */
function QrScanner({ onRead, message, error }){
  const [cameraSupported, setCameraSupported] = useState(true);
  const [cameraMessage, setCameraMessage] = useState("");
  const [cameraError, setCameraError] = useState(false);
  const [scanNonce, setScanNonce] = useState(0);
  const videoRef = useRef(null);
  const scanCanvasRef = useRef(null);
  const lastSeenRef = useRef("");
  const onReadRef = useRef(onRead);
  onReadRef.current = onRead;

  useEffect(() => {
    let stopped = false;
    let stream = null;
    let frameId = null;
    let detecting = false;
    let lastJsQrAt = 0;
    lastSeenRef.current = "";
    setCameraError(false);
    setCameraMessage("");

    const start = async () => {
      const useBarcodeDetector = "BarcodeDetector" in window;
      if (!navigator.mediaDevices?.getUserMedia || (!useBarcodeDetector && typeof window.jsQR !== "function")) {
        setCameraSupported(false);
        setCameraError(true);
        setCameraMessage("このブラウザではQRを読めません。ブラウザを最新版にして開いてください。");
        return;
      }
      try {
        const detector = useBarcodeDetector ? new BarcodeDetector({ formats:["qr_code"] }) : null;
        stream = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ ideal:"environment" } }, audio:false
        });
        if (stopped) { stream.getTracks().forEach(track => track.stop()); return; }
        const video = videoRef.current;
        video.srcObject = stream;
        await video.play();
        setCameraSupported(true);
        const detect = async frameTime => {
          if (stopped) return;
          if (!detecting && video.readyState >= 2) {
            detecting = true;
            try {
              let value = "";
              if (detector) {
                const codes = await detector.detect(video);
                value = codes[0]?.rawValue || "";
              } else if (!lastJsQrAt || frameTime - lastJsQrAt >= 120) {
                lastJsQrAt = frameTime;
                const canvas = scanCanvasRef.current;
                const sourceWidth = video.videoWidth;
                const sourceHeight = video.videoHeight;
                if (canvas && sourceWidth && sourceHeight) {
                  const scale = Math.min(1, 960/sourceWidth, 960/sourceHeight);
                  canvas.width = Math.max(1, Math.round(sourceWidth * scale));
                  canvas.height = Math.max(1, Math.round(sourceHeight * scale));
                  const context = canvas.getContext("2d", { willReadFrequently:true });
                  if (context) {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const image = context.getImageData(0, 0, canvas.width, canvas.height);
                    value = window.jsQR(image.data, image.width, image.height)?.data || "";
                  }
                }
              }
              if (value && value !== lastSeenRef.current) {
                lastSeenRef.current = value;
                await onReadRef.current(value);
              }
            } catch (_) {}
            detecting = false;
          }
          frameId = requestAnimationFrame(detect);
        };
        frameId = requestAnimationFrame(detect);
      } catch (err) {
        setCameraError(true);
        setCameraMessage(err && err.name === "NotAllowedError"
          ? "カメラを使えません。アドレス欄のカメラ設定を「許可」にして、もう一度押してください。"
          : "カメラを開けませんでした。ブラウザを開き直して、もう一度お試しください。");
      }
    };
    start();
    return () => {
      stopped = true;
      if (frameId) cancelAnimationFrame(frameId);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (videoRef.current) videoRef.current.srcObject = null;
    };
  }, [scanNonce]);

  const shownMessage = cameraMessage || message;
  const shownError = cameraError || error;
  return <>
    {cameraSupported && <div className="camera-box">
      <video ref={videoRef} playsInline muted />
      <canvas ref={scanCanvasRef} hidden aria-hidden="true" />
      <div className="camera-guide" />
    </div>}
    <div className={`scan-message${shownError?" error":""}`}>{shownMessage}</div>
    {cameraError && <div className="register-actions">
      <button type="button" className="ghost" onClick={() => setScanNonce(n => n+1)}>カメラをもう一度開く</button>
    </div>}
  </>;
}

function ItemRegistration({ onClose }){
  const [phase, setPhase] = useState("scan");
  const [editing, setEditing] = useState(false);
  const [items, setItems] = useState([]);
  const [scanMessage, setScanMessage] = useState("QR札を四角の中に入れてください。");
  const [scanError, setScanError] = useState(false);
  const [currentToken, setCurrentToken] = useState(null);
  const [name, setName] = useState("");
  const [itemAlpha, setItemAlpha] = useState(null);
  const [itemDigits, setItemDigits] = useState("");
  const [cost, setCost] = useState("");
  const [note, setNote] = useState("");
  const [photoDataUrl, setPhotoDataUrl] = useState("");
  const [photoBusy, setPhotoBusy] = useState(false);
  const [saveBusy, setSaveBusy] = useState(false);
  const [formMessage, setFormMessage] = useState(null);
  const [showAllNames, setShowAllNames] = useState(false);
  const [showAllCosts, setShowAllCosts] = useState(false);
  const [showAllAlphas, setShowAllAlphas] = useState(false);

  useEffect(() => {
    const cb = itemsRef.on("value", snap => {
      const val = snap.val() || {};
      setItems(Object.keys(val).map(token => ({ token, ...val[token] })));
    }, () => setScanMessage("商品データを読めませんでした。通信を確認して、画面を開き直してください。"));
    return () => itemsRef.off("value", cb);
  }, []);

  const names = useMemo(() => rankedItemValues(items, "name"), [items]);
  const costs = useMemo(() => rankedItemValues(items, "cost"), [items]);
  const itemAlphas = useMemo(() => {
    const fromItems = rankedItemValues(items, "itemNoAlpha");
    return [...new Set([...fromItems.filter(Boolean), ...INITIAL_ITEM_ALPHAS, ...LATIN_ITEM_ALPHAS])];
  }, [items]);
  const visibleNames = showAllNames ? names : names.slice(0,4);
  const visibleCosts = showAllCosts ? costs : costs.slice(0,4);

  const resetForm = () => {
    setEditing(false); setCurrentToken(null); setName(""); setItemAlpha(null); setItemDigits("");
    setCost(""); setNote(""); setPhotoDataUrl(""); setFormMessage(null);
  };

  const inspectToken = async rawValue => {
    const token = String(rawValue||"").trim().toUpperCase();
    if (!ITEM_TOKEN_RE.test(token)) {
      setScanError(true);
      setScanMessage("may's shopのQR札ではありません。別のQR札を読んでください。");
      return;
    }
    try {
      const [labelSnap, itemSnap, photoSnap] = await Promise.all([
        labelsRef.child(token).once("value"), itemsRef.child(token).once("value"),
        photosRef.child(token).once("value")
      ]);
      const label = labelSnap.val();
      const item = itemSnap.val();
      if (!label) {
        setScanError(true);
        setScanMessage("登録されていないQR札です。「ラベルを作る」で作った札か確認してください。");
        return;
      }
      if (item) {
        if (item.status !== "in_stock") {
          setScanError(true);
          setScanMessage(`${item.itemNo || "この商品"}として回収済みです。編集できません。`);
          return;
        }
        resetForm();
        setEditing(true);
        setCurrentToken(token);
        setName(item.name||"");
        setItemAlpha(item.itemNoAlpha===undefined || item.itemNoAlpha===null ? "" : String(item.itemNoAlpha));
        setItemDigits(item.itemNoNum===undefined || item.itemNoNum===null ? "" : String(item.itemNoNum));
        setCost(item.cost===undefined || item.cost===null ? "" : String(item.cost));
        setNote(item.note||"");
        setPhotoDataUrl((photoSnap.val()||{}).dataUrl||"");
        setScanError(false);
        setPhase("form");
        return;
      }
      if (label.status !== "unused") {
        setScanError(true);
        setScanMessage("登録済みのQR札です。別の札を読んでください。");
        return;
      }
      resetForm();
      setCurrentToken(token);
      setPhase("form");
    } catch (_) {
      setScanError(true);
      setScanMessage("QR札を確認できませんでした。通信を確認して、もう一度読んでください。");
    }
  };

  const choosePhoto = async event => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    setPhotoBusy(true);
    setFormMessage(null);
    try { setPhotoDataUrl(await photoToSmallDataUrl(file)); }
    catch (_) { setFormMessage({ error:true, text:"写真を読み込めませんでした。もう一度撮ってください。" }); }
    finally { setPhotoBusy(false); }
  };

  const saveItem = async () => {
    const itemNoNum = Number(itemDigits);
    if (!currentToken || !name.trim() || itemAlpha===null || itemNoNum<1 || itemNoNum>1000 || !photoDataUrl) {
      setFormMessage({ error:true, text:"商品名・札番・写真を確認してください。" });
      return;
    }
    const actualCost = cost === "" ? null : Number(cost);
    if (actualCost !== null && (!Number.isFinite(actualCost) || actualCost < 0)) {
      setFormMessage({ error:true, text:"原価は0以上の数字か、空欄にしてください。" });
      return;
    }
    setSaveBusy(true);
    setFormMessage(null);
    const itemNo = itemAlpha + itemNoNum;
    const itemFields = {
      itemNo, itemNoAlpha:itemAlpha, itemNoNum,
      name:name.trim(), cost:actualCost===null?null:Math.round(actualCost), costEstimated:false,
      note:note.trim()
    };
    try {
      const result = await itemsRef.child(currentToken).transaction(current => {
        if (editing) return current && current.status === "in_stock" ? {...current,...itemFields} : undefined;
        return current ? undefined : {...itemFields,status:"in_stock",
          createdAt:firebase.database.ServerValue.TIMESTAMP};
      }, undefined, false);
      if (!result.committed) {
        setFormMessage({ error:true, text:editing
          ? "この商品は回収済みになったため、変更を保存できません。"
          : "このQR札は別の端末で先に登録されました。別の札を読んでください。" });
        return;
      }
      const updates = {};
      updates[`photos/${currentToken}`] = { dataUrl:photoDataUrl };
      if (!editing) updates[`labels/${currentToken}/status`] = "used";
      await appRef.update(updates);
      const completedEditing = editing;
      resetForm();
      setScanError(false);
      setScanMessage(`${itemNo}を${completedEditing?"直しました":"保存しました"}。次のQR札を読んでください。`);
      setPhase("scan");
      requestAnimationFrame(() => window.scrollTo(0,0));
    } catch (_) {
      setFormMessage({ error:true, text:"保存できませんでした。通信を確認して、もう一度押してください。" });
    } finally { setSaveBusy(false); }
  };

  return <>
    {phase !== "scan" && <div className="register-head">
      <h2>QR・商品・原価を紐づける</h2>
      <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
    </div>}
    {phase === "scan" && <section className="register-panel qr-scan-panel">
      <div className="register-head qr-scan-head">
        <h2>QR・商品・原価を紐づける</h2>
        <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
      </div>
      <QrScanner onRead={inspectToken} message={scanMessage} error={scanError} />
    </section>}

    {phase === "form" && <section className="register-panel">
      <h3>{editing?"商品の内容を直す":"商品の内容"}</h3>
      <div className="scan-message">{editing?"登録済みの商品です。直したい内容を変更してください。":"未登録のQR札です。商品の内容を入れてください。"}</div>
      <div className="form-block">
        <label htmlFor="item-name">商品名</label>
        {names.length > 0 && <div className="chips">
          {visibleNames.map(value => <button type="button" className="chip" key={value}
            data-on={name===value?1:0} onClick={() => setName(value)}>{value}</button>)}
          {names.length>4 && <button type="button" className="chip more"
            onClick={() => setShowAllNames(v=>!v)}>{showAllNames?"閉じる":`ほか${names.length-4}`}</button>}
        </div>}
        <input id="item-name" className="name-entry" value={name} onChange={e=>setName(e.target.value)}
          placeholder="新しい商品名はここに入力" />
      </div>

      <div className="form-block">
        <span className="form-cap">札番の文字</span>
        <div className="chips">
          <button type="button" className="chip" data-on={itemAlpha===""?1:0}
            onClick={() => setItemAlpha("")}>文字なし</button>
          {(showAllAlphas ? itemAlphas : itemAlphas.slice(0,6)).map(value => <button type="button" className="chip" key={value}
            data-on={itemAlpha===value?1:0} onClick={() => setItemAlpha(value)}>{value}</button>)}
          {itemAlphas.length>6 && <button type="button" className="chip more"
            onClick={() => setShowAllAlphas(v=>!v)}>{showAllAlphas?"閉じる":`ほか${itemAlphas.length-6}`}</button>}
        </div>
        <span className="form-cap">札番の数字（1〜1000）</span>
        <div className="number-display">
          {itemAlpha===null ? <span className="muted">文字</span>
            : itemAlpha==="" ? <span>文字なし</span> : itemAlpha}
          {itemDigits || <span className="muted">数字</span>}
        </div>
        <DigitPad value={itemDigits} onChange={setItemDigits} maxValue={1000} maxDigits={4} />
      </div>

      <div className="form-block">
        <span className="form-cap">原価（分からなければ空欄）</span>
        {costs.length > 0 && <div className="chips">
          {visibleCosts.map(value => <button type="button" className="chip" key={value}
            data-on={cost===value?1:0} onClick={() => setCost(value)}>{yen(Number(value))}円</button>)}
          {costs.length>4 && <button type="button" className="chip more"
            onClick={() => setShowAllCosts(v=>!v)}>{showAllCosts?"閉じる":`ほか${costs.length-4}`}</button>}
        </div>}
        <div className="number-display">{cost ? `${yen(Number(cost))}円` : <span className="muted">分からなければ空欄</span>}</div>
        <DigitPad value={cost} onChange={setCost} maxValue={999999} maxDigits={6} />
      </div>

      <div className="form-block">
        <div className="f"><label htmlFor="item-note">メモ（任意）</label>
          <input id="item-note" value={note} onChange={e=>setNote(e.target.value)} /></div>
      </div>

      <div className="form-block">
        <span className="form-cap">写真（必須）</span>
        <label className="photo-button">{photoBusy?"写真を整えています…":photoDataUrl?"写真を撮り直す":"写真を撮る"}
          <input className="file-input" type="file" accept="image/*" capture="environment"
            disabled={photoBusy} onChange={choosePhoto} />
        </label>
        {photoDataUrl && <img className="photo-preview" src={photoDataUrl} alt="登録する商品の写真" />}
      </div>

      {formMessage && <div className={`label-message${formMessage.error?" error":""}`}>{formMessage.text}</div>}
      <div className="register-actions">
        <button type="button" className="ghost" disabled={saveBusy} onClick={() => {
          resetForm(); setPhase("scan"); requestAnimationFrame(() => window.scrollTo(0,0));
        }}>この札をやめる</button>
        <button type="button" className="primary" disabled={saveBusy || photoBusy} onClick={saveItem}>
          {saveBusy?"保存しています…":editing?"変更して次のQR札へ":"保存して次のQR札へ"}
        </button>
      </div>
    </section>}
  </>;
}

function QrLookup({ onClose }){
  const [result, setResult] = useState(null);
  const [scanMessage, setScanMessage] = useState("調べたい商品のQR札を四角の中に入れてください。");
  const [scanError, setScanError] = useState(false);
  const [confirmReuse, setConfirmReuse] = useState(false);
  const [reuseBusy, setReuseBusy] = useState(false);

  const inspectToken = async rawValue => {
    const token = String(rawValue||"").trim().toUpperCase();
    if (!ITEM_TOKEN_RE.test(token)) {
      setResult({ error:true, message:"may's shopのQR札ではありません。別のQR札を読んでください。" });
      return;
    }
    try {
      const [labelSnap,itemSnap,photoSnap,historySnap,allLabelsSnap] = await Promise.all([
        labelsRef.child(token).once("value"), itemsRef.child(token).once("value"),
        photosRef.child(token).once("value"), appRef.child(`itemHistory/${token}`).once("value"),
        labelsRef.once("value")
      ]);
      const label=labelSnap.val(), item=itemSnap.val(), photo=photoSnap.val();
      const historyRaw=historySnap.val()||{};
      const history=Object.keys(historyRaw).sort().reverse().map(key => {
        const old=historyRaw[key]||{};
        return { key,name:old.name||"商品名なし",itemNo:old.itemNo||"記録なし",
          collectedAt:old.archivedAt,
          cost:Number.isFinite(Number(old.cost))?Number(old.cost):null };
      });
      if (!label) {
        setResult({ error:true, message:"登録されていないQR札です。" });
        return;
      }
      const allLabels=allLabelsSnap.val()||{};
      const stableLabels=labelsWithStableSlots(Object.keys(allLabels).map(labelToken =>
        ({token:labelToken,...allLabels[labelToken]})));
      const stableLabel=stableLabels.find(value => value.token===token) || {token,...label};
      const labelId=labelPositionId(stableLabel,alphaSheetIndexes(stableLabels));
      if (!item) {
        setResult({ token,label:stableLabel,labelId,history,message:"まだ商品が登録されていないQR札です。" });
        return;
      }
      /* 渡す項目は明示する。原価はこのアプリの目的そのものなので、ここでは出す。 */
      const shownItem = { name:item.name||"", itemNo:item.itemNo||"", cost:item.cost,
        note:item.note||"", createdAt:item.createdAt, status:item.status };
      setResult({ token,label:stableLabel,labelId,item:shownItem,history,
        photoDataUrl:(photo||{}).dataUrl||"", collected:item.status !== "in_stock" });
    } catch (_) {
      setResult({ error:true, message:"QR札を確認できませんでした。通信を確認して、もう一度読んでください。" });
    }
  };

  const readNext = () => {
    setResult(null);
    setConfirmReuse(false);
    setScanError(false);
    setScanMessage("調べたい商品のQR札を四角の中に入れてください。");
    requestAnimationFrame(() => window.scrollTo(0,0));
  };

  const reuseLabel = async () => {
    if (!result || !result.token || !result.collected || reuseBusy) return;
    setReuseBusy(true);
    const token=result.token, archivedAt=Date.now(), reuseLock=makeLocalId("REUSE");
    try {
      const claim=await itemsRef.child(token).transaction(current => {
        /* QrLookup は items を常時購読しないため、初回のローカル値が null の場合は
           仮値を返してサーバー値との再試行へ進ませる。実在しなければ直後に除去する。 */
        if (!current) return {reuseLock,reusePlaceholder:true};
        if (current.status==="in_stock" || current.reuseLock) return;
        return {...current,reuseLock};
      }, undefined, false);
      const claimed=claim.snapshot&&claim.snapshot.val();
      if (!claim.committed || !claimed || claimed.reuseLock!==reuseLock || claimed.reusePlaceholder) throw new Error("reuse-conflict");
      const [labelSnap,photoSnap,historySnap]=await Promise.all([
        labelsRef.child(token).once("value"),photosRef.child(token).once("value"),
        appRef.child(`itemHistory/${token}`).once("value")
      ]);
      const label=labelSnap.val();
      if (!label) throw new Error("missing-label");
      const history=historySnap.val()||{};
      const historyNo=Math.max(0,...Object.keys(history).map(key=>Number(key)||0))+1;
      const historyKey=String(historyNo).padStart(4,"0");
      const {reuseLock:unusedLock,...archivedItem}=claimed;
      const updates={
        [`itemHistory/${token}/${historyKey}`]:{...archivedItem,archivedAt},
        [`items/${token}`]:null,[`photos/${token}`]:null,
        [`labels/${token}/status`]:"unused"
      };
      const photo=photoSnap.val();
      if (photo) updates[`photoHistory/${token}/${historyKey}`]=photo;
      await appRef.update(updates);
      setResult({ message:"この札を、新しい商品に使える状態へ戻しました。これまでの記録は残っています。" });
      setConfirmReuse(false);
    } catch (_) {
      await itemsRef.child(token).transaction(current => {
        if (!current || current.reuseLock!==reuseLock) return current;
        if (current.reusePlaceholder) return null;
        const {reuseLock:unusedLock,...rest}=current;
        return rest;
      }, undefined, false).catch(() => {});
      setResult(current => ({...current,error:true,reuseError:"札を未使用へ戻せませんでした。通信を確認して、もう一度押してください。"}));
    } finally { setReuseBusy(false); }
  };

  return <>
    {result && <div className="register-head">
      <h2>QRを調べる</h2>
      <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
    </div>}
    {!result && <section className="register-panel qr-scan-panel">
      <div className="register-head qr-scan-head">
        <h2>QRを調べる</h2>
        <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
      </div>
      <QrScanner onRead={inspectToken} message={scanMessage} error={scanError} />
    </section>}
    {result && <section className={`lookup-result${result.error?" error":""}`}>
      {result.labelId && <div className="lookup-label-id">ラベル {result.labelId}</div>}
      {result.message ? <h3>{result.message}</h3> : <>
        {result.photoDataUrl && <img className="lookup-photo" src={result.photoDataUrl} alt={result.item.name||"商品の写真"} />}
        <div className={`lookup-status${result.collected?" sold":""}`}>{result.collected?"回収済み":"在庫あり"}</div>
        <h3>{result.item.name||"商品名なし"}</h3>
        <dl className="lookup-details">
          <dt>札番</dt><dd>{result.item.itemNo||"記録なし"}</dd>
          <dt>原価</dt><dd>{Number.isFinite(Number(result.item.cost)) ? `${yen(Number(result.item.cost))}円` : "記録なし"}</dd>
          <dt>登録日</dt><dd>{lookupDateText(result.item.createdAt)}</dd>
          {result.item.note && <><dt>メモ</dt><dd>{result.item.note}</dd></>}
        </dl>
      </>}
      {!!(result.history&&result.history.length) && <div className="lookup-history">
        <h3>この札で過去に使った商品</h3>
        {result.history.map(old => <div className="lookup-history-item" key={old.key}>
          <b>{old.name}</b><span>札番 {old.itemNo}</span>
          <span>{lookupDateText(old.collectedAt)}{old.cost===null?"":`　原価 ${yen(old.cost)}円`}</span>
        </div>)}
      </div>}
      {result.collected && !confirmReuse && <button type="button" className="ghost danger-text reuse-label" onClick={() => setConfirmReuse(true)}>この札を使い回す</button>}
      {result.collected && confirmReuse && <div className="reuse-confirm">
        <p>この札を、新しい商品に使えるようにします。これまでの記録は残ります。よろしいですか？</p>
        <div className="register-actions">
          <button type="button" className="ghost" disabled={reuseBusy} onClick={() => setConfirmReuse(false)}>やめる</button>
          <button type="button" className="danger" disabled={reuseBusy} onClick={reuseLabel}>{reuseBusy?"処理しています…":"未使用へ戻す"}</button>
        </div>
      </div>}
      {result.reuseError && <div className="label-message error">{result.reuseError}</div>}
      <button type="button" className="primary" onClick={readNext}>次を読む</button>
    </section>}
  </>;
}

/* ==================== 回収したQRを読み込む ====================
   売れて外した札を箱にためておき、あとでまとめて読む。読んだ札は
   原価を集計して itemHistory へ移し、ラベルは未使用に戻して使い回す。
   売った値段は扱わない。レジはエアレジで、売上は手入力が正。 */
function CollectTags({ onClose }){
  const [pending, setPending] = useState([]);
  const [date, setDate] = useState(() => localDateKey());
  const [note, setNote] = useState("");
  const [scanMessage, setScanMessage] = useState("外した札を、四角の中に1枚ずつ入れてください。");
  const [scanError, setScanError] = useState(false);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const pendingRef = useRef(pending);
  pendingRef.current = pending;

  const addToken = async rawValue => {
    const token = String(rawValue||"").trim().toUpperCase();
    if (!ITEM_TOKEN_RE.test(token)) {
      setScanError(true);
      setScanMessage("may's shopのQR札ではありません。次の札を読んでください。");
      return;
    }
    if (pendingRef.current.some(entry => entry.token === token)) {
      setScanError(false);
      setScanMessage("この札はもう読んでいます。次の札を読んでください。");
      return;
    }
    try {
      const [itemSnap, historySnap] = await Promise.all([
        itemsRef.child(token).once("value"),
        appRef.child(`itemHistory/${token}`).once("value")
      ]);
      const item = itemSnap.val();
      if (!item) {
        setScanError(true);
        setScanMessage("この札には商品が登録されていません。次の札を読んでください。");
        return;
      }
      const history = historySnap.val() || {};
      const historyNo = Math.max(0, ...Object.keys(history).map(key => Number(key)||0)) + 1;
      setPending(list => [...list, { token, item, historyKey:String(historyNo).padStart(4,"0") }]);
      setScanError(false);
      setScanMessage(`${item.itemNo || "この商品"}を入れました。次の札を読んでください。`);
    } catch (_) {
      setScanError(true);
      setScanMessage("札を確認できませんでした。通信を確認して、もう一度読んでください。");
    }
  };

  const drop = token => setPending(list => list.filter(entry => entry.token !== token));

  const knownCost = entry => {
    const value = entry.item.cost;
    return value===null || value===undefined || value==="" ? null : Number(value);
  };
  const totalCost = pending.reduce((sum,entry) => sum + (knownCost(entry)||0), 0);
  const unknownCostCount = pending.filter(entry => knownCost(entry)===null).length;

  const save = async () => {
    if (!pending.length || busy || !date) return;
    setBusy(true);
    try {
      const collectionId = collectionsRef.push().key;
      const collectedAt = Date.now();
      const items = {};
      const updates = {};
      pending.forEach(entry => {
        const { token, item, historyKey } = entry;
        items[token] = { name:item.name||"", itemNo:item.itemNo||"",
          itemNoAlpha:item.itemNoAlpha||"", itemNoNum:item.itemNoNum||null,
          cost:knownCost(entry), registeredAt:item.createdAt||null };
        /* 写真はここで捨てる。まとめて履歴へ写すと1回の書き込みが重くなりすぎる。 */
        updates[`itemHistory/${token}/${historyKey}`] = { ...item, archivedAt:collectedAt, collectionId };
        updates[`items/${token}`] = null;
        updates[`photos/${token}`] = null;
        updates[`labels/${token}/status`] = "unused";
      });
      updates[`collections/${collectionId}`] = { collectedAt, date, note:note.trim(),
        count:pending.length, totalCost, unknownCostCount, deviceId:DEVICE_ID, items };
      await appRef.update(updates);
      setDone({ count:pending.length, totalCost, unknownCostCount });
      setPending([]);
      setNote("");
      setScanError(false);
      setScanMessage("外した札を、四角の中に1枚ずつ入れてください。");
    } catch (_) {
      setScanError(true);
      setScanMessage("記録できませんでした。通信を確認して、もう一度押してください。");
    } finally { setBusy(false); }
  };

  if (done) return <>
    <div className="register-head">
      <h2>回収したQRを読み込む</h2>
      <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
    </div>
    <section className="lookup-result">
      <h3>記録しました</h3>
      <div className="collect-summary">
        <div><span>点数</span><b>{done.count}点</b></div>
        <div><span>原価の合計</span><b>{yen(done.totalCost)}円</b></div>
        {done.unknownCostCount>0 && <div className="warn-line">
          <span>原価が分からない札</span><b>{done.unknownCostCount}点</b></div>}
      </div>
      <p className="collect-note">この札は、また新しい商品に使えます。</p>
      <button type="button" className="primary" onClick={() => setDone(null)}>続けて回収する</button>
    </section>
  </>;

  return <>
    <section className="register-panel qr-scan-panel">
      <div className="register-head qr-scan-head">
        <h2>回収したQRを読み込む</h2>
        <button type="button" className="ghost" onClick={onClose}>売上表へ戻る</button>
      </div>
      <QrScanner onRead={addToken} message={scanMessage} error={scanError} />
    </section>

    <section className="collect-panel">
      <div className="collect-summary">
        <div><span>読んだ札</span><b>{pending.length}点</b></div>
        <div><span>原価の合計</span><b>{yen(totalCost)}円</b></div>
        {unknownCostCount>0 && <div className="warn-line">
          <span>原価が分からない札</span><b>{unknownCostCount}点</b></div>}
      </div>

      {pending.length===0
        ? <p className="collect-note">まだ1枚も読んでいません。</p>
        : <div className="collect-list">
            {pending.map(entry => <div className="collect-row" key={entry.token}>
              <span className="collect-no">{entry.item.itemNo||"札番なし"}</span>
              <span className="collect-name">{entry.item.name||"商品名なし"}</span>
              <span className="collect-cost">{knownCost(entry)===null ? "原価なし" : `${yen(knownCost(entry))}円`}</span>
              <button type="button" className="ghost" onClick={() => drop(entry.token)}>外す</button>
            </div>)}
          </div>}

      <div className="grid">
        <div className="f"><label htmlFor="collect-date">日付</label>
          <input id="collect-date" type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
        <div className="f wide"><label htmlFor="collect-note">メモ（任意）</label>
          <span className="reconcile-note">「6/27 東本願寺」など、あとで見て分かる言葉を</span>
          <input id="collect-note" value={note} onChange={e=>setNote(e.target.value)} /></div>
      </div>

      <button type="button" className="primary collect-save" disabled={busy||!pending.length||!date}
        onClick={save}>{busy?"記録しています…":`この${pending.length}点を記録する`}</button>
    </section>
  </>;
}

/* ======================== 回収の一覧 ======================== */
const collectionDateText = value => {
  const parts = String(value||"").split("-");
  return parts.length===3 ? `${Number(parts[1])}/${Number(parts[2])}` : "日付なし";
};

/* 回収をまるごと取り消す。札がもう新しい商品に使われていたら、
   上書きしてしまうので何もせずに断る。写真は回収時に消しているので戻らない。 */
async function undoCollection(id, entry){
  const tokens = Object.keys(entry.items||{});
  const snaps = await Promise.all(tokens.flatMap(token => [
    itemsRef.child(token).once("value"),
    appRef.child(`itemHistory/${token}`).once("value")
  ]));
  const used = [], updates = {};
  tokens.forEach((token, index) => {
    const current = snaps[index*2].val();
    const history = snaps[index*2+1].val() || {};
    if (current) { used.push(entry.items[token].itemNo || token); return; }
    const key = Object.keys(history).find(k => (history[k]||{}).collectionId === id);
    if (!key) { used.push(entry.items[token].itemNo || token); return; }
    const { archivedAt, collectionId, ...item } = history[key];
    updates[`items/${token}`] = item;
    updates[`itemHistory/${token}/${key}`] = null;
    updates[`labels/${token}/status`] = "used";
  });
  if (used.length) return { ok:false, used };
  updates[`collections/${id}`] = null;
  await appRef.update(updates);
  return { ok:true };
}

function Collections({ collections }){
  const [openId, setOpenId] = useState(null);
  const [editId, setEditId] = useState(null);
  const [editNote, setEditNote] = useState("");
  const [editDate, setEditDate] = useState("");
  const [undoId, setUndoId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState(null);

  const startEdit = entry => {
    setUndoId(null); setMessage(null);
    setEditId(entry.id); setEditNote(entry.note||""); setEditDate(entry.date||"");
  };

  const saveEdit = async id => {
    if (busy || !editDate) return;
    setBusy(true); setMessage(null);
    try {
      await collectionsRef.child(id).update({ note:editNote.trim(), date:editDate });
      setEditId(null);
    } catch (_) {
      setMessage({ error:true, text:"直せませんでした。通信を確認して、もう一度押してください。" });
    } finally { setBusy(false); }
  };

  const runUndo = async entry => {
    if (busy) return;
    setBusy(true); setMessage(null);
    try {
      const result = await undoCollection(entry.id, entry);
      if (result.ok) { setUndoId(null); setOpenId(null); setMessage({ error:false, text:"回収を取り消しました。札は元の商品に戻っています。" }); }
      else setMessage({ error:true, text:`${result.used.join("・")} の札は、もう新しい商品に使われています。この回収は取り消せません。` });
    } catch (_) {
      setMessage({ error:true, text:"取り消せませんでした。通信を確認して、もう一度押してください。" });
    } finally { setBusy(false); }
  };

  const months = useMemo(() => {
    const list = Object.keys(collections).map(id => ({ id, ...collections[id] }))
      .sort((a,b) => (Number(b.collectedAt)||0)-(Number(a.collectedAt)||0));
    const byMonth = [];
    list.forEach(entry => {
      const key = String(entry.date||"").slice(0,7) || "日付なし";
      let group = byMonth.find(m => m.key===key);
      if (!group) byMonth.push(group = { key, rows:[], cost:0, count:0, unknown:0 });
      group.rows.push(entry);
      group.cost += Number(entry.totalCost)||0;
      group.count += Number(entry.count)||0;
      group.unknown += Number(entry.unknownCostCount)||0;
    });
    return byMonth;
  }, [collections]);

  if (!months.length) return <div className="empty">
    まだ回収がありません。売れて外した札を読むと、ここに出ます。
  </div>;

  return <div className="collection-log">
    {message && <div className={`label-message${message.error?" error":""}`}>{message.text}</div>}
    {months.map(month => <div className="collection-month" key={month.key}>
      <div className="collection-monthhead">
        <b>{month.key==="日付なし" ? "日付なし" : `${Number(month.key.slice(0,4))}年${Number(month.key.slice(5,7))}月`}</b>
        <span>{month.count}点</span>
        <span className="collection-monthcost">原価 {yen(month.cost)}円</span>
      </div>
      {month.rows.map(entry => {
        const open = openId===entry.id;
        const items = Object.keys(entry.items||{}).map(token => ({ token, ...entry.items[token] }));
        return <div className="collection-card" key={entry.id}>
          <button type="button" className="collection-head" aria-expanded={open}
            onClick={() => setOpenId(open ? null : entry.id)}>
            <span className="collection-date">{collectionDateText(entry.date)}</span>
            <span className="collection-note">{entry.note || "メモなし"}</span>
            <span className="collection-count">{entry.count}点</span>
            <span className="collection-cost">{yen(Number(entry.totalCost)||0)}円</span>
            <span className="caret">{open?"▾":"▸"}</span>
          </button>
          {Number(entry.unknownCostCount)>0 &&
            <div className="collection-unknown">原価が分からない札 {entry.unknownCostCount}点</div>}
          {open && <div className="collection-items">
            {items.map(item => <div className="collect-row" key={item.token}>
              <span className="collect-no">{item.itemNo||"札番なし"}</span>
              <span className="collect-name">{item.name||"商品名なし"}</span>
              <span className="collect-cost">
                {item.cost===null||item.cost===undefined ? "原価なし" : `${yen(Number(item.cost))}円`}</span>
            </div>)}

            {editId===entry.id ? <div className="collection-edit">
              <div className="f"><label>日付</label>
                <input type="date" value={editDate} onChange={e=>setEditDate(e.target.value)} /></div>
              <div className="f"><label>メモ</label>
                <input value={editNote} onChange={e=>setEditNote(e.target.value)} /></div>
              <div className="register-actions">
                <button type="button" className="ghost" disabled={busy} onClick={() => setEditId(null)}>やめる</button>
                <button type="button" className="primary" disabled={busy||!editDate}
                  onClick={() => saveEdit(entry.id)}>{busy?"保存しています…":"保存"}</button>
              </div>
            </div>
            : undoId===entry.id ? <div className="collection-undo">
              <p>
                この回収をなかったことにします。{entry.count}点の札は、それぞれ元の商品に戻ります。
                <b>ただし写真は戻りません。</b>もう一度撮り直してください。
              </p>
              <div className="register-actions">
                <button type="button" className="ghost" disabled={busy} onClick={() => setUndoId(null)}>やめる</button>
                <button type="button" className="danger" disabled={busy}
                  onClick={() => runUndo(entry)}>{busy?"取り消しています…":"取り消す"}</button>
              </div>
            </div>
            : <div className="collection-actions">
              <button type="button" className="ghost" onClick={() => startEdit(entry)}>日付・メモを直す</button>
              <button type="button" className="ghost danger-text"
                onClick={() => { setEditId(null); setMessage(null); setUndoId(entry.id); }}>この回収を取り消す</button>
            </div>}
          </div>}
        </div>;
      })}
    </div>)}
  </div>;
}

/* ======================== 控えを保存する ======================== */
const EXPORT_NODE_NAMES = ["events","settlements","labels","items","itemHistory","collections","settings"];
const APP_PUBLIC_URL = "https://nana-keke.github.io/kakeibo-family/mays-shop.html";

function csvCell(value){
  if (value === null || value === undefined) return "";
  let text = String(value);
  if (typeof value === "string" && /^[=+\-@]/.test(text)) text = `'${text}`;
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g,'""')}"` : text;
}

function csvText(headers, rows){
  return "\uFEFF" + [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n");
}

function dateTimeText(value){
  const number = Number(value);
  return number ? new Date(number).toLocaleString("ja-JP") : "";
}

async function loadExportData(){
  const snapshots = await Promise.all(EXPORT_NODE_NAMES.map(name => appRef.child(name).once("value")));
  const data = {};
  EXPORT_NODE_NAMES.forEach((name,index) => { data[name]=snapshots[index].val()||{}; });
  return data;
}

function createExportFiles(data){
  const exportedAt = new Date();
  const events = data.events||{}, items=data.items||{}, collections=data.collections||{};
  const itemRows = Object.keys(items).map(token => ({token,...items[token]}))
    .sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0)).map(item => [
      item.token,item.itemNo,item.itemNoAlpha||"",item.itemNoNum,item.name,
      item.cost===null||item.cost===undefined?"":item.cost,item.costEstimated?"目安":"",
      dateTimeText(item.createdAt),item.note||""
    ]);
  /* 回収は1行1点。まとまりの名前とあわせて出す。 */
  const collectionRows = Object.keys(collections)
    .map(id => ({id,...collections[id]}))
    .sort((a,b)=>(Number(a.collectedAt)||0)-(Number(b.collectedAt)||0))
    .flatMap(collection => Object.keys(collection.items||{}).map(token => {
      const entry = collection.items[token]||{};
      const cost = entry.cost===null || entry.cost===undefined ? "" : Number(entry.cost);
      return [collection.id,collection.date||"",collection.note||"",
        dateTimeText(collection.collectedAt),token,entry.itemNo||"",entry.name||"",cost];
    }));
  const eventRows = Object.keys(events).map(id => ({id,...events[id]}))
    .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))).map(event => [
      event.id,event.date,event.venue,event.organizer||"",event.fee||0,event.transit||0,event.material||0,
      event.cash||0,event.credit||0,event.paypay||0,event.note||""
    ]);

  const itemsCsv = csvText(
    ["商品ID","札番","文字","番号","商品名","原価","原価区分","登録日","メモ"], itemRows);
  const collectionsCsv = csvText(
    ["回収ID","日付","メモ","読み取った日時","商品ID","札番","商品名","原価"], collectionRows);
  const eventsCsv = csvText(
    ["出店ID","日付","会場","主催者","出店料","交通費","材料費","現金売上","カード売上","PayPay売上","メモ"], eventRows);
  const json = JSON.stringify({
    format:"may's shop 控え v2", exportedAt:exportedAt.toISOString(), appUrl:APP_PUBLIC_URL,
    note:"写真データは意図的に含めていません。", detenLedger:data
  }, null, 2);
  const readme = `may's shop データの控え\r\n\r\n`+
    `これはハンドメイド商品の登録、原価、札の回収、出店、入金記録の控えです。\r\n`+
    `書き出した日：${exportedAt.toLocaleString("ja-JP")}\r\n`+
    `アプリ：${APP_PUBLIC_URL}\r\n\r\n`+
    `【ファイルの説明】\r\n`+
    `商品.csv：いま札が付いている商品です。商品名、札番、原価、登録日。\r\n`+
    `回収.csv：売れて外した札をまとめて読み取った記録です。1行が1点。\r\n`+
    `出店.csv：出店日、会場、経費、売上です。すべて手で入れた数字です。\r\n`+
    `全データ.json：写真以外の全記録です。復元や詳しい確認に使います。\r\n`+
    `はじめにお読みください.txt：この説明です。\r\n\r\n`+
    `【大切なこと】\r\n`+
    `このアプリは売る瞬間を記録しません。レジはエアレジです。\r\n`+
    `原価は、札を回収したときの値をコピーしています。後で商品を直しても、回収済みの記録は変わりません。\r\n`+
    `原価が空欄の商品は、紙の記録が残っていない古い在庫など、原価が分からない商品です。\r\n`+
    `売った値段は記録していません。現場で変わるためです。売上は出店.csvの手入力が正です。\r\n`+
    `カードとPayPayの売上は、手数料などが引かれて後日入金されます。\r\n`+
    `札は使い回します。同じ札番でも、回収した時期が違えば別の商品です。\r\n`+
    `写真は容量が大きく共有に失敗しやすいため、この控えには含めていません。\r\n`;
  const options = type => ({type});
  return [
    new File([itemsCsv],"商品.csv",options("text/csv;charset=utf-8")),
    new File([collectionsCsv],"回収.csv",options("text/csv;charset=utf-8")),
    new File([eventsCsv],"出店.csv",options("text/csv;charset=utf-8")),
    new File([json],"全データ.json",options("application/json;charset=utf-8")),
    new File([readme],"はじめにお読みください.txt",options("text/plain;charset=utf-8"))
  ];
}

function downloadExportFiles(files){
  files.forEach((file,index) => {
    const url=URL.createObjectURL(file), link=document.createElement("a");
    link.href=url;link.download=file.name;link.style.display="none";document.body.appendChild(link);
    setTimeout(()=>{link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);},index*250);
  });
}

function RecordsExport({ compact=false }){
  const [busy,setBusy]=useState(false);
  const [prepared,setPrepared]=useState(null);
  const [message,setMessage]=useState(null);

  const save = async () => {
    if (busy) return;
    setBusy(true);setMessage(null);
    try {
      const alreadyPrepared=!!prepared;
      const files=prepared||createExportFiles(await loadExportData());
      setPrepared(files);
      let shareable=!!navigator.share;
      try { if (shareable && navigator.canShare) shareable=navigator.canShare({files}); }
      catch (_) { shareable=false; }
      if (shareable) {
        try {
          await navigator.share({title:"may's shop データの控え",text:"may's shop の全期間の控えです。",files});
          setMessage({error:false,text:"共有先へ控えを渡しました。"});setPrepared(null);
        } catch (err) {
          if (err && err.name==="AbortError") setMessage({error:false,text:"共有をやめました。控えはまだ送られていません。"});
          else if (err && err.name==="NotAllowedError") setMessage({error:false,text:"控えの準備ができました。もう一度「控えを保存する」を押してください。"});
          else throw err;
        }
      } else {
        if (!alreadyPrepared) {
          setMessage({error:false,text:"控えの準備ができました。もう一度「控えを保存する」を押すと、端末へ保存します。"});
          return;
        }
        downloadExportFiles(files);setPrepared(null);
        setMessage({error:false,text:"5つのファイルを保存しました。端末のダウンロードをご確認ください。"});
      }
    } catch (_) {
      setMessage({error:true,text:"控えを作れませんでした。通信を確認して、もう一度押してください。"});
    } finally {setBusy(false);}
  };
  return <div className={`records-export${compact?" compact":""}`}>
    <p>写真を除く全期間の記録を、家族やGoogleドライブへ残せます。</p>
    <button type="button" className="ghost" disabled={busy} onClick={save}>{busy?"控えを作っています…":"控えを保存する"}</button>
    {message&&<div className={`export-message${message.error?" error":""}`}>{message.text}</div>}
  </div>;
}

/* ============================ App ============================ */
function App(){
  const [events, setEvents] = useState([]);
  const [settlements, setSettlements] = useState([]);
  const [collections, setCollections] = useState({});
  const [tab, setTab] = useState("log");
  const [screen, setScreen] = useState("ledger");
  const [picked, setPicked] = useState(null);   // 長押しで選ばれた出店（編集シート用）

  useEffect(() => {
    if (!["register","lookup","collect"].includes(screen)) return;
    requestAnimationFrame(() => window.scrollTo(0,0));
  }, [screen]);

  useEffect(() => {
    if (!live) return;
    const cb = eventsRef.on("value", snap => {
      const val = snap.val() || {};
      setEvents(Object.keys(val).map(k => ({ id:k, settled:{}, ...val[k] })));
    }, err => console.error("読み込みに失敗しました", err));
    return () => eventsRef.off("value", cb);
  }, []);

  useEffect(() => {
    if (!live) return;
    const cb = settlementsRef.on("value", snap => {
      const val = snap.val() || {};
      setSettlements(Object.keys(val).map(k => ({ id:k, ...val[k] })));
    }, err => console.error("入金の読み込みに失敗しました", err));
    return () => settlementsRef.off("value", cb);
  }, []);

  useEffect(() => {
    if (!live) return;
    const cb = collectionsRef.on("value", snap => setCollections(snap.val()||{}),
      err => console.error("回収の読み込みに失敗しました", err));
    return () => collectionsRef.off("value", cb);
  }, []);

  const add = e => {
    if (live) eventsRef.child(e.id).set(e).catch(err => console.error("保存に失敗しました", err));
    else setEvents(p => [...p, e]);
  };

  const addSettlement = s => {
    if (live) settlementsRef.child(s.id).set(s).catch(err => console.error("保存に失敗しました", err));
    else setSettlements(p => [...p, s]);
  };

  /* 消込：イベント側の settled と settlement 側の eventIds を一度に書く。
     settled には settlementId を入れる。手動の「入金済に」が入れる日付文字列も
     引き続き消込済みとして読めるよう、読み側は truthy 判定のままにしてある。 */
  const applySettlement = (stl, ids) => {
    if (live) {
      const up = {};
      ids.forEach(id => { up[`events/${id}/settled/${stl.method}`] = stl.id; });
      up[`settlements/${stl.id}/eventIds`] = ids;
      up[`settlements/${stl.id}/matched`]  = true;
      appRef.update(up).catch(err => console.error("消込に失敗しました", err));
    } else {
      setEvents(p => p.map(e => ids.includes(e.id)
        ? { ...e, settled:{ ...(e.settled||{}), [stl.method]: stl.id } } : e));
      setSettlements(p => p.map(s => s.id===stl.id ? { ...s, eventIds:ids, matched:true } : s));
    }
  };

  /* 編集：既存フィールドだけ書き換える（settled は触らない） */
  const updateEvent = (id, patch) => {
    if (live) eventsRef.child(id).update(patch).catch(err => console.error("更新に失敗しました", err));
    else setEvents(p => p.map(e => e.id===id ? { ...e, ...patch } : e));
    setPicked(null);
  };

  const removeEvent = id => {
    if (live) eventsRef.child(id).remove().catch(err => console.error("削除に失敗しました", err));
    else setEvents(p => p.filter(e => e.id !== id));
    setPicked(null);
  };

  /* 選んだ分をまとめて消し込む。1回の update にするので、
     途中で通信が切れて半分だけ済みになることがない。 */
  const settleMany = (ids, method) => {
    if (!ids.length) return;
    const today = new Date().toISOString().slice(0,10);
    if (live) {
      const up = {};
      ids.forEach(id => { up[`${id}/settled/${method}`] = today; });
      eventsRef.update(up).catch(err => alert("保存できませんでした: " + err.message));
    } else {
      const s = new Set(ids);
      setEvents(p => p.map(e => s.has(e.id)
        ? { ...e, settled:{ ...(e.settled||{}), [method]: today } } : e));
    }
  };

  const pickedEvent = picked && (events.find(event => event.id===picked.id)||picked);

  const pending = useMemo(() =>
    events.reduce((s,e) =>
      s + RECEIVABLE.filter(m => (e[m.key]||0)>0 && !(e.settled||{})[m.key]).length, 0)
  , [events]);

  const venues     = useMemo(() => optionsOf(events, "venue"),     [events]);
  const organizers = useMemo(() =>
    withSeeds(optionsOf(events, "organizer"), ORGANIZER_SEEDS), [events]);

  if (screen === "register") return (
    <div className="wrap qr-reader-screen">
      <ItemRegistration onClose={() => setScreen("ledger")} />
    </div>
  );

  if (screen === "collect") return (
    <div className="wrap qr-reader-screen">
      <CollectTags onClose={() => setScreen("ledger")} />
    </div>
  );

  if (screen === "lookup") return (
    <div className="wrap qr-reader-screen">
      <QrLookup onClose={() => setScreen("ledger")} />
    </div>
  );

  if (screen === "labels") return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span><span className="sub">ラベル</span>
      </header>
      <LabelMaker onClose={() => setScreen("ledger")} />
    </div>
  );

  return (
    <div className="wrap">
      <header className="masthead">
        <span className="title">may's shop</span>
        <span className="sub">売上表</span>
      </header>
      <div className="modeline">
        {live ? "Firebase に同期中" : "お試しモード：この画面を閉じると記録は消えます"}
      </div>
      <div className="home-actions">
        <button type="button" className="primary home-register" onClick={() => setScreen("register")}>QR・商品・原価を紐づける</button>
      </div>
      <div className="home-actions">
        <button type="button" className="primary home-register" onClick={() => setScreen("collect")}>回収したQRを読み込む</button>
      </div>
      <div className="utility-row">
        <button type="button" className="ghost" onClick={() => setScreen("lookup")}>QRを調べる</button>
        <button type="button" className="ghost" onClick={() => setScreen("labels")}>ラベルを作る</button>
        <RecordsExport compact />
      </div>

      <nav className="tabs">
        <button data-on={tab==="log"?1:0} onClick={() => setTab("log")}>出店記録</button>
        <button data-on={tab==="due"?1:0} onClick={() => setTab("due")}>
          未入金{pending > 0 && <span className="count">{pending}</span>}
        </button>
        <button data-on={tab==="stl"?1:0} onClick={() => setTab("stl")}>入金</button>
        <button data-on={tab==="col"?1:0} onClick={() => setTab("col")}>回収</button>
        <button data-on={tab==="sum"?1:0} onClick={() => setTab("sum")}>集計</button>
      </nav>

      {tab==="log" && <>
        <EntryForm onSave={add} venues={venues} organizers={organizers} />
        <div className="hint">記録を長押しすると直せます</div>
        <EventList events={events} onPick={setPicked} />
      </>}
      {(tab==="due" || tab==="stl") && <MailNotice pending={pending} />}
      {tab==="due" && <Unsettled events={events} onSettleMany={settleMany} />}
      {tab==="col" && <Collections collections={collections} />}
      {tab==="sum" && <Summary events={events} />}
      {tab==="stl" && <Settlements settlements={settlements} events={events}
                        onSave={addSettlement} onApply={applySettlement} />}

      {pickedEvent && <EditSheet event={pickedEvent} venues={venues} organizers={organizers} onSave={updateEvent}
                   onDelete={removeEvent} onClose={() => setPicked(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
